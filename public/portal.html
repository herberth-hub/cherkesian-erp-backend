<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal do Cliente — HC Quality Corporate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Cinzel:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101215; --ink-deep:#0a0b0d; --gold:#C0982C; --paper:#f7f6f3;
  --surface:#fff; --surface-alt:#fbfaf8; --blue-pale:#9FB4CC;
  --text:#101215; --text-body:#26292e; --text-muted:#4f545c; --text-dim:#6b7078; --text-faint:#8a8f97;
  --on-dark:#fff; --on-dark-2:#c8ccd2; --on-dark-3:#b9bdc4; --on-dark-4:#8a8f97; --on-dark-5:#5c6169;
  --rule:rgba(16,18,21,.12); --rule-soft:rgba(16,18,21,.08); --rule-input:rgba(16,18,21,.22); --rule-btn:rgba(16,18,21,.25);
  --rule-dark:rgba(255,255,255,.12); --rule-dark-2:rgba(255,255,255,.14); --rule-dark-input:rgba(255,255,255,.22);
  --danger:#A33A2B; --success:#2E6B4F; --warning:#8A6A14; --info:#1F4E79;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--ink)}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--gold);color:var(--ink)}

/* ===== Marca ===== */
.brand{display:flex;align-items:center;gap:15px}
.brand .hc{font:700 42px/1 Cinzel;letter-spacing:-.07em}
.brand .sep{width:1px;align-self:stretch;background:var(--rule-dark);min-height:44px}
.brand .col{display:flex;flex-direction:column}
.brand .q{font:400 19px/1.06 Cinzel;letter-spacing:.05em}
.brand .d1{font:400 8px/1.4 Cinzel;letter-spacing:.13em;color:var(--gold);margin-top:4px}
.brand .d2{font:400 8px/1.3 Cinzel;letter-spacing:.13em;color:var(--blue-pale)}
.brand.sm .hc{font-size:32px}.brand.sm .q{font-size:15px}.brand.sm .sep{min-height:34px}

/* ===== Login ===== */
.login{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;min-height:100vh}
@media(max-width:680px){.login{grid-template-columns:1fr}}
.login .left{background:var(--ink);color:#fff;padding:clamp(36px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:48px}
.login .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login .eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.login .eyebrow span{font:500 12px/1 'IBM Plex Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.login h1{font:600 clamp(30px,3.6vw,46px)/1.08 Archivo;letter-spacing:-.03em;max-width:440px;text-wrap:balance;margin:0}
.login .lead{font:400 16px/1.7 'IBM Plex Sans';color:var(--on-dark-3);max-width:420px;margin-top:22px;text-wrap:pretty}
.login .contact{font:400 14px/1.6 'IBM Plex Sans';color:var(--on-dark-4);border-top:1px solid var(--rule-dark-2);padding-top:26px;display:grid;gap:12px}
.login .contact a{color:var(--on-dark-4)}.login .contact a:hover{color:var(--gold)}
.login .right{background:var(--paper);padding:clamp(36px,5vw,72px);display:flex;align-items:center;justify-content:center}
.login form{width:100%;max-width:380px}
.login h2{font:600 26px/1.2 Archivo;letter-spacing:-.02em;margin:0}
.login .sub{font:400 15px/1.65 'IBM Plex Sans';color:var(--text-dim);margin:12px 0 32px}
.lbl{display:block;font:500 11px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:9px}
.inp{width:100%;background:#fff;border:1px solid var(--rule-input);padding:15px 16px;font:400 15px/1 'IBM Plex Sans';outline:none;color:var(--text)}
.inp:focus{border-color:var(--gold)}
.optrow{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.optrow label{display:flex;align-items:center;gap:8px;font:400 14px/1 'IBM Plex Sans';color:var(--text-muted)}
.optrow input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
.btn{border:0;font-family:'IBM Plex Sans'}
.btn-primary{width:100%;margin-top:28px;background:var(--ink);color:#fff;padding:17px;font:600 14px/1;letter-spacing:.02em;transition:background .14s ease-out,color .14s ease-out}
.btn-primary:hover{background:var(--gold);color:var(--ink)}
.login .foot{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule);font:400 14px/1.6;color:var(--text-dim)}
.err{background:rgba(163,58,43,.08);border:1px solid rgba(163,58,43,.35);color:var(--danger);font:400 13px/1.5;padding:11px 13px;margin-top:16px}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:auto 1fr;align-items:stretch;min-height:100vh}
.side{background:var(--ink);color:#fff;width:clamp(220px,18vw,264px);padding:26px 0;display:flex;flex-direction:column;justify-content:space-between}
.side .top{padding:0 24px 26px;border-bottom:1px solid var(--rule-dark)}
.side .descr{font:500 7px/1.3 'IBM Plex Mono';letter-spacing:.1em;color:var(--gold);margin-top:14px}
.nav{display:flex;flex-direction:column;margin-top:22px}
.nav a{display:flex;align-items:center;gap:14px;padding:14px 24px;font:500 15px/1 'IBM Plex Sans';color:var(--on-dark-2);border-left:2px solid transparent;transition:background .14s,color .14s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.active{color:#fff;border-left-color:var(--gold)}
.nav a.soon{color:var(--on-dark-5)}
.nav a .tag{margin-left:auto;font:500 8px/1 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-5);border:1px solid var(--rule-dark);padding:3px 5px}
.side .base{padding:22px 24px 0;border-top:1px solid var(--rule-dark);margin-top:32px}
.side .base .k{font:500 10px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-5)}
.side .base .nm{font:500 15px/1.4 'IBM Plex Sans';color:#fff;margin-top:10px}
.side .base .em{font:400 13px/1.5;color:var(--on-dark-4)}.side .base .em:hover{color:var(--gold)}
.side .base .sair{display:inline-block;background:none;border:0;padding:0;font:500 13px/1 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-4);margin-top:20px}
.side .base .sair:hover{color:var(--gold)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--rule);padding:20px clamp(20px,3vw,44px);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.topbar .k{font:500 10px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
.topbar .rz{font:600 17px/1.3 Archivo;letter-spacing:-.01em;margin-top:7px}
.topbar .doc{font:400 13px/1.4 'IBM Plex Mono';color:var(--text-faint);margin-top:5px}
.topbar .right{display:flex;align-items:center;gap:16px}
.avatar{display:flex;align-items:center;gap:11px}
.avatar .sq{width:34px;height:34px;background:var(--ink);color:#fff;font:600 13px/1 Archivo;display:flex;align-items:center;justify-content:center}
.avatar .nm{font:500 14px/1.2}.avatar .cg{font:400 12px/1.3;color:var(--text-faint)}
.previewbar{background:var(--surface-alt);border-bottom:1px solid var(--rule);padding:12px clamp(20px,3vw,44px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:400 13px/1 'IBM Plex Sans';color:var(--text-muted)}
.previewbar .inp{width:auto;max-width:140px;padding:9px 11px;font-size:13px}
.previewbar .btn-sec{padding:9px 16px}
.content{flex:1;padding:clamp(26px,3vw,44px);min-width:0}

/* ===== Cabeçalhos de tela ===== */
.h1{font:600 clamp(24px,2.6vw,34px)/1.15 Archivo;letter-spacing:-.025em;margin:0}
.screen-sub{font:400 16px/1.7 'IBM Plex Sans';color:var(--text-dim);margin-top:12px}

/* ===== KPIs ===== */
.kpis{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.kpi{background:#fff;padding:26px 24px}
.kpi .k{font:500 11px/1.4 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.kpi .n{font:600 clamp(26px,3vw,38px)/1 Archivo;letter-spacing:-.03em;margin-top:14px}
.kpi .n.danger{color:var(--danger)}
.kpi .note{font:400 13px/1.5 'IBM Plex Sans';color:var(--text-dim);margin-top:8px}

/* ===== Alerta ===== */
.alert{margin-top:28px;background:#fff;border:1px solid var(--rule);border-left:2px solid var(--danger);padding:24px 26px}
.alert .eb{font:500 11px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--danger)}
.alert h3{font:600 17px/1.35 Archivo;letter-spacing:-.01em;margin:12px 0 0}
.alert p{font:400 16px/1.7 'IBM Plex Sans';color:var(--text-muted);max-width:640px;margin:10px 0 0}
.alert .cta{margin-top:16px;background:var(--ink);color:#fff;padding:13px 22px;font:600 13px/1;transition:background .14s,color .14s}
.alert .cta:hover{background:var(--gold);color:var(--ink)}

/* ===== Tabela (grid) ===== */
.tbl-wrap{border:1px solid var(--rule);overflow-x:auto}
.tbl{min-width:var(--minw,880px)}
.tbl .thead,.tbl .trow{display:grid;grid-template-columns:var(--cols)}
.tbl .thead{background:var(--surface-alt);border-bottom:1px solid var(--rule)}
.tbl .thead > div{padding:14px 16px;font:500 10px/1 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.tbl .trow{border-bottom:1px solid var(--rule-soft);background:#fff;font:400 14px/1.5 'IBM Plex Sans';align-items:center}
.tbl .trow:last-child{border-bottom:0}
.tbl .trow > div{padding:15px 16px}
.tbl .num{text-align:right}
.tbl .code{font:500 13px/1.5 'IBM Plex Mono'}
.tbl .strong{font-weight:500}
.linkline{margin-top:22px}
.sectlink{font:500 14px/1 'IBM Plex Sans'}

/* ===== Abas ===== */
.tabs{display:flex;margin-top:30px;border-bottom:1px solid rgba(16,18,21,.16)}
.tabs button{background:none;border:0;padding:14px 24px;font:600 14px/1 'IBM Plex Sans';color:var(--text-dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .14s}
.tabs button:hover{color:var(--gold)}
.tabs button.active{color:var(--ink);border-bottom-color:var(--gold)}
.tab-help{font:400 15px/1.7 'IBM Plex Sans';color:var(--text-dim);max-width:680px;margin-top:24px}
.actions{margin-top:22px;display:flex;flex-wrap:wrap;gap:14px}
.btn-sec{background:#fff;border:1px solid var(--rule-btn);padding:13px 22px;font:600 13px/1;color:var(--ink);transition:border-color .14s}
.btn-sec:hover{border-color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff;border:0;padding:13px 22px;font:600 13px/1 'IBM Plex Sans';transition:background .14s,color .14s}
.btn-dark:hover{background:var(--gold);color:var(--ink)}

/* ===== Novo pedido ===== */
.novo{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(24px,3vw,40px);margin-top:24px;align-items:start}
@media(max-width:900px){.novo{grid-template-columns:1fr}}
.ctr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px}
.ctr-card{background:#fff;padding:24px 22px;text-align:left;border:0;cursor:pointer;font-family:'IBM Plex Sans';transition:background .14s}
.ctr-card:hover{background:var(--surface-alt)}
.ctr-card .eb,.ctr-head .eb{font:500 10px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ctr-card .t,.ctr-head .t{font:600 17px/1.3 Archivo;letter-spacing:-.01em;margin-top:10px;color:var(--ink)}
.ctr-card .s,.ctr-head .s{font:400 12px/1.6 'IBM Plex Mono';color:var(--text-faint);margin-top:8px}
.ctr-card .n{font:500 13px/1 'IBM Plex Sans';color:var(--text-muted);margin-top:16px}
.ctr-head{margin-top:28px;background:#fff;border:1px solid var(--rule);border-left:2px solid var(--gold);padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.pcard{background:#fff;display:flex;flex-direction:column}
.pfoto-wrap{position:relative;width:100%;aspect-ratio:1/1;background:var(--surface-alt);border-bottom:1px solid var(--rule);overflow:hidden}
.pfoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pfoto.ph{display:flex;align-items:center;justify-content:center;font:600 22px/1 Archivo;color:rgba(16,18,21,.16);letter-spacing:.06em}
.pnofoto{height:3px;background:var(--gold);opacity:.5}
.pbody{padding:14px 16px 16px}
.pn{font:500 14px/1.4 'IBM Plex Sans'}
.ps{font:400 11px/1.5 'IBM Plex Mono';color:var(--text-faint);margin-top:5px}
.ps b{font-weight:500;color:var(--success)}
.pp{font:600 15px/1.2 Archivo;margin:10px 0}
.cat{border:1px solid var(--rule);overflow-x:auto}
.qty{display:flex;flex-wrap:wrap;gap:5px}
.qty label{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px/1 'IBM Plex Mono';color:var(--text-faint);text-transform:uppercase}
.qty label b{font-weight:500;color:var(--success)}
.qty input{width:44px;padding:6px 3px;border:1px solid rgba(16,18,21,.2);font:500 13px/1 'IBM Plex Mono';text-align:center;outline:none;background:#fff;color:var(--text)}
.qty input:focus{border-color:var(--gold)}
.qty input.has{border-color:var(--ink);background:#fffbef}
.summary{background:var(--ink);color:#fff;padding:28px 26px;position:sticky;top:20px}
.summary .eb{font:500 11px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.summary .items{display:grid;gap:14px;margin-top:22px;padding-bottom:20px;border-bottom:1px solid var(--rule-dark-2)}
.summary .items>div{display:flex;justify-content:space-between;gap:12px;font:400 14px/1.5 'IBM Plex Sans';color:var(--on-dark-2)}
.summary .items b{font-weight:500;color:#fff;flex-shrink:0}
.summary .k{font:500 10px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-4);margin-top:20px}
.summary .v{font:500 16px/1;margin-top:8px}
.summary .total{font:600 24px/1 Archivo;letter-spacing:-.02em;margin-top:8px}
.summary .vazio{font:400 15px/1.7 'IBM Plex Sans';color:var(--on-dark-4);margin-top:22px}
.summary textarea{width:100%;margin-top:22px;background:transparent;border:1px solid var(--rule-dark-input);color:#fff;padding:13px 14px;font:400 14px/1.6 'IBM Plex Sans';resize:vertical;outline:none}
.summary textarea:focus{border-color:var(--gold)}
.summary .err{background:rgba(163,58,43,.18);border-color:rgba(163,58,43,.5);color:#f1c2b8}
.btn-gold{width:100%;margin-top:18px;background:var(--gold);color:var(--ink);border:0;padding:16px;font:600 14px/1 'IBM Plex Sans';transition:background .14s}
.btn-gold:hover{background:#fff}
.btn-gold:disabled{opacity:.45;cursor:default;background:var(--gold)}
.summary .note{font:400 13px/1.6;color:var(--on-dark-4);margin-top:14px}
.done{max-width:620px;margin-top:32px}
.done .mark{width:44px;height:44px;background:var(--gold);color:var(--ink);font:600 20px/1 Archivo;display:flex;align-items:center;justify-content:center}
.done p{font:400 17px/1.75 'IBM Plex Sans';color:var(--text-muted);margin:14px 0 0}
.done p b{font-weight:600;color:var(--ink)}
.cartbadge{display:flex;align-items:center;gap:8px;font:400 13px/1 'IBM Plex Sans';color:var(--text-muted);cursor:pointer}
.cartbadge .n{background:var(--gold);color:var(--ink);font:600 12px/1 'IBM Plex Mono';padding:6px 9px}


/* ===== Pills ===== */
.pill{font:500 11px/1.4 'IBM Plex Mono';letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;display:inline-block;white-space:nowrap;border:1px solid transparent}
.pill.ok{color:var(--success);border-color:rgba(46,107,79,.35)}
.pill.warn{color:var(--warning);border-color:rgba(192,152,44,.5)}
.pill.info{color:var(--info);border-color:rgba(31,78,121,.35)}
.pill.danger{color:var(--danger);border-color:rgba(163,58,43,.35);padding:5px 8px}

/* ===== Pedidos ===== */
.orders{display:grid;gap:18px;margin-top:32px}
.order{background:#fff;border:1px solid var(--rule)}
.order .head{padding:22px 26px;border-bottom:1px solid rgba(16,18,21,.1);display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between}
.order .num{display:flex;align-items:baseline;gap:14px;font:600 17px/1.3 Archivo;letter-spacing:-.01em}
.order .resumo{font:400 14px/1.6 'IBM Plex Sans';color:var(--text-dim);margin-top:9px}
.order .right{text-align:right}
.order .val{font:600 19px/1.2 Archivo;letter-spacing:-.01em}
.order .prev{font:400 13px/1.5;color:var(--text-dim);margin-top:6px}
.trail{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(16,18,21,.1)}
.trail .cell{background:#fff;padding:18px 20px}
.trail .bar{height:2px;margin-bottom:14px;background:var(--rule)}
.trail .cell.done .bar{background:var(--gold)}
.trail .nm{font:500 11px/1.3 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.trail .wh{font:400 14px/1.5 'IBM Plex Sans';color:var(--text-body);margin-top:8px}
.order .foot{padding:18px 26px;border-top:1px solid rgba(16,18,21,.1);background:var(--surface-alt);display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.order .foot a,.order .foot button{background:none;border:0;padding:0;font:500 14px/1 'IBM Plex Sans';color:var(--gold)}
.order .foot button:hover{color:var(--ink)}
.itemlist{border-top:1px solid var(--rule-soft);background:var(--surface-alt)}
.itemlist .it{display:grid;grid-template-columns:1fr 90px 90px;padding:11px 26px;border-bottom:1px solid var(--rule-soft);font:400 13px/1.5 'IBM Plex Sans'}
.itemlist .it:last-child{border-bottom:0}
.itemlist .it .num{text-align:right}
.itemlist .hd{font:500 10px/1 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);background:#fff}

/* ===== Placeholder Em breve ===== */
.soon-box{margin-top:32px;background:#fff;border:1px solid var(--rule);padding:44px 40px;max-width:620px}
.soon-box .eb{font:500 11px/1 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.soon-box h3{font:600 22px/1.25 Archivo;letter-spacing:-.02em;margin:14px 0 0}
.soon-box p{font:400 16px/1.75 'IBM Plex Sans';color:var(--text-muted);margin:12px 0 0}

.empty{margin-top:24px;font:400 15px/1.7 'IBM Plex Sans';color:var(--text-dim)}
.loading{margin-top:40px;font:400 14px/1 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:16px 20px}
  .side .top{border-bottom:0;padding:0}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0}
  .nav a{padding:10px 14px;border-left:0;border-bottom:2px solid transparent}
  .nav a.active{border-left:0;border-bottom-color:var(--gold)}
  .nav a .tag{display:none}
  .side .base{border-top:0;margin-top:0;padding:0;display:flex;align-items:center;gap:16px}
  .side .base .k,.side .base .em{display:none}
}
</style>
</head>
<body>
<div id="root"><div class="loading" style="padding:44px">Carregando…</div></div>
<script>
(function(){
'use strict';
var API='/api/v1';
var LS={access:'ckp_access',refresh:'ckp_refresh',user:'ckp_user'};
var S={access:null,refresh:null,user:null,view:'painel',tab:'consignado',data:{},loginErr:'',previewCli:'',expand:{},notasFiltro:{periodo:'12m',busca:''},cart:{},cartChave:'',novoObs:'',novoErr:'',enviando:false,feito:null,contratoId:'',fotos:{}};

// ---------- storage (localStorage se "manter conectado"; senão sessionStorage) ----------
function store(){ return S._persist===false ? sessionStorage : localStorage; }
function saveAuth(){ try{ var s=store(); s.setItem(LS.access,S.access); s.setItem(LS.refresh,S.refresh); s.setItem(LS.user,JSON.stringify(S.user)); }catch(e){} }
function loadAuth(){ try{
  var s=localStorage.getItem(LS.access)?localStorage:sessionStorage;
  S.access=s.getItem(LS.access); S.refresh=s.getItem(LS.refresh);
  S.user=JSON.parse(s.getItem(LS.user)||'null');
  S._persist = s===localStorage;
}catch(e){ S.user=null; } }
function clearAuth(){ try{ [localStorage,sessionStorage].forEach(function(s){ s.removeItem(LS.access);s.removeItem(LS.refresh);s.removeItem(LS.user); }); }catch(e){} }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function iniciais(n){ return String(n||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function dateBR(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return '—'; } }

// ---------- API ----------
async function api(path, opts){
  opts=opts||{};
  var headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(S.access && !opts.noauth) headers['Authorization']='Bearer '+S.access;
  var res=await fetch(API+path,{method:opts.method||'GET',headers:headers,body:opts.body?JSON.stringify(opts.body):undefined});
  if(res.status===401 && !opts.noauth && !opts._retry && S.refresh){
    var ok=await tryRefresh();
    if(ok) return api(path, Object.assign({},opts,{_retry:true}));
  }
  var text=await res.text(); var data=null; try{ data=text?JSON.parse(text):null; }catch(e){ data=text; }
  if(!res.ok){ var msg=(data&&(data.message||data.error))||('Erro '+res.status); var e=new Error(Array.isArray(msg)?msg.join(' · '):msg); e.status=res.status; throw e; }
  return data;
}
async function tryRefresh(){
  try{ var d=await api('/auth/refresh',{method:'POST',noauth:true,body:{refreshToken:S.refresh}}); S.access=d.accessToken; S.refresh=d.refreshToken; saveAuth(); return true; }
  catch(e){ doLogout(true); return false; }
}
function scopeQS(){ return (S.user && S.user.acesso==='total' && S.previewCli) ? ('?clienteId='+encodeURIComponent(S.previewCli)) : ''; }
function money(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function anoDe(d){ try{ return new Date(d).getFullYear(); }catch(e){ return 0; } }
// fetch autenticado (com renovação no 401) — p/ downloads de arquivo (DANFE/XML) que não passam pelo api().
async function fetchAuth(url, opts, _retry){
  opts=opts||{}; var headers=Object.assign({}, opts.headers||{});
  if(S.access) headers['Authorization']='Bearer '+S.access;
  var res=await fetch(url, Object.assign({},opts,{headers:headers}));
  if(res.status===401 && !_retry && S.refresh){ var ok=await tryRefresh(); if(ok) return fetchAuth(url,opts,true); }
  return res;
}

// ---------- Auth ----------
async function doLogin(usuario, senha, persist){
  S.loginErr=''; render();
  try{
    S._persist = !!persist;
    var d=await api('/auth/login',{method:'POST',noauth:true,body:{usuario:usuario,senha:senha}});
    S.access=d.accessToken; S.refresh=d.refreshToken; S.user=d.usuario;
    if(S.user.acesso!=='cliente' && S.user.acesso!=='total'){
      S.access=S.refresh=S.user=null; S.loginErr='Este acesso não é do portal do cliente.'; render(); return;
    }
    saveAuth(); S.view='painel'; S.previewCli=''; S.data={}; S.contratoId=''; render(); loadView();
  }catch(e){
    S.loginErr = e.status===401 ? 'E-mail ou senha incorretos.' : (e.message||'Falha no login.'); render();
  }
}
function doLogout(silent){ clearAuth(); S.access=S.refresh=S.user=null; S.data={}; S.previewCli=''; S.cart={}; S.cartChave=''; S.feito=null; render(); }

// ---------- Carrinho (persistido por cliente no localStorage — não se perde ao recarregar) ----------
function cartKey(){ return 'ckp_cart_'+(S.user?(S.user.clienteId||('adm'+(S.previewCli||''))):'x')+'_c'+(S.contratoId||'0'); }
function saveCart(){ try{ localStorage.setItem(cartKey(),JSON.stringify({cart:S.cart,chave:S.cartChave,obs:S.novoObs})); }catch(e){} }
function loadCart(){ try{ var d=JSON.parse(localStorage.getItem(cartKey())||'null'); S.cart=(d&&d.cart)||{}; S.cartChave=(d&&d.chave)||''; S.novoObs=(d&&d.obs)||''; }catch(e){ S.cart={}; S.cartChave=''; S.novoObs=''; } }
function novaChave(){ try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
function cartCount(){ var n=0; Object.keys(S.cart).forEach(function(pid){ Object.keys(S.cart[pid]).forEach(function(t){ n+=Number(S.cart[pid][t])||0; }); }); return n; }
// Contrato atual do Novo pedido ('outros' = produtos fora de contrato, preço de tabela).
function contratoAtual(){ var d=S.data.contratos; if(!d||!S.contratoId) return null; if(S.contratoId==='outros') return {id:'outros',outros:true,itens:d.outros||[]}; return (d.contratos||[]).find(function(c){return String(c.id)===String(S.contratoId);})||null; }
function itemKey(it){ return it.contratoItemId?('ci'+it.contratoItemId):('p'+it.produtoId); }
function tituloContrato(c){ return c.unidade?c.unidade.nome:(c.descricao||('Contrato '+(c.numero||c.id))); }
function subtituloContrato(c){ var p=[]; if(c.numero) p.push('Contrato '+esc(c.numero)); if(c.unidade&&c.descricao) p.push(esc(c.descricao)); if(c.filial) p.push('Emissora: '+esc(c.filial.nome)); if(c.condicaoPagamento) p.push('Pagamento: '+esc(c.condicaoPagamento)); if(c.prazoEntrega) p.push('Prazo de produção: '+esc(c.prazoEntrega)); return p.join(' · '); }
// Preço de um tamanho: a faixa de tamanhos grandes (G1…G8) vale inclusive sobre o preço de
// contrato — é o que o pedido cobra. O servidor só manda precoEspecial quando ela existe.
function precoTam(it,tam){ if(it.preco==null) return 0; if(it.precoEspecial!=null&&(it.tamsEspeciais||[]).indexOf(String(tam).toUpperCase())>=0) return Number(it.precoEspecial); return Number(it.preco); }
function cartLines(){ var c=contratoAtual(); if(!c) return []; var out=[]; (c.itens||[]).forEach(function(it){ var g=S.cart[itemKey(it)]; if(!g) return; var q=0,sub=0; Object.keys(g).forEach(function(t){ var n=Number(g[t])||0; if(n>0){ q+=n; sub+=n*precoTam(it,t); } }); if(q>0) out.push({it:it,qtd:q,sub:sub}); }); return out; }
// Fotos dos produtos: endpoint autenticado -> blob (cache em S.fotos; 'none' = sem foto).
async function carregarFotos(){
  var imgs=document.querySelectorAll('img[data-foto]:not([src])'); if(!imgs.length) return;
  Array.prototype.forEach.call(imgs,function(img){ (async function(){ var pid=img.getAttribute('data-foto'); if(S.fotos[pid]==='none'){ img.remove(); return; } if(S.fotos[pid]){ img.src=S.fotos[pid]; return; }
    try{ var r=await fetchAuth(API+'/portal/produtos/'+pid+'/foto'+scopeQS()); if(!r.ok){ S.fotos[pid]='none'; img.remove(); return; } var b=await r.blob(); S.fotos[pid]=URL.createObjectURL(b); img.src=S.fotos[pid]; }catch(e){ S.fotos[pid]='none'; } })(); });
}
async function enviarPedido(){
  var lines=cartLines(); if(!lines.length||S.enviando) return;
  if(!S.cartChave){ S.cartChave=novaChave(); saveCart(); }
  var itens=lines.map(function(l){ var g=S.cart[itemKey(l.it)]||{}; var ks=Object.keys(g).filter(function(t){return Number(g[t])>0;});
    var base=l.it.contratoItemId?{contratoItemId:l.it.contratoItemId}:{produtoId:l.it.produtoId};
    if(ks.length===1&&ks[0]==='UN') return Object.assign(base,{quantidade:Number(g.UN)});
    var grade={}; ks.forEach(function(t){ if(t!=='UN') grade[t]=Number(g[t]); }); return Object.assign(base,{grade:grade}); });
  S.enviando=true; S.novoErr=''; render();
  try{
    var r=await api('/portal/pedidos'+scopeQS(),{method:'POST',body:{itens:itens,contratoId:(S.contratoId&&S.contratoId!=='outros')?Number(S.contratoId):undefined,observacao:(S.novoObs||'').trim()||undefined,chaveIdempotencia:S.cartChave}});
    S.feito=r; S.cart={}; S.cartChave=''; S.novoObs=''; saveCart(); S.data.producao=null; S.data.resumo=null; S.data.contratos=null;
  }catch(e){ S.novoErr=e.message||'Não foi possível enviar o pedido. Tente novamente.'; }
  S.enviando=false; render();
}

// ---------- Data ----------
// Contratos do cliente p/ o Novo pedido e o catálogo; contratos sem itens não aparecem (nada a pedir).
async function carregarContratos(qs){ var r=await api('/portal/contratos'+qs); r.contratos=(r.contratos||[]).filter(function(c){ return (c.itens||[]).length>0; }); S.data.contratos=r; }
async function loadView(){
  var v=S.view;
  render(); // mostra loading
  try{
    var qs=scopeQS();
    if(v==='painel'){
      var r=await Promise.all([api('/portal/resumo'+qs), api('/portal/producao'+qs)]);
      S.data.resumo=r[0]; S.data.producao=r[1];
    } else if(v==='estoque'){
      if(S.tab==='disponivel'){ if(!S.data.contratos) await carregarContratos(qs); }
      else S.data.estoque=await api('/portal/estoque'+qs);
    } else if(v==='pedidos'){
      S.data.producao=await api('/portal/producao'+qs);
    } else if(v==='notas'){
      S.data.notas=await api('/portal/notas'+qs);
    } else if(v==='novo'){
      if(!S.data.contratos) await carregarContratos(qs);
    }
    S.dataErr=''; render();
  }catch(e){
    if(e.status===400 && S.user.acesso==='total'){ S.dataErr='__PREVIEW__'; }
    else S.dataErr=e.message||'Erro ao carregar.';
    render();
  }
}

// ---------- Render: telas ----------
function pillPedido(p){
  if(p.etapa==='orcamento') return {t:'Aguardando validação',c:'warn'}; // pedido enviado pelo portal, ainda não validado
  if(p.etapa==='concluido') return {t:'Entregue',c:'ok'};
  if(p.etapa==='expedicao'||p.etapa==='parcial') return {t:'Em expedição',c:'info'};
  if(p.etapa==='estoque') return {t:'Pronto p/ expedição',c:'info'};
  if(p.etapa==='producao') return {t:'Em produção',c:'warn'};
  return {t:(p.etapaLabel||'Em preparação'),c:'warn'};
}
function trilha(p){
  var passoDe={aprovado:1,piloto:2,material:3,compra:3,producao:4,estoque:5,expedicao:6,parcial:6,concluido:7};
  var passo=passoDe[p.etapa]||1;
  return [
    {nm:'Recebido',feito:passo>=1,wh:dateBR(p.data)},
    {nm:'Em produção',feito:passo>=4,wh:passo>=4?'✓':'—'},
    {nm:'Em expedição',feito:passo>=6,wh:passo>=6?'✓':'—'},
    {nm:'Entregue',feito:p.etapa==='concluido',wh:p.etapa==='concluido'?'✓':'—'}
  ];
}
function resumoItens(p){

  var s=uniq.slice(0,2).join(', ')+(uniq.length>2?' +'+(uniq.length-2):'');
  return (p.totalPecas||0).toLocaleString('pt-BR')+' peças'+(s?' · '+s:'');
}

// Baixa DANFE (abre no navegador) ou XML (download). Escopo travado no backend.
async function baixarNota(ev, id, tipo){
  if(ev){ ev.preventDefault(); }
  var link=ev&&ev.currentTarget, orig=link?link.textContent:'';
  if(link){ link.textContent='…'; link.style.pointerEvents='none'; }
  try{
    var res=await fetchAuth(API+'/portal/notas/'+id+'/'+tipo+scopeQS());
    if(!res.ok){ var t=await res.text(); var msg; try{ msg=JSON.parse(t).message; }catch(e){ msg=t; } throw new Error(msg||('Erro '+res.status)); }
    var blob=await res.blob(), url=URL.createObjectURL(blob);
    if(tipo==='danfe'){ window.open(url,'_blank'); }
    else { var a=document.createElement('a'); a.href=url; a.download='NFe-'+id+'.xml'; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(e){ alert('Não foi possível baixar o arquivo: '+(e.message||'erro')); }
  finally{ if(link){ link.textContent=orig; link.style.pointerEvents=''; } }
  return false;
}

function exportEstoque(){
  var e=S.data.estoque; if(!e||!e.itens) return;
  var linhas=[['SKU','Produto','Cor','Tamanho','Disponivel']];
  e.itens.forEach(function(it){ (it.tamanhos||[]).forEach(function(t){ linhas.push([it.codigo,it.descricao,it.cor||'',t.tamanho||'Unico',t.saldo||0]); }); });
  var csv=linhas.map(function(r){ return r.map(function(c){ var s=String(c==null?'':c); return /[",;\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; }).join(';'); }).join('\r\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='pronta-entrega-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); },1500);
}

  var h=(location.hash||'').replace(/^#/,'');
  if(['painel','estoque','pedidos','notas','novo'].indexOf(h)>=0 && h!==S.view){ S.view=h; S.dataErr=''; loadView(); }
});
})();
</script>
