<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherkesian ERP</title>
<!-- PWA / instalar no iPhone e Android -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E2C48">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cherkesian">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --onyx:#0A0A0A; --onyx2:#100f0d; --sidebar:#131109; --sidebar2:#1b1810;
  --gold:#C9A227; --gold-d:#9a7d1e; --gold-l:#E4C76B;
  --ivory:#F4F2ED; --bg:#f4f2ed; --card:#ffffff; --ink:#242a26; --ink2:#3c433d;
  --muted:#807d72; --muted2:#93998f; --line:#e6e4dc; --line2:#eceae2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfccc2;border-radius:6px}
h1,h2,h3{font-family:'Sora',sans-serif;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.gold{color:var(--gold-d)}
a{color:var(--gold-d);text-decoration:none}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--onyx)}
#login .brandcol{background:var(--onyx);padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
#login .formcol{background:var(--onyx2);padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.emblem{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Sora';font-weight:800;font-size:30px}
.kicker{font-size:10px;letter-spacing:.38em;color:var(--gold);font-weight:600;font-family:'Sora'}
.wordmark{font-family:'Sora';font-weight:700;font-size:30px;letter-spacing:.02em;color:var(--ivory);line-height:1}
.subm{font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-top:6px}
.tagline{font-family:'Sora';font-weight:600;font-size:19px;color:var(--gold-l);line-height:1.35;margin-top:40px}
.formcard{width:100%;max-width:360px;margin:0 auto}
.formcard h2{color:var(--ivory);font-size:22px}
.formcard .hint{font-size:12.5px;color:var(--muted);margin-top:5px;margin-bottom:24px}
.field-lbl{font-size:11px;color:var(--muted2);margin-bottom:6px;display:block}
.inp-dark{width:100%;height:44px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:var(--onyx);color:var(--ivory);padding:0 14px;font-size:14px;outline:none;margin-bottom:16px}
.inp-dark:focus{border-color:var(--gold)}
.btn-gold{height:46px;border:none;border-radius:10px;background:var(--gold);color:#0A0A0A;font-size:14px;font-weight:700;font-family:'Sora';width:100%}
.btn-gold:hover{background:var(--gold-l)}
.biz{display:flex;gap:9px;align-items:center;margin-top:18px}
.biz .dot{width:7px;height:7px;border-radius:50%;flex:none}
.biz .lbl{font-size:11px;color:var(--muted2);line-height:1.4}
.err{color:#e8998f;font-size:12.5px;margin-top:6px;min-height:16px}
.creds{margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.creds .t{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.creds .row{font-size:11px;color:var(--muted2);font-family:'IBM Plex Mono';line-height:1.7;cursor:pointer}
.creds .row:hover{color:var(--gold-l)}

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:248px 1fr;height:100%}
#side{background:var(--sidebar);color:#cfc9b8;display:flex;flex-direction:column;overflow-y:auto}
#side .head{padding:20px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06)}
#side .emblem-sm{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Sora';font-weight:800;font-size:15px;flex:none}
#side .grp{padding:14px 12px 2px}
#side .grp .gt{font-size:9.5px;letter-spacing:.18em;color:#6d6857;text-transform:uppercase;padding:0 8px 6px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:#c7c1b1;cursor:pointer;margin-bottom:1px;text-decoration:none}
.navitem:hover{text-decoration:none}
.navitem:hover{background:rgba(255,255,255,.05);color:#fff}
.navitem.active{background:var(--gold);color:#0A0A0A;font-weight:600}
.navitem svg{width:16px;height:16px;flex:none}
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#top{height:64px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex:none}
#top .tt{font-size:17px;font-weight:700}
#top .ts{font-size:12px;color:var(--muted);margin-top:2px}
#top .user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:13px}
.btn-ghost{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font-size:12.5px;font-weight:600}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-d)}
#content{padding:24px 26px;overflow-y:auto}

/* ---------- Components ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:11px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-family:'Sora';font-weight:700;font-size:24px;margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--muted2);margin-top:4px}
.sect{margin-top:26px}
.sect h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:#faf9f5;font-weight:600}
td{font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--ink2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfbf7}
/* Coluna de seleção (checkbox) estreita e centralizada */
th:has(#pg_all),th:has(#rc_all),td:has(.pg_chk),td:has(.rc_chk){width:34px;text-align:center;padding-left:8px;padding-right:8px}
.pg_chk,.rc_chk,#pg_all,#rc_all{width:16px;height:16px;cursor:pointer;accent-color:#C9A227;margin:0}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.pill.gold{background:#f7efd3;color:var(--gold-d)}
.pill.green{background:#e3f5e9;color:#1f8a4c}
.pill.red{background:#fbe6e2;color:#c14a34}
.pill.blue{background:#e5eefb;color:#2563a8}
.pill.gray{background:#eeece5;color:#6d6857}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.btn-primary{height:38px;padding:0 16px;border:none;border-radius:9px;background:var(--gold);color:#0A0A0A;font-size:13px;font-weight:700;font-family:'Sora'}
.btn-primary:hover{background:var(--gold-l)}
.btn-sm{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink2);font-size:12px;font-weight:600}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-d)}
.inp{height:38px;border:1px solid #dcdfd6;border-radius:8px;padding:0 12px;font-size:13px;color:var(--ink);background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
label.fl{font-size:11px;color:var(--muted);margin-bottom:5px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.spin{width:22px;height:22px;border:2.5px solid #e6e2d4;border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px}
/* ===== Janelas internas (multi-janela, minimizar, ESC) ===== */
#winbg{position:fixed;inset:0;background:rgba(10,10,10,.14);display:none;z-index:49;pointer-events:none}
#winlayer{position:fixed;inset:0;z-index:50;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.28);width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e7e3d8}
.win.wide{width:min(1240px,96vw);max-height:94vh}
.win.wide .win-body{padding:12px}
.win-hd{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:#f4f2ed;border-bottom:1px solid #e7e3d8;cursor:move;user-select:none}
.win-hd .t{flex:1;font-weight:700;font-size:13.5px;color:#3a2f08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-hd button{border:none;background:transparent;font-size:15px;line-height:1;cursor:pointer;padding:3px 8px;border-radius:6px;color:#6a5f38}
.win-hd button:hover{background:#e7e0cc}
.win-body{padding:20px;overflow-y:auto}
#windock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px 10px;z-index:53;pointer-events:none;flex-wrap:wrap}
#windock .chip{pointer-events:auto;background:#3a2f08;color:#f4f2ed;border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer;display:flex;gap:9px;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3);max-width:240px}
#windock .chip .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#windock .chip .cx{opacity:.65;font-weight:700}#windock .chip .cx:hover{opacity:1}
/* ===== Kanban ===== */
.kanban{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;align-items:flex-start}
.kcol{min-width:210px;max-width:250px;flex:0 0 auto;background:#f4f2ed;border:1px solid #e7e3d8;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
.kcol h4{margin:0;font-size:11.5px;color:#6a5f38;display:flex;justify-content:space-between;align-items:center;padding:2px 4px;text-transform:uppercase;letter-spacing:.4px}
.kcol h4 .n{background:#e7dcc0;color:#5a4d1f;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:800}
.kcard{background:#fff;border:1px solid #e7e3d8;border-left:3px solid #caa53d;border-radius:8px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:12px}
.kcard .kt{font-weight:800;color:#3a2f08;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kcard .kmuted{color:#8a7f57;font-size:11px;margin-top:2px;line-height:1.3}
.kcard .kbar{height:5px;background:#eee;border-radius:4px;margin-top:6px;overflow:hidden}.kcard .kbar > i{display:block;height:100%;background:var(--gold)}
.kcol .kempty{color:#b3a878;font-size:11px;text-align:center;padding:6px 0}
.modal-box h3{font-size:17px;margin-bottom:16px}
.mrow{margin-bottom:12px}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.tst{background:#131109;color:#fff;border-left:3px solid var(--gold);padding:12px 16px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slideup .25s}
.tst.ok{border-left-color:#2fae63}.tst.err{border-left-color:#e05a3c}
@keyframes slideup{from{transform:translateY(10px);opacity:0}}
.gate{background:var(--onyx2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px;max-width:420px;color:var(--ivory)}
.hamb{display:none;background:transparent;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer;align-items:center;justify-content:center;color:var(--ink);flex:none}
#navmask{display:none}
@media(max-width:860px){
  #shell{grid-template-columns:1fr}
  #side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:84vw;z-index:1000;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 34px rgba(0,0,0,.55)}
  #shell.navopen #side{transform:translateX(0)}
  #navmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999}
  #shell:not(.navopen) #navmask{display:none}
  #shell.navopen #navmask{display:block}
  .hamb{display:inline-flex}
  #top{height:58px;padding:0 12px}
  #top .tt{font-size:15px}
  #top .ts{display:none}
  #top .user>div:first-child{display:none}
  #content{padding:14px}
  #login{grid-template-columns:1fr}#login .brandcol{display:none}
}
</style>
</head>

};

// ---------- API ----------
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(S.access && !opts.noauth) headers['Authorization'] = 'Bearer '+S.access;
  // Overlay "processando" automático em toda operação que grava (evita clique/comando duplicado).
  const mut = /^(POST|PATCH|PUT|DELETE)$/i.test(opts.method||'GET');
  const showProc = mut && !opts.silent && !opts.noauth && !opts._retry;
  if(showProc) procBegin(opts.procLabel);
  try{
    let res = await fetch(API+path, { method:opts.method||'GET', headers, body: opts.body?JSON.stringify(opts.body):undefined });
    if(res.status===401 && !opts.noauth && !opts._retry && S.refresh){
      const ok = await tryRefresh();
      if(ok) return await api(path, Object.assign({}, opts, {_retry:true}));
    }
    const text = await res.text();
    let data = null; try{ data = text?JSON.parse(text):null; }catch(e){ data = text; }
    if(!res.ok){
      const msg = (data && (data.message||data.error)) || ('Erro '+res.status);
      const e = new Error(Array.isArray(msg)?msg.join(' · '):msg); e.status=res.status; e.data=data; throw e;
    }
    return data;
  } finally {
    if(showProc) procEnd();
  }
}
async function tryRefresh(){
  try{
    const d = await api('/auth/refresh', {method:'POST', noauth:true, body:{refreshToken:S.refresh}});
    S.access=d.accessToken; S.refresh=d.refreshToken;
    localStorage.setItem(LS.access,S.access); localStorage.setItem(LS.refresh,S.refresh);
    return true;
  }catch(e){ logout(true); return false; }
}

// ---------- Auth ----------
async function doLogin(usuario, senha){
  S.loginErr=''; renderLogin();
  try{
    const d = await api('/auth/login', {method:'POST', noauth:true, body:{usuario, senha}});
    onAuthed(d);
  }catch(e){
    if(e.status===403){ // fora do horário -> gate do admin
      S.gate = { usuario, senha }; S.gateErr=''; renderLogin();
    } else { S.loginErr = e.message || 'Falha no login.'; renderLogin(); }
  }
}
async function doGate(adminUsuario, adminSenha){
  S.gateErr=''; renderLogin();
  try{
    const d = await api('/auth/authorize-offhours', {method:'POST', noauth:true,
      body:{ usuario:S.gate.usuario, senha:S.gate.senha, adminUsuario, adminSenha }});
    S.gate=null; onAuthed(d);
  }catch(e){ S.gateErr = e.message || 'Autorização negada.'; renderLogin(); }
}
function onAuthed(d){
  S.access=d.accessToken; S.refresh=d.refreshToken; S.user=d.usuario;
  localStorage.setItem(LS.access,S.access); localStorage.setItem(LS.refresh,S.refresh);
  localStorage.setItem(LS.user, JSON.stringify(d.usuario));
  const allowed = ACCESS[S.user.acesso];
  S.route = (allowed==='*') ? 'dashboard' : (allowed.includes('dashboard')?'dashboard':firstReady(allowed));
  // Se a URL trouxe #rota (ex.: aberto em nova aba), abre direto nela.
  const hr=(location.hash||'').replace(/^#/,'');
  if(hr && canAccess(hr)) S.route=hr;
  S.cache={};
  renderShell(); loadRoute(); checkDeepLink();
  toast('Bem-vindo, '+S.user.nome.split(' ')[0]+'!', 'ok');
}
function firstReady(allowed){ for(const r of allowed){ if(READY.has(r)) return r; } return allowed[0]; }
function logout(silent){
  S.user=S.access=S.refresh=null; S.cache={};
  localStorage.removeItem(LS.access); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user);
  renderLogin(); if(!silent) toast('Sessão encerrada.');
}
function canAccess(route){ const a=ACCESS[S.user.acesso]; return a==='*'||a.includes(route); }

      <div class="chart-lbl">${esc(e.label)}</div>

    </div>`).join('') +`</div>`;
}

async function verCatalogoForn(id){

    if(!rr.ok){ toast('Catálogo não encontrado.','err'); return; }

function uploadCatalogoForn(id){ const el=$('forn_cat_file'); if(el) el.click(); }
async function uploadCatalogoFornGo(id){

function pedidosKanban(arr){

  const cols=[...COLS,...extra];
  return `<div class="kanban">${cols.map(([et,lbl])=>{
    const items=arr.filter(p=>p.etapa===et);
    return `<div class="kcol"><h4>${esc(lbl)} <span class="n">${items.length}</span></h4>${items.length?items.map(p=>`<div class="kcard" style="cursor:pointer" title="Abrir PDF do pedido" onclick="APP.gerarDoc('pedido',${p.id})">
        <div class="kt"><span class="mono gold">${esc(p.numero)}</span><span>${money(p.valorTotal)}</span></div>
        <div class="kmuted">${esc(p.cliente?p.cliente.nome:'—')}${p.unidadeNome?' · 📍 '+esc(p.unidadeNome):''}</div>
        <div class="kmuted">${(p.itens||[]).reduce((a,i)=>a+(Number(i.quantidade)||0),0)} pç${p.nfs&&p.nfs.length?(' · NF '+esc(p.nfs[0].numero)):''}</div>
      </div>`).join(''):'<div class="kempty">—</div>'}</div>`;
  }).join('')}</div>`;
}
function renderPedidos(){

  if(fil) arr=arr.filter(p=>p.unidadeNome===fil);
  if(q){
    const qn=_numBusca(q); // normaliza "7.710,00"/"7710" p/ comparar com o valor
    arr=arr.filter(p=>{
      const hay=[p.numero, p.cliente&&p.cliente.nome, p.unidadeNome, p.unidadeCnpj, p.ordemCompraCliente, p.filial&&p.filial.nome, p.etapa, (p.nfs||[]).map(n=>n.numero).join(' ')].join(' ').toLowerCase();
      const valBate = qn && Number(p.valorTotal||0).toFixed(2).includes(qn);
      return hay.includes(q) || valBate;
    });
  }
  const ativos=arr.filter(p=>p.etapa!=='cancelado'); // cancelados não somam nos totais
  const pecas=ativos.reduce((s,p)=>s+(p.itens||[]).reduce((a,i)=>a+(Number(i.quantidade)||0),0),0);
  const valor=ativos.reduce((s,p)=>s+(Number(p.valorTotal)||0),0);
  const bonif=ativos.filter(p=>p.bonificacao).reduce((s,p)=>s+(Number(p.valorTotal)||0),0);
  const k=$('ped_kpis'); if(k) k.innerHTML = kpi('Pedidos', arr.length, (q||et||fil)?'no filtro':'total') + kpi('Peças', pecas.toLocaleString('pt-BR'), 'somatório') + kpi('Valor total', money(valor), 'somatório') + (bonif>0?kpi('🎁 Bonificado', money(bonif), 'sem cobrança'):'');
  const tbl=$('ped_tbl'); if(!tbl) return;
  if(window.__pedKanban){ tbl.innerHTML = pedidosKanban(arr); return; }
  const bulkBar = arr.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;padding:8px 10px;background:#faf8f0;border:1px solid #efe2b8;border-radius:8px">
      <span id="pedselinfo" class="muted" style="font-size:12px;font-weight:600">0 selecionado(s)</span>
      <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-sm" onclick="APP.pedBaixarSel()">⬇️ Baixar PDF</button>
        <button class="btn-sm" onclick="APP.pedEmailSel()">✉️ Enviar e-mail</button>
        <button class="btn-sm danger" onclick="APP.pedCancelarSel()">🚫 Cancelar selecionados</button>
      </div></div>` : '';
  tbl.innerHTML = bulkBar + panelTable(
    ['<input type="checkbox" id="pedallck" onclick="APP.pedToggleAll(this.checked)" title="Selecionar todos">','Número','Cliente','Empresa','Total','Etapa','NF-e','OP / OC','Ações'],
    arr.map(p=>[
      `<input type="checkbox" class="pedck" value="${p.id}" onclick="APP.pedSelInfo()">`,
      `<span class="mono gold">${esc(p.numero)}</span>${p.bonificacao?'<div><span class="pill" style="background:#f3e8ff;color:#6b3fa0;font-size:9px">🎁 bonif.</span></div>':''}`,
      `${esc(p.cliente?p.cliente.nome:('#'+p.clienteId))}${p.unidadeNome?`<div style="font-size:11px;color:#2b4a8b;font-weight:600;margin-top:1px">📍 ${esc(p.unidadeNome)}${p.unidadeCnpj?' · <span class="mono" style="font-weight:400">'+esc(p.unidadeCnpj)+'</span>':''}</div>`:''}`,
      p.filial?`<span class="pill ${p.filial.matriz?'gold':'gray'}">${esc(p.filial.nome)}</span>`:'<span class="muted">—</span>',
      money(p.valorTotal),
      etapaCell(p),
      pedNfCol(p.nfs),
      pedProdCol(p.opsNumeros, p.ocsNumeros),
      pedidoAcoes(p)
    ]), arr.length?null:'Nenhum pedido no filtro.');
}
function etapaColor(e){ if(e==='cancelado')return'red'; if(e==='orcamento')return'gray'; if(e==='concluido'||e==='faturado')return'gold'; if(e==='producao'||e==='expedicao'||e==='estoque')return'green'; if(e==='compra')return'red'; return'blue'; }
// Quanto ainda falta expedir do pedido (soma dos residuais por item/tamanho).
function pedFaltaExpedir(p){
  return (p.itens||[]).reduce((s,it)=>{
    const g = it.grade && Object.keys(it.grade).length ? it.grade : null;
    if(g){ const ja=it.gradeExpedida||{}; return s + Object.entries(g).reduce((a,[t,q])=>a+Math.max(0,Number(q)-Number(ja[t]||0)),0); }
    return s + Math.max(0,(Number(it.quantidade)||0)-(Number(it.quantidadeExpedida)||0));
  },0);
}
// Célula de etapa: 'parcial' vira pill âmbar clicável mostrando o que falta expedir.
function etapaCell(p){
  if(p.etapa==='parcial'){
    const f=pedFaltaExpedir(p);
    return `<span class="pill" style="background:#f6ad3722;color:#9a5a00;border:1px solid #e0a94a;cursor:pointer" title="Abrir o que falta expedir" onclick="APP.formExpParcial(${p.id})">parcial</span>${f>0?`<div style="font-size:10.5px;color:#9a5a00;margin-top:3px;cursor:pointer" onclick="APP.formExpParcial(${p.id})">faltam ${f} pç</div>`:''}`;
  }
  return `<span class="pill ${etapaColor(p.etapa)}">${esc(p.etapa)}</span>`;
}
function pedNfCol(nfs){
  if(!nfs||!nfs.length) return '<span class="muted">—</span>';
  const cor={autorizada:'green',pendente:'blue',rejeitada:'red',cancelada:'gray',simulada:'gray'};
  return nfs.map(n=>`<span class="pill ${cor[n.status]||'gray'}" title="${esc(n.status)}">${esc(n.numero)}</span>`).join(' ');
}
function pedProdCol(ops,ocs){
  const parts=[];
  (ops||[]).forEach(o=>parts.push(`<span class="mono" style="font-size:11px">${esc(o)}</span>`));
  (ocs||[]).forEach(o=>parts.push(`<span class="mono" style="font-size:11px;color:#c14a34" title="Ordem de compra">${esc(o)}</span>`));
  return parts.length?parts.join(' · '):'<span class="muted">—</span>';
}
function pedidoAcoes(p){
  // Proposta pertence à fase de orçamento; após a aprovação o documento é o Pedido.
  let b='';
  if(p.etapa==='orcamento'){
    b+=`<button class="btn-sm" onclick="APP.aprovarPedido(${p.id})">Aprovar</button> `;
    b+=`<button class="btn-sm" onclick="APP.gerarDoc('proposta',${p.id})">Proposta 🖨</button> `;
  } else {
    if(['aprovado','piloto','material','compra'].includes(p.etapa)) b+=`<button class="btn-sm" onclick="APP.gerarOp(${p.id})">Gerar OP</button> `;
    if(p.producaoParcial) b+=`<button class="btn-sm" style="color:#9a5a00" title="Produzir o restante — o estoque cobria só parte" onclick="APP.gerarOp(${p.id})">⚙️ OP complementar</button> `;
    if(p.etapa!=='expedicao'){ b+=`<button class="btn-sm" onclick="APP.pedidoExpedir(${p.id})">🚚 Expedir tudo</button> <button class="btn-sm" onclick="APP.formExpParcial(${p.id})">📦 Expedição parcial</button> `; }
    b+=`<button class="btn-sm" onclick="APP.gerarDoc('pedido',${p.id})">Pedido 🖨</button> `;
    b+=`<button class="btn-sm" style="color:#1e5aa8;border-color:#bcd3ef" title="NF de Simples Faturamento (venda p/ entrega futura): cobra o pedido cheio e permite entregas parciais depois" onclick="APP.formFaturamento(${p.id},${Number(p.valorTotal)||0},${Number(p.valorFrete)||0})">🧾 NF Faturamento</button> `;
    if(['producao','expedicao'].includes(p.etapa)) b+=`<button class="btn-sm" onclick="APP.gerarDoc('plano_corte',${p.id})">🧵 Plano de Corte</button> `;
  }
  // Editar/Excluir liberados até a produção começar (antes de gerar OP).
  if(['orcamento','aprovado','piloto'].includes(p.etapa)){
    b+=`<button class="btn-sm" onclick="APP.formPedido(${p.id})">Editar</button> `;
    b+=`<button class="btn-sm danger" onclick="APP.excluirPedido(${p.id},'${esc(p.numero)}')">Excluir</button> `;
  }
  // Retificar: pedido já em produção/expedição — edição segura (preserva o expedido).
  if(['parcial','concluido','producao','estoque','expedicao'].includes(p.etapa)){
    b+=`<button class="btn-sm" style="color:#8a5a00" title="Retificar o pedido (preserva o que já foi expedido). Cancele a NF antes." onclick="APP.retificarPedido(${p.id})">✏️ Retificar</button> `;
  }
  b+=`<button class="btn-sm" onclick="APP.formEmailDoc('${p.etapa==='orcamento'?'proposta':'pedido'}',${p.id},${p.clienteId})">✉</button> `;
  // Cancelar (mantém o registro) — disponível enquanto não estiver cancelado/concluído.
  if(!['cancelado','concluido'].includes(p.etapa)){
    b+=`<button class="btn-sm" style="color:#c14a34;border-color:#e0a99b" title="Cancelar o pedido (mantém o registro marcado como cancelado)" onclick="APP.cancelarPedido(${p.id},'${esc(p.numero)}')">🚫 Cancelar</button>`;
  }
  return b||'<span class="muted">—</span>';
}

// Normaliza o tamanho p/ casar grade x estoque (ex.: "G1 (FRISO VERMELHO)" -> "G1").
function normTam(s){ return String(s||'').trim().toUpperCase().split(/[\s(]/)[0]; }
// Nome do produto sem o sufixo "- Linha N Cores".
function nomeProdLimpo(d){ return String(d||'').replace(/\s*-\s*Linha\s+\d+\s+Cores/ig,'').trim(); }
// Casa a cor do item (ex.: "5143 Vermelho") com a cor do estoque (ex.: "5143 VERMELHO LOTE: 668657").
function corNorm(s){ return String(s||'').toUpperCase().replace(/\s+/g,' ').trim(); }
function corMatch(itemCor, stockCor){
  if(!itemCor) return true; // item sem cor definida → considera todo o estoque do produto
  const ic=corNorm(itemCor), sc=corNorm(stockCor); if(!sc) return false;
  const tok=ic.split(' ')[0];
  if(/^\d+$/.test(tok)) return sc.includes(tok);      // casa pelo código numérico (ex.: 5143)
  return sc.startsWith(ic) || sc.includes(ic);
}
// Retificar um pedido já em produção/expedição (edição segura no backend).
async function retificarPedido(id){
  if(!(await uiConfirm({tipo:'warn', titulo:'Retificar pedido?', ok:'Editar', cancel:'Cancelar', msg:'Você vai editar um pedido que já teve produção/expedição.\n\n• O sistema PRESERVA o que já foi expedido — não deixa reduzir abaixo do enviado nem remover item já expedido.\n• Se houver NF ATIVA, cancele-a antes (senão a edição é bloqueada).\n\nPode ajustar quantidades/itens do que ainda falta.'}))) return;
  formPedido(id);
}
async function formExpParcial(pedidoId){
  let ped; try{ ped=await api('/pedidos/'+pedidoId); }catch(e){ toast(e.message,'err'); return; }
  const itens = ped.itens||[];
  // Estoque disponível (não despachado) dos produtos vendidos.
  const pids=[...new Set(itens.map(it=>it.produtoId).filter(Boolean))];
  let disp=[]; if(pids.length){ try{ disp=await api('/estoque/disponivel?produtos='+pids.join(',')); }catch(_){ disp=[]; } }
  // Disponível DESTE item = estoque do produto NA COR selecionada, por tamanho.
  const itemDisp=(it)=>{ const byTam={}, tips={}; let total=0;
    (disp||[]).forEach(d=>{ if(d.produtoId!==it.produtoId) return; if(!corMatch(it.cor,d.cor)) return; const t=normTam(d.tamanho); byTam[t]=(byTam[t]||0)+d.quantidade; total+=d.quantidade; if(d.cor){ (tips[t]=tips[t]||[]).push(d.cor+': '+d.quantidade); } });
    return { byTam, total, tips };
  };
  const estColor=(avail,res)=> avail<=0?'#b03a2e':(avail<res?'#9a5a00':'#1e7a44');
  const corTag = it => it.cor?`<span class="pill" style="background:#eef3ff;color:#2b4a8b;font-size:10px;margin-left:6px">🎨 ${esc(it.cor)}</span>`:'';
  const cards = itens.map(it=>{
    const dd = itemDisp(it);
    const grade = it.grade && Object.keys(it.grade).length ? it.grade : null;
    if(grade){
      const jaG = it.gradeExpedida||{};
      const sizes = Object.entries(grade).map(([t,q])=>{
        const res = Number(q) - Number(jaG[t]||0);
        const avail = dd.byTam[normTam(t)]||0;
        const val0 = Math.min(res>0?res:0, avail);
        const ec = estColor(avail,res);
        return `<div style="display:inline-flex;flex-direction:column;align-items:center;margin:0 10px 8px 0">
          <span style="font-size:9px;letter-spacing:.5px;color:#6b6b72;text-transform:uppercase">${esc(t)} · resid ${res}</span>
          <input type="number" min="0" max="${res}" value="${val0}" data-disp="${avail}" ${res>0?'':'disabled'} class="expg" data-item="${it.id}" data-tam="${esc(t)}" style="width:56px;text-align:center;padding:4px;margin-top:2px;${res>0?'':'background:#f2f2f2'}">
          <span title="${esc((dd.tips[normTam(t)]||[]).join(' · ')||'sem estoque nesta cor')}" style="font-size:9px;margin-top:2px;font-weight:700;color:${ec}">📦 ${avail}</span>
        </div>`;
      }).join('');
      const totalRes = Object.entries(grade).reduce((s,[t,q])=>s+(Number(q)-Number(jaG[t]||0)),0);
      return `<div style="padding:10px 12px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:8px;background:#fff">
        <div style="font-weight:700;font-size:13px">${esc(nomeProdLimpo(it.descricao))}${corTag(it)} <span class="muted" style="font-weight:400;font-size:11px">· residual ${totalRes} · <span style="color:#1e7a44">estoque ${dd.total}</span></span></div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap">${sizes}</div></div>`;
    }
    const exp = it.quantidadeExpedida||0; const res = it.quantidade-exp;
    const avail = dd.total; const val0=Math.min(res>0?res:0, avail); const ec=estColor(avail,res);
    return `<div style="padding:10px 12px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div style="font-weight:700;font-size:13px">${esc(nomeProdLimpo(it.descricao))}${corTag(it)}</div><div class="muted" style="font-size:11px">Residual: ${res} de ${it.quantidade} · <span style="font-weight:700;color:${ec}">📦 estoque ${avail}</span></div></div>
      <input type="number" min="0" max="${res}" value="${val0}" data-disp="${avail}" ${res>0?'':'disabled'} class="expq" data-item="${it.id}" style="width:74px;text-align:center;padding:5px"></div>`;
  }).join('');
  const temEstoque=(disp||[]).length>0;
  openModal(`<h3>📦 Expedição parcial · <span class="mono gold">${esc(ped.numero)}</span></h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 10px">Já preenchi com o <b>estoque disponível</b> (📦) de cada tamanho — ajuste se quiser. O que sobrar fica em <b>residual em aberto</b>. <span style="color:#1e7a44">verde = tem tudo</span> · <span style="color:#9a5a00">âmbar = parcial</span> · <span style="color:#b03a2e">vermelho = sem estoque</span>.</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">${temEstoque?`<button class="btn-sm" onclick="APP.expUsarEstoque()" title="Preencher cada tamanho com o que há em estoque (limitado ao residual)">⚡ Preencher com o estoque</button>`:''}<button class="btn-sm" onclick="APP.expZerar()">Zerar tudo</button></div>
    <div style="max-height:50vh;overflow:auto">${cards||'<div class="muted">Pedido sem itens.</div>'}</div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveExpParcial(${pedidoId})">Gerar expedição parcial</button></div>`);
}
// Preenche cada campo com o estoque disponível (limitado ao residual = atributo max).
function expUsarEstoque(){
  document.querySelectorAll('.expg,.expq').forEach(inp=>{ if(inp.disabled)return; const res=Number(inp.max||0); const disp=Number(inp.dataset.disp||0); inp.value=Math.min(res, disp); });
}
function expZerar(){ document.querySelectorAll('.expg,.expq').forEach(inp=>{ if(!inp.disabled) inp.value=0; }); }
async function saveExpParcial(pedidoId){
  const byItem = {};
  document.querySelectorAll('.expg').forEach(inp=>{ const q=Number(inp.value||0); if(q>0){ const id=inp.dataset.item; if(!byItem[id]) byItem[id]={grade:{}}; byItem[id].grade[inp.dataset.tam]=q; } });
  document.querySelectorAll('.expq').forEach(inp=>{ const q=Number(inp.value||0); if(q>0){ byItem[inp.dataset.item]={quantidade:q}; } });
  const itens = Object.entries(byItem).map(([id,v])=>({pedidoItemId:Number(id), ...v}));
  if(!itens.length){ toast('Informe ao menos uma quantidade para expedir.','err'); return; }
  try{ const e=await api('/expedicoes/parcial/'+pedidoId,{method:'POST',body:{itens}});
    closeModal(); toast('Expedição parcial '+e.numero+' criada. Emita a NF na tela de Expedição.','ok'); loadRoute();
  }catch(err){ toast(err.message,'err'); }
}

function relGerar(tipo, fmt){
  const p = new URLSearchParams();
  const de=val('rel_de'), ate=val('rel_ate'), se=$('rel_status');
  if(de) p.set('de',de); if(ate) p.set('ate',ate); if(se && se.value) p.set('status',se.value);

}
async function baixarRel(tipo, qs, fmt){
  fmt = fmt||'pdf';
  try{
    const r = await fetch(API+'/relatorios/'+tipo+'/'+fmt+(qs?'?'+qs:''), { headers:{ Authorization:'Bearer '+S.access } });
    if(!r.ok){ let m='Falha ao gerar relatório ('+r.status+').'; try{ const j=await r.json(); m=j.message||m; }catch(e){} throw new Error(m); }
    const blob = await r.blob();
    if(fmt==='xlsx'){
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relatorio-'+tipo+'.xlsx';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); },120); toast('Excel gerado — verifique os downloads.','ok');
    } else {
      abrirPdfBlob(blob, {titulo:'📄 Relatório · '+tipo, nome:'relatorio-'+tipo});
    }
  }catch(e){ toast(e.message,'err'); }
}

// ===== Gerenciador de JANELAS internas (multi-janela, minimizar, ESC) =====
window.__wins = window.__wins || []; let __winSeq = 0;
function _winTitle(html){ const m=/<h3[^>]*>([\s\S]*?)<\/h3>/i.exec(html||''); return m?m[1].replace(/<[^>]+>/g,'').trim():'Janela'; }
function _winStripTitle(html){ return String(html||'').replace(/<h3[^>]*>[\s\S]*?<\/h3>/i,''); }
function _winTop(){ const v=__wins.filter(w=>!w.minimized); return v[v.length-1]||null; }
function _winFocus(w){ const mx=Math.max(50,...__wins.map(x=>Number(x.el.style.zIndex||50))); w.el.style.zIndex=mx+1; _winBg(); }
function _winBg(){ const bg=$('winbg'); const v=__wins.filter(w=>!w.minimized); if(!bg)return; bg.style.display=v.length?'block':'none'; if(v.length){ bg.style.zIndex=Number(v[v.length-1].el.style.zIndex||50)-1; } }
function _winDock(){ const d=$('windock'); if(!d)return; d.innerHTML=__wins.filter(w=>w.minimized).map(w=>`<div class="chip" onclick="APP._winRestore(${w.id})"><span class="cn">🗕 ${esc(w.title)}</span><span class="cx" onclick="event.stopPropagation();APP._winClose(${w.id})">✕</span></div>`).join(''); }
function _winDrag(el){ const hd=el.querySelector('.win-hd'); let sx,sy,ox,oy,d=false;
  hd.addEventListener('mousedown',e=>{ if(e.target.tagName==='BUTTON')return; d=true; sx=e.clientX;sy=e.clientY; const r=el.getBoundingClientRect(); ox=r.left;oy=r.top; el.style.left=ox+'px';el.style.top=oy+'px';el.style.transform='none'; document.body.style.userSelect='none'; });
  document.addEventListener('mousemove',e=>{ if(!d)return; el.style.left=Math.max(0,ox+e.clientX-sx)+'px'; el.style.top=Math.max(0,oy+e.clientY-sy)+'px'; });
  document.addEventListener('mouseup',()=>{ if(d){d=false; document.body.style.userSelect='';} }); }
// Detecta celular/tablet (o iframe de blob PDF costuma vir em branco no mobile).
function isMobile(){ try{ return window.matchMedia('(max-width: 760px)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent); }catch(e){ return false; } }
let __pdfSeq=0;

// Celular: mostra botões grandes "Abrir PDF" (tela cheia) e "Baixar PDF",
// porque o iframe de blob normalmente não renderiza no navegador do celular.
function abrirPdfBlob(blob, opts){
  opts=opts||{};
  const url=URL.createObjectURL(blob);
  const nome=String(opts.nome||'documento').replace(/[^\w.-]+/g,'_');
  const titulo=opts.titulo||'📄 Documento';

        <a class="btn-sm" href="${url}" download="${esc(nome)}.pdf" style="text-decoration:none">⬇ Baixar</a>

      </div>

  }

function openModal(html, opts){
  opts=opts||{};
  const title=_winTitle(html), body=_winStripTitle(html);
  // Re-render da mesma janela (mesmo título) substitui o conteúdo em vez de empilhar.
  const ex=__wins.find(w=>w.title===title && !w.minimized);
  if(ex){ ex.el.querySelector('.win-body').innerHTML=body; if(opts.wide) ex.el.classList.add('wide'); _winFocus(ex); return ex.el; }
  const id=++__winSeq; const el=document.createElement('div'); el.className='win'+(opts.wide?' wide':''); el.dataset.id=id;
  el.innerHTML=`<div class="win-hd"><span class="t">${esc(title)}</span><button title="Minimizar" onclick="APP._winMin(${id})">—</button><button title="Fechar (Esc)" onclick="APP._winClose(${id})">✕</button></div><div class="win-body">${body}</div>`;
  $('winlayer').appendChild(el);
  const off=(__wins.length%6)*26;
  el.style.left=opts.wide?`calc(50% - min(620px,48vw) + ${off}px)`:`calc(50% - min(280px,47vw) + ${off}px)`; el.style.top=`calc(${opts.wide?'3.5':'7'}vh + ${off}px)`;
  const w={id,el,title,minimized:false}; __wins.push(w); _winDrag(el); _winFocus(w);
  const inp=el.querySelector('input,select,textarea'); if(inp) setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  return el;
}
function closeModal(){ const w=_winTop(); if(w) _winClose(w.id); }
function _winClose(id){ const i=__wins.findIndex(w=>w.id===id); if(i<0)return; __wins[i].el.remove(); __wins.splice(i,1); _winBg(); _winDock(); }
function _winMin(id){ const w=__wins.find(x=>x.id===id); if(!w)return; w.minimized=true; w.el.style.display='none'; _winBg(); _winDock(); }
function _winRestore(id){ const w=__wins.find(x=>x.id===id); if(!w)return; w.minimized=false; w.el.style.display=''; _winDock(); _winFocus(w); }

    const st=document.getElementById('proc-st'), sub=document.getElementById('proc-sub'); if(!st) return;
    st.textContent=passos[i].st; sub.textContent=passos[i].sub;
    passos.forEach((_,k)=>{ const d=document.getElementById('pd'+k); if(d) d.classList.toggle('on',k===i); });

function _procHide(){ if(_procTimer){clearInterval(_procTimer);_procTimer=null;} const ov=document.getElementById('proc-ov'); if(ov){ ov.classList.remove('on'); setTimeout(()=>ov.remove(),180); } }
function procBegin(label){
  _procCount++;
  // só mostra após 300ms → operações instantâneas não piscam o overlay; não duplica o spinner de NF-e.
  if(_procCount===1 && !_procDelay && !document.getElementById('spin-ov')){
    _procDelay=setTimeout(()=>{ _procDelay=null; if(_procCount>0 && !document.getElementById('spin-ov')) _procShow(label); }, 300);
  }
}
function procEnd(){
  _procCount=Math.max(0,_procCount-1);
  if(_procCount===0){ if(_procDelay){ clearTimeout(_procDelay); _procDelay=null; } _procHide(); }
}

    </div></div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('on'));
    function done(v){ ov.classList.remove('on'); document.removeEventListener('keydown',onKey); setTimeout(()=>ov.remove(),170); resolve(v); }
    function onKey(e){ if(e.key==='Escape') done(false); if(e.key==='Enter') done(true); }
    ov.addEventListener('click',e=>{ if(e.target===ov){ if(o.cancel!==false) done(false); return; } const b=e.target.closest('[data-r]'); if(b) done(b.dataset.r==='1'); });
    document.addEventListener('keydown',onKey);
    setTimeout(()=>{ const b=ov.querySelector('[data-r="1"]'); if(b) b.focus(); },60);
  });
}

// ===== Busca automática de CNPJ (Receita) e CEP (endereço) =====
async function lookupCnpj(cnpjId, map){
  const dig=(val(cnpjId)||'').replace(/\D/g,'');
  if(dig.length!==14){ toast('Digite o CNPJ completo (14 dígitos) para buscar.','err'); return; }
  toast('Buscando dados do CNPJ…','ok');
  try{
    const d=await api('/lookup/cnpj/'+dig);
    for(const k in map){ if(k==='_cidadeUf') continue; const el=$(map[k]); if(el && d[k]!=null && d[k]!=='') el.value=d[k]; }
    if(map._cidadeUf){ const el=$(map._cidadeUf); if(el && (d.municipio||d.uf)) el.value=(d.municipio||'')+(d.uf?'/'+d.uf:''); }
    toast('Dados preenchidos'+(d.situacao?(' · '+d.situacao):'')+'.','ok');
  }catch(e){ toast(e.message||'CNPJ não encontrado.','err'); }
}
async function lookupCep(cepId, map){
  const dig=(val(cepId)||'').replace(/\D/g,'');
  if(dig.length!==8) return;
  try{
    const d=await api('/lookup/cep/'+dig);
    for(const k in map){ if(k==='_cidadeUf') continue; const el=$(map[k]); if(el && d[k]!=null && d[k]!=='') el.value=d[k]; }
    if(map._cidadeUf){ const el=$(map._cidadeUf); if(el && (d.municipio||d.uf)) el.value=(d.municipio||'')+(d.uf?'/'+d.uf:''); }
  }catch(e){}
}

// Máscara automática de CNPJ/CPF enquanto digita (pontos, barra e traço).
function maskDoc(el){
  if(!el) return; let d=String(el.value||'').replace(/\D/g,'').slice(0,14), out='';
  if(d.length<=11){ for(let i=0;i<d.length;i++){ if(i===3||i===6) out+='.'; if(i===9) out+='-'; out+=d[i]; } }
  else { for(let i=0;i<d.length;i++){ if(i===2||i===5) out+='.'; if(i===8) out+='/'; if(i===12) out+='-'; out+=d[i]; } }
  el.value=out;
}

  const ind=val('f_indie'); if(ind) body.indicadorIE=Number(ind);
  if(!body.nome){ toast('Informe o nome.','err'); return; }
  // Unidades/filiais: lê do DOM, limpa vazios e valida nome obrigatório.
  cliUniReadDom();
  const unis=[];
  for(const u of CLIUNIS){
    const nome=(u.nome||'').trim(); if(!nome) continue;

  Object.keys(body).forEach(k=>{ if(body[k]==='') delete body[k]; });
  try{ await api(id?('/clientes/'+id):'/clientes', {method:id?'PATCH':'POST', body}); closeModal(); toast('Cliente salvo.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

function secDivisor(t){ return `<div style="border-top:1px solid var(--line);margin:12px 0 10px;padding-top:8px"><b style="font-size:11.5px;color:var(--muted);letter-spacing:.5px">${esc(t)}</b></div>`; }
function taField(idv,lbl,valor,rows,ph){ return `<div class="mrow"><label class="fl">${esc(lbl)}</label><textarea id="${idv}" class="inp" rows="${rows||4}" ${ph?'placeholder="'+esc(ph)+'"':''}>${esc(valor||'')}</textarea></div>`; }
function expandGradeJS(grade){
  const E=['PP','P','M','G','GG','G1','G2','G3','G4','G5','G6','G7','G8'];
  const t=(grade||'').trim().toUpperCase();
  const m=/^(\S+)\s+A[O]?\s+(\S+)$/.exec(t);
  if(m){ const i=E.indexOf(m[1]), f=E.indexOf(m[2]); if(i>=0&&f>=i) return E.slice(i,f+1); }
  return t.split(/[,;/ ]+/).map(s=>s.trim()).filter(Boolean).slice(0,16);
}
function deriveSizes(p){
  let s = expandGradeJS(p.grade);
  if(!s.length){ const set=[]; (p.medidas||[]).forEach(m=>Object.keys(m.valores||{}).forEach(k=>{ if(!set.includes(k)) set.push(k); })); s=set; }
  return s;
}
// Lê o arquivo como data URI PRESERVANDO o original (PDF/imagem) — usado no boleto.
function arquivoParaDataURL(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}
function fileToDataURL(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ const r=Math.min(maxDim/w,maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg',quality));
    }; img.onerror=reject; img.src=fr.result; };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}
function fotoThumb(kind){
  const u=(window.__FOTO||{})[kind];
  if(u) return `<img src="${u}" style="max-height:96px;max-width:100%;border:1px solid #e2ddce;border-radius:8px;display:block"><a onclick="APP.fotoDel('${kind}')" style="cursor:pointer;color:#c14a34;font-size:11px">remover</a>`;
  return `<span class="muted" style="font-size:12px">Nenhuma imagem selecionada.</span>`;
}
async function fotoSel(kind, el){
  const f=el.files&&el.files[0]; if(!f) return;
  try{ window.__FOTO[kind]=await fileToDataURL(f,1100,0.72); $('fpv_'+kind).innerHTML=fotoThumb(kind); }
  catch(e){ toast('Não foi possível ler a imagem.','err'); }
}
function fotoDel(kind){ window.__FOTO[kind]=''; $('fpv_'+kind).innerHTML=fotoThumb(kind); }
// Arquivo da modelagem Audaces (.adsx/.zip) — arquivado como data URI, com nome original.
function arqModThumb(){
  const a=window.__ARQMOD||{};
  if(a.data){ return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill green" style="font-size:11px">📁 arquivo</span> <a href="${a.data}" download="${esc(a.nome||'modelagem')}" style="font-size:12px;color:#2b6cb0;text-decoration:underline">${esc(a.nome||'modelagem')}</a> <a onclick="APP.arqModDel()" style="cursor:pointer;color:#c14a34;font-size:11px">remover</a></div>`; }
  return `<span class="muted" style="font-size:12px">Nenhum arquivo arquivado.</span>`;
}
function arqModSel(el){
  const f=el.files&&el.files[0]; if(!f) return;
  if(f.size > 9*1024*1024){ toast('Arquivo muito grande (máx. ~9 MB).','err'); el.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{ window.__ARQMOD={ data:String(r.result), nome:f.name }; $('arqmod_pv').innerHTML=arqModThumb(); };
  r.onerror=()=>toast('Não foi possível ler o arquivo.','err');
  r.readAsDataURL(f);
}
function arqModDel(){ window.__ARQMOD={ data:'', nome:'' }; $('arqmod_pv').innerHTML=arqModThumb(); }
function pmedSync(){
  (window.__PMED||[]).forEach((r,i)=>{
    const d=$('pm_desc_'+i); if(!d) return;
    r.descricao=d.value; const tl=$('pm_tol_'+i); r.tolerancia=tl?tl.value:'';
    r.valores=r.valores||{};
    (window.__PMEDT||[]).forEach((t,j)=>{ const v=$('pm_val_'+i+'_'+j); if(v) r.valores[t]=v.value; });
  });
}
function pmedRender(){
  const box=$('pmedbox'); if(!box) return;
  const T=window.__PMEDT||[], rows=window.__PMED||[];
  let h='';
  if(!rows.length) h+=`<div class="muted" style="font-size:12px;margin-bottom:6px">Nenhuma medida. Use "+ linha" (ex.: CINTURA, COXA, ENTREPERNAS).</div>`;
  h+=`<div style="overflow-x:auto"><table class="pmed"><thead><tr><th style="min-width:120px">Medida</th><th>Tol.</th>`+T.map(t=>`<th>${esc(t)}</th>`).join('')+`<th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    h+=`<tr><td><input class="inp sm" id="pm_desc_${i}" value="${esc(r.descricao||'')}" placeholder="medida"></td>`;
    h+=`<td><input class="inp sm" id="pm_tol_${i}" value="${esc(r.tolerancia||'')}" style="width:48px" placeholder="1 CM"></td>`;
    h+=T.map((t,j)=>`<td><input class="inp sm" id="pm_val_${i}_${j}" value="${esc((r.valores&&r.valores[t]!=null?r.valores[t]:''))}" style="width:44px"></td>`).join('');
    h+=`<td><button class="btn-sm" onclick="APP.pmedDel(${i})">×</button></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  box.innerHTML=h;
}

function tecPorTamValues(){

function tecDD(){
  const inp=$('f_tec'), dd=$('f_tecdd'); if(!inp||!dd) return;

function tecDDHide(){ setTimeout(()=>{ const dd=$('f_tecdd'); if(dd) dd.style.display='none'; }, 180); }
function tecDDPick(id){
  const m=(window.__MATLIST||[]).find(x=>x.id===id); if(!m) return;
  const inp=$('f_tec'); if(inp) inp.value=tecMatLabel(m);
  const dd=$('f_tecdd'); if(dd) dd.style.display='none';

function tecPick(){
  const txt=(val('f_tec')||'').trim(); const mats=window.__MATLIST||[];
  const m=mats.find(x=>(x.descricao+' · '+x.codigo)===txt) || mats.find(x=>x.descricao===txt) || mats.find(x=>x.codigo===((txt.split('·').pop()||'').trim()));
  const hint=$('f_tec_hint'), hid=$('f_tecmat');
  if(m){
    if(hid) hid.value=m.id;
    const fu=$('f_tecun'); if(fu && !fu.value) fu.value=m.unidade||'m';
    const cons=Number(val('f_teccons'))||0, saldo=Number(m.saldo)||0;
    // Estimativa REAL: usa a MÉDIA do consumo por tamanho (peça média) quando houver;
    // senão, o consumo fixo. Assim o rendimento não fica preso ao maior tamanho.
    const ptVals=tecPorTamValues();
    const consEstim = ptVals.length ? (ptVals.reduce((a,b)=>a+b,0)/ptVals.length) : cons;
    const rende = consEstim>0 ? Math.floor(saldo/consEstim) : null;
    const mediaTxt = ptVals.length ? (' (média '+consEstim.toLocaleString('pt-BR',{maximumFractionDigits:2})+' '+esc(m.unidade||'m')+'/peça)') : '';
    if(hint) hint.innerHTML = '📦 Estoque: <b>'+saldo.toLocaleString('pt-BR')+' '+esc(m.unidade||'')+'</b>'+(rende!=null?(' · rende <b style="color:#1e7a44">~'+rende.toLocaleString('pt-BR')+' peças</b>'+mediaTxt):' · informe o consumo p/ calcular o rendimento');
  } else {
    if(hid) hid.value='';
    if(hint) hint.textContent = txt?'Tecido não cadastrado em Materiais — cadastre p/ vincular e ter baixa automática.':'';
  }
}

  }

// Resolve o fabricante digitado: usa o existente (por nome) ou cadastra um novo fornecedor.
async function resolverFabricante(){
  const txt=(val('f_fabric')||'').trim(); if(!txt) return null;
  const lista=window.__FORNMAT||[]; const low=txt.toLowerCase();
  const achou=lista.find(f=>String(f.nomeFantasia||'').trim().toLowerCase()===low) || lista.find(f=>String(f.nome||'').trim().toLowerCase()===low);
  if(achou) return achou.id;
  const nf=await api('/fornecedores',{method:'POST',body:{nome:txt, tipo:'Tecido'}});
  window.__FORNMAT=lista.concat([nf]); toast('Fabricante "'+esc(nf.nome)+'" cadastrado e vinculado.','ok');
  return nf.id;
}
async function saveMaterial(id){
  const base = { categoria:val('f_cat'), descricao:val('f_desc'), unidade:val('f_un')||'un',
    custo:Number(val('f_custo')||0), minimo:Number(val('f_min')||0), localizacao:val('f_local')||undefined,
    artigo:val('f_artigo')||undefined, codigoArtigo:val('f_ordem')||undefined, composicao:val('f_comp')||undefined };
  const larg=val('f_larg'); if(larg) base.largura=Number(larg);
  const gram=val('f_gram'); if(gram) base.gramatura=Number(gram);
  const grml=val('f_grml'); if(grml) base.gramaturaLinear=Number(grml);
  if(!base.categoria||!base.descricao){ toast('Categoria e descrição são obrigatórias.','err'); return; }
  let fid=null;
  try{ fid=await resolverFabricante(); }catch(e){ toast('Fabricante: '+(e.message||e),'err'); return; }
  if(fid) base.fornecedorId=fid;
  // Cores: 1 ou várias (vírgula/;). Edição = 1 cor. Cadastro novo com várias = 1 material por cor.
  const cores=(val('f_cor')||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
  if(id){
    const body=Object.assign({}, base, { cor:cores[0]||undefined, saldo:Number(val('f_saldo')||0) });
    try{ await api('/materiais/'+id,{method:'PATCH',body}); closeModal(); toast('Material salvo.','ok'); loadRoute(); }
    catch(e){ toast(e.message,'err'); }
    return;
  }
  if(cores.length<=1){
    const body=Object.assign({}, base, { cor:cores[0]||undefined, saldo:Number(val('f_saldo')||0) });
    try{ await api('/materiais',{method:'POST',body}); closeModal(); toast('Material salvo.','ok'); loadRoute(); }
    catch(e){ toast(e.message,'err'); }
    return;
  }
  // Várias cores do mesmo artigo → 1 material por cor (saldo inicial 0 em cada).
  let ok=0; const erros=[];
  for(const c of cores){
    try{ await api('/materiais',{method:'POST',body:Object.assign({}, base, { cor:c, saldo:0 })}); ok++; }
    catch(e){ erros.push(c+': '+(e.message||e)); }
  }
  closeModal();
  toast(ok+' cor(es) cadastrada(s) do artigo "'+base.descricao+'"'+(erros.length?(' · '+erros.length+' falha(s)'):'.'), erros.length?'err':'ok');
  loadRoute();
}

function ctrSyncItens(){

async function saveContrato(id){
  ctrSyncItens();

  const itens=CITENS.filter(it=>(it.descricao||'').trim()!=='').map(it=>{ const o={ descricao:it.descricao.trim(), preco:Number(it.preco||0), unidade:(it.unidade||'UN').trim()||'UN' }; if(it.produtoId) o.produtoId=it.produtoId; if(it.codigo) o.codigo=it.codigo; return o; });

  const filialId = val('ctr_filial') ? Number(val('ctr_filial')) : null;
  const body={ clienteId, filialId, vendedor:val('ctr_vend'), numero:val('ctr_num'), descricao:val('ctr_desc'), formaPagamento:val('ctr_fpag'), condicaoPagamento:val('ctr_cpag'), prazoEntrega:val('ctr_prazo'), transportadora:val('ctr_transp'), vigenciaInicio:val('ctr_vini'), vigenciaFim:val('ctr_vfim'), observacoes:val('ctr_obs'), ativo, itens };

}

// Calcula o vencimento estimado a partir da forma de pagamento (ex.: "20 DDL", "30/60/90").
// Ao escolher o cliente num pedido NOVO, puxa condições comerciais do último pedido dele
// (forma de pagamento, frete, observações). Não sobrescreve campos já preenchidos.
async function pedPrefillCliente(){
  if(!window.__PEDNEW) return;
  const cid = Number(val('f_cli')); if(!cid) return;
  let lista; try{ lista = await api('/pedidos'); }catch(_){ return; }
  const doCli = (lista||[]).filter(p=>p.clienteId===cid).sort((a,b)=>b.id-a.id);
  if(!doCli.length) return;
  let ult; try{ ult = await api('/pedidos/'+doCli[0].id); }catch(_){ return; }
  const usou=[];
  const setIf=(id,v)=>{ const e=$(id); if(e && !e.value && v){ e.value=v; return true; } return false; };
  if(setIf('f_pag', ult.formaPagamento)) usou.push('forma de pagamento');
  if(setIf('f_frete', ult.frete)) usou.push('frete');
  if(setIf('f_obs', ult.obs)) usou.push('observações fiscais');
  if(setIf('f_obscom', ult.obsComercial)) usou.push('observações comerciais');
  calcVenc();
  if(usou.length) toast('Puxei '+usou.join(', ')+' do último pedido ('+esc(ult.numero)+').','ok');
}
function calcVenc(){
  const el=$('f_pag_venc'); if(!el) return;

  const dias=[...(forma||'').matchAll(/(\d{1,3})/g)].map(m=>parseInt(m[1],10)).filter(d=>d>0&&d<=360).sort((a,b)=>a-b);
  if(!dias.length){ el.innerHTML = forma?'<span style="color:#3a8f4f">À vista / sem prazo</span>':''; return; }
  const hoje=new Date();
  const fmt=d=>{ const x=new Date(hoje); x.setDate(x.getDate()+d); return x.toLocaleDateString('pt-BR'); };
  const txt = dias.map(d=>'<b>'+fmt(d)+'</b> ('+d+'d)').join(' · ');
  el.innerHTML = '📅 Vencimento: '+txt+' <span style="color:#8a8674">— a partir do faturamento</span>';
}

function parseGradeTxt(txt){ const o={}; let soma=0; for(const par of String(txt||'').split(/[,;]+/)){ const m=par.split(':'); const t=(m[0]||'').trim().toUpperCase(); const q=Math.round(Number((m[1]||'').trim())); if(t&&q>0){o[t]=q;soma+=q;} } return {o,soma}; }
// Tamanhos de um produto (da grade cadastrada) — ex.: "PP, P, ... G5". Sem grade, usa o padrão.
function tamsDoProduto(p){

function tamsEspDoProduto(p){

function corClara(hex){ if(!hex) return true; const m=hex.replace('#',''); const r=parseInt(m.substr(0,2),16),g=parseInt(m.substr(2,2),16),b=parseInt(m.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>150; }

// Totais do pedido (peças + valor), respeitando faixas de preço por tamanho.

async function savePedido(id){
  let clienteId = Number(val('f_cli'));
  const itens = [];
  for(let i=0;i<PITENS.length;i++){
    const p=prodByLabel(window.__PROD,val('it_prod_'+i)), v=val('it_val_'+i);
    const txt=(val('it_prod_'+i)||'').trim();
    if(!p && !txt) continue; // linha vazia
    // grade vem das caixinhas por tamanho (PITENS[i].grade); senão, qtd manual.
    itemGradeInp(i);
    const g=PITENS[i].grade; const soma=g?Object.values(g).reduce((a,b)=>a+b,0):0;
    const manual=Number(val('it_qtd_'+i))||0;
    const quantidade = soma>0?soma:manual;
    if(!(quantidade>0)){ toast('Item '+(i+1)+': informe a grade (por tamanho) ou a quantidade.','err'); return; }
    const base=Number(v);
    if(!(base>0)){ toast('Item '+(i+1)+(p?(' ('+p.descricao+')'):(' "'+txt+'"'))+': informe o valor unitário.','err'); return; }
    // Cor obrigatória quando o produto (do catálogo) tem cores cadastradas.
    const cores = coresDoProduto(p);
    if(cores.length && !PITENS[i].cor){ toast('Item '+(i+1)+' ('+p.descricao+'): escolha a COR.','err'); return; }
    // Separa o item por FAIXA DE PREÇO: tamanhos normais (preço base) e tamanhos
    // da tabela especial (precoEspecial) viram linhas distintas — senão o especial
    // era gravado com o preço base. (Só p/ produto do catálogo; item livre é 1 preço.)
    const esp=tamsEspDoProduto(p);
    const precoEsp=(p&&p.precoEspecial!=null && String(p.precoEspecial)!=='')?Number(p.precoEspecial):null;
    const cor=PITENS[i].cor;
    const addItem=(grade,valorUnit,qtd)=>{ const it={ quantidade:qtd, valorUnit }; if(p) it.produtoId=p.id; else it.descricao=txt; if(cor) it.cor=cor; if(grade) it.grade=grade; itens.push(it); };
    if(soma>0 && precoEsp!=null && esp.length){
      const gBase={}, gEsp={}; let qB=0,qE=0;
      for(const [t,q] of Object.entries(g)){ const n=Number(q)||0; if(n<=0) continue; if(esp.includes(String(t).toUpperCase())){ gEsp[t]=n; qE+=n; } else { gBase[t]=n; qB+=n; } }
      if(qB>0) addItem(gBase, base, qB);
      if(qE>0) addItem(gEsp, precoEsp, qE);
    } else if(soma>0){
      addItem(g, base, soma);
    } else {
      addItem(null, base, manual);
    }
  }
  if(!itens.length){ toast('Adicione ao menos um item.','err'); return; }
  if(!clienteId){
    try{ clienteId = await resolverClienteIdPedido(); }
    catch(e){ toast('Não foi possível cadastrar o cliente: '+(e.message||e),'err'); return; }
    if(!clienteId){ toast('Informe o cliente.','err'); return; }
  }
  const body = { clienteId, itens }; const pag=val('f_pag'); if(pag) body.formaPagamento=pag;
  const uni=Number(val('f_cliuni')); if(uni) body.clienteUnidadeId=uni;
  if($('f_bonif')&&$('f_bonif').checked) body.bonificacao=true;
  const frete=val('f_frete'); if(frete) body.frete=frete;
  { const vf=(val('f_valfrete')||'').replace(',','.'); body.valorFrete = vf!==''?Number(vf):0; }
  const fil=val('f_filial'); if(fil) body.filialId=Number(fil);
  const prazo=val('f_prazo'); if(prazo) body.prazoEntrega=prazo;
  const oc=val('f_oc'); if(oc) body.ordemCompraCliente=oc;
  const obs=(($('f_obs')&&$('f_obs').value)||'').trim(); body.obs=obs||undefined;
  const obsCom=(($('f_obscom')&&$('f_obscom').value)||'').trim(); body.obsComercial=obsCom||undefined;
  try{
    if(id){ const p=await api('/pedidos/'+id,{method:'PATCH',body}); closeModal();
      let m='Pedido '+p.numero+' atualizado.';
      if(p.opsSincronizadas&&p.opsSincronizadas.length) m+=' OP sincronizada: '+p.opsSincronizadas.join(', ')+'.';
      toast(m,'ok');
      if(p.opsAviso&&p.opsAviso.length){ await uiAlert({tipo:'warn', titulo:'⚠ Revisar OPs após a retificação', ok:'Entendi', msg:p.opsAviso.join('\n')}); }
    }
    else { const p=await api('/pedidos',{method:'POST',body}); closeModal(); toast('Pedido '+p.numero+' criado'+(p.exigePiloto?' (exige piloto)':'')+'.','ok'); }
    loadRoute();
  } catch(e){ toast(e.message,'err'); }
}

async function gerarOp(id, parcial){
  try{
    const r = await api('/pedidos/'+id+'/gerar-op'+(parcial?'?parcial=1':''),{method:'POST'});
    if(r.status==='op_gerada'){
      const nums=(r.ops||[]).map(o=>o.numero).join(', ');
      let msg=(r.ops&&r.ops.length>1?'OPs geradas: ':'OP gerada: ')+nums+'. Material baixado.';
      if(r.revenda&&r.revenda.length) msg+=' '+r.revenda.length+' item(ns) de revenda não geram OP.';
      toast(msg,'ok');
      await abrirOpsGeradas(r.ops);
    }
    else if(r.status==='op_parcial'){ toast('⚙️ '+r.message,'ok'); await abrirOpsGeradas(r.ops); }
    else if(r.status==='sem_producao') toast(r.message||'Pedido só de revenda — nenhuma OP.','ok');
    else if(r.status==='bloqueado_material'){
      const oc=(r.ordensCompra||[]).map(o=>o.numero).join(', ');
      // Se já veio do PARCIAL e ainda bloqueou = estoque não cobre nem 1 peça. NÃO reabre o popup (evita loop).
      if(parcial){
        await uiAlert({tipo:'info', titulo:'Estoque não cobre nem 1 peça', ok:'Entendi', msg:'O estoque atual não dá pra produzir nem 1 peça inteira deste pedido agora.\n\nAs ordens de compra ('+oc+') foram mantidas — assim que o material chegar, é só gerar a OP (ou a OP complementar).'});
        loadRoute(); return;
      }
      // 1ª vez: oferece PRODUÇÃO PARCIAL (produz o que cobre e mantém a compra do resto).
      const falt=(r.faltantes||[]).map(f=>'• '+String(f.descricao).split(' - ')[0]+': falta '+f.faltam+' '+f.unidade).join('\n');
      const ok = await uiConfirm({tipo:'warn', titulo:'Faltou material p/ o pedido todo',
        ok:'⚙️ Produzir o que tenho (parcial)', cancel:'Só comprar (aguardar material)',
        msg:'Ordem(ns) de compra criada(s): '+oc+'\n\n'+falt+'\n\nQuer PRODUZIR AGORA a parte que o estoque cobre, sem parar a linha? A OP complementar do restante sai quando o material chegar.'});
      if(ok) return gerarOp(id, true);
      toast('OC(s) '+oc+' criada(s). Pedido aguardando material.','ok');
    }
    else if(r.status==='itens_livres'){
      const itens=(r.itens||[]);
      const lista=itens.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid #f0e7d0">
        <div style="min-width:0;font-size:12.5px">✏️ ${esc(d)}</div>
        <button class="btn-primary" style="white-space:nowrap;padding:4px 10px" onclick="APP.cadProdDeLivre('${encodeURIComponent(d)}',${id})">➕ Cadastrar produto</button>
      </div>`).join('');
      openModal(`<h3>⚠️ Itens em texto livre</h3>
        <div class="muted" style="font-size:12.5px;margin:-4px 0 8px">Estes itens não têm produto do catálogo (sem ficha técnica/material), por isso não geram OP. Cadastre o produto e depois vincule ao item.</div>
        <div class="panel">${lista||'<div class="empty">—</div>'}</div>
        <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Fechar</button><button class="btn-sm" onclick="APP.formPedido(${id})">✏️ Editar pedido (vincular)</button></div>`, {wide:true});
      return;
    }
    else if(r.status==='bloqueado_piloto') toast('Bloqueado: '+r.message,'err');
    // (handler de itens_livres acima usa cadProdDeLivre)
    loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

function receberPreset(kind){
  const de=$('rc_de'), ate=$('rc_ate'), stt=$('rc_status');
  const isoLocal=d=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const hoje=new Date(); if(stt) stt.value='';
  if(kind===''){ if(de)de.value=''; if(ate)ate.value=''; }
  else if(kind==='mes'){ const y=hoje.getFullYear(),m=hoje.getMonth(); if(de)de.value=isoLocal(new Date(y,m,1)); if(ate)ate.value=isoLocal(new Date(y,m+1,0)); }
  else if(kind==='7'){ if(de)de.value=isoLocal(hoje); const t2=new Date(hoje); t2.setDate(t2.getDate()+7); if(ate)ate.value=isoLocal(t2); }

  receberFiltrar();
}

// Normaliza um valor digitado ("144,00" / "1.352,29") p/ comparar com o valor do título.
function _numBusca(q){ return (q||'').replace(/[^\d,\.]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'); }
function pagarEmp(enc){ const k=decodeURIComponent(enc); window.__PGEMP = (window.__PGEMP===k?'':k); pagarFiltrar(); }
function pagarFiltrar(){
  const list=window.__PAGS||[], nome=window.__PAGNOME||{}, cnpj=window.__PAGCNPJ||{};
  const de=val('pg_de'), ate=val('pg_ate'), st=val('pg_status');
  const qraw=(val('pg_busca')||'').trim(); const q=qraw.toLowerCase(); const qn=_numBusca(q); const emp=window.__PGEMP||'';
  // Guarda o estado dos filtros p/ manter aplicado após executar tarefas (baixa, exclusão…) e após F5.
  window.__PGFILTERS = { q:qraw, de, ate, st, emp };
  try{ sessionStorage.setItem('pgfilt', JSON.stringify(window.__PGFILTERS)); }catch(_){}
  const fil=list.filter(t=>{
    const v=String(t.vencimento).slice(0,10);
    if(de && v<de) return false;
    if(ate && v>ate) return false;
    if(st==='aberto' && t.status==='pago') return false;
    if(st==='pago' && t.status!=='pago') return false;
    if(emp){ const en=t.filial?t.filial.nome:'Sem empresa'; if(en!==emp) return false; }
    if(q){
      const hay=[nome[t.fornecedorId]||'', cnpj[t.fornecedorId]||'', t.referencia||'', t.categoria||'', t.filial?t.filial.nome:''].join(' ').toLowerCase();
      const valBate = qn && (Number(t.valor).toFixed(2).includes(qn) || Number(t.saldo).toFixed(2).includes(qn));
      if(!hay.includes(q) && !valBate) return false;
    }
    return true;
  });

function pagarPreset(kind){
  const de=$('pg_de'), ate=$('pg_ate'), stt=$('pg_status');
  const isoLocal=d=>{ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const hoje=new Date(); if(stt) stt.value='';
  if(kind===''){ if(de)de.value=''; if(ate)ate.value=''; }
  else if(kind==='mes'){ const y=hoje.getFullYear(),m=hoje.getMonth(); if(de)de.value=isoLocal(new Date(y,m,1)); if(ate)ate.value=isoLocal(new Date(y,m+1,0)); }
  else if(kind==='7'){ if(de)de.value=isoLocal(hoje); const t2=new Date(hoje); t2.setDate(t2.getDate()+7); if(ate)ate.value=isoLocal(t2); }
  else if(kind==='venc'){ if(de)de.value=''; if(ate)ate.value=isoLocal(hoje); if(stt)stt.value='aberto'; }
  pagarFiltrar();

let PGPARC=[];
function pgParcGerar(total){
  const diasStr=(val('pg_dias')||'').trim();
  let offs=diasStr?diasStr.split(/[\/,;\s]+/).map(x=>parseInt(x)).filter(x=>!isNaN(x)):[];
  let n;
  if(offs.length){ n=offs.length; }
  else { n=Math.max(2,parseInt(val('pg_np')||'0')||0); if(!n||n<2){ toast('Informe os dias (30/60/91) ou o nº de parcelas.','err'); return; } offs=Array.from({length:n},(_,i)=>30*(i+1)); }
  const base=new Date(); base.setHours(12,0,0,0);
  const cent=Math.round(Number(total)*100), part=Math.floor(cent/n);
  PGPARC=[]; for(let i=0;i<n;i++){ const dt=new Date(base); dt.setDate(dt.getDate()+(offs[i]||0)); const c=(i===n-1)?(cent-part*(n-1)):part; PGPARC.push({vencimento:dt.toISOString().slice(0,10), valor:c/100}); }
  pgParcRender(total);
}
function pgParcRender(total){
  const box=$('pg_parclist'), btn=$('pg_parcbtn'); if(!box) return;
  if(!PGPARC.length){ box.innerHTML=''; if(btn)btn.style.display='none'; return; }
  const soma=PGPARC.reduce((s,p)=>s+Number(p.valor||0),0), dif=Math.abs(soma-Number(total))>0.005;
  box.innerHTML=PGPARC.map((p,i)=>`<div class="grid2" style="margin-bottom:4px">
      <input class="inp" type="date" id="pg_pv_${i}" value="${esc(p.vencimento)}" onchange="APP.pgParcSync()">
      <div style="display:flex;gap:6px"><input class="inp" type="number" step="0.01" id="pg_pval_${i}" value="${p.valor}" onchange="APP.pgParcSync()"><button type="button" class="btn-sm" onclick="APP.pgParcDel(${i},${total})">×</button></div>
    </div>`).join('')+`<div class="muted" style="font-size:11px">${PGPARC.length}x · soma <b style="color:${dif?'#c14a34':'inherit'}">${money(soma)}</b> · valor do título ${money(total)}${dif?' ⚠️ diferente':''}</div>`;
  if(btn)btn.style.display='';
}
function pgParcSync(){ PGPARC.forEach((p,i)=>{ const v=$('pg_pv_'+i),a=$('pg_pval_'+i); if(v)p.vencimento=v.value; if(a)p.valor=Number(a.value); }); }
function pgParcDel(i,total){ pgParcSync(); PGPARC.splice(i,1); pgParcRender(total); }
async function parcelarPagar(id){
  pgParcSync();

  try{ await api('/financeiro/pagar/'+id+'/parcelar',{method:'POST',body:{parcelas:parc.map(p=>({vencimento:p.vencimento,valor:Number(Number(p.valor).toFixed(2))}))}});

// Extrai "Banco · Ag X · CC Y" do texto livre de dados bancários da filial.
function resumoBancoFilial(f){
  const t=(f.dadosBancarios||'').replace(/\s+/g,' ').trim();
  const banco=(t.match(/banco[:\s]+([A-Za-zÀ-ú ]+?)(?=\s+(?:ag|ag[êe]ncia|conta|c\/c|cc|pix)\b|$)/i)||[])[1];
  const ag=(t.match(/ag[êe]ncia[:\s]*([\d.\-]+)/i)||t.match(/\bag[.:\s]*([\d.\-]+)/i)||[])[1];
  const cc=(t.match(/(?:conta corrente|conta|c\/c|cc)[:\s]*([\d.\-]+)/i)||[])[1];
  const parts=[banco&&banco.trim(), ag&&('Ag '+ag), cc&&('CC '+cc)].filter(Boolean);
  return parts.join(' · ');
}

function _copiaTexto(txt){
  if(!txt) return;
  const done=()=>toast('Chave PIX copiada!','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>_copiaFallback(txt,done)); }
  else _copiaFallback(txt,done);
}
function copiarPix(){ const el=document.getElementById('pixval'); _copiaTexto(el?el.textContent.trim():''); }
function copiarPixForn(id){ const fp=(window.__FORNPIX||{})[id]; if(fp&&fp.pix) _copiaTexto(fp.pix); else toast('Sem chave PIX cadastrada.','info'); }
function _copiaFallback(txt,done){ try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove(); done&&done(); }catch(e){ toast('Copie manualmente: '+txt,'info'); } }

// ---------- Bloco Produção ----------
const OP_STATUS = ['aguardando_material','a_iniciar','em_corte','em_producao','em_faccao','concluido'];
// Fluxo guiado de produção: o sistema sugere a próxima fase, uma a uma.
const OP_FASES = [
  { nome:'Risco CAD',         status:'em_corte',    prog:5  },
  { nome:'Corte',             status:'em_corte',    prog:15 },
  { nome:'Separação 1',       status:'em_producao', prog:30 },
  { nome:'Estamparia/Bordado',status:'em_producao', prog:45 },
  { nome:'Separação 2',       status:'em_producao', prog:60 },
  { nome:'Costura',           status:'em_producao', prog:75 },
  { nome:'Acabamento',        status:'em_producao', prog:90 },
  { nome:'Finalizado',        status:'concluido',   prog:100 },
];
// Descobre em qual fase a OP está, a partir do setor atual (ou do status, p/ OPs antigas).
function opFaseIdx(o){
  const s=(o.setorAtual||'').toLowerCase();
  for(let i=OP_FASES.length-1;i>=0;i--){ if(s.includes(OP_FASES[i].nome.toLowerCase())) return i; }
  if(o.status==='concluido') return 7;
  if(s.includes('costura')) return 5;
  if(s.includes('corte')||o.status==='em_corte') return 1;
  if(o.status==='em_producao') return 5;
  return -1; // a_iniciar / aguardando — ainda não entrou no fluxo
}
function opFaseBtn(o){
  const idx=opFaseIdx(o); const prox=OP_FASES[idx+1];
  if(!prox) return '<span class="pill green" style="font-weight:700">✓ Finalizado</span>';
  const fim = prox.nome==='Finalizado';
  const label = fim ? '✓ Finalizar (estoque/expedição)' : '▶ '+prox.nome;
  const cor = fim ? 'background:#1e7a44;color:#fff' : 'background:var(--gold);color:#3a2f08';
  return `<button class="btn-sm" style="${cor};font-weight:700" title="Avançar para a próxima fase da produção" onclick='APP.opAvancarFase(${JSON.stringify(o).replace(/'/g,"&#39;")})'>${label}</button>`;
}
// Avança a OP uma fase. Ao chegar em "Finalizado", abre o popup estoque/expedição + etiqueta.
async function opAvancarFase(o){
  const idx=opFaseIdx(o); const prox=OP_FASES[idx+1];
  if(!prox){ toast('OP já finalizada.','ok'); return; }
  const atual = idx>=0 ? OP_FASES[idx].nome : null;
  // Ao SAIR da fase "Corte", pergunta quantas peças foram realmente cortadas
  // (permite corte parcial). Confirmar o corte já avança a OP para Separação 1.
  if(atual==='Corte'){ return APP.formCorte(o); }
  if(prox.nome==='Finalizado'){ opConcluirEtiquetas(o.id); return; }
  try{
    await api('/ops/'+o.id+'/status',{method:'PATCH',body:{status:prox.status, setorAtual:prox.nome}});
    await api('/ops/'+o.id+'/progresso',{method:'PATCH',body:{progresso:prox.prog}});
    toast('OP '+o.numero+' avançou para: '+prox.nome,'ok'); loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

function opPill(s){ const c = s==='concluido'?'green':(s==='aguardando_material'?'red':(s==='a_iniciar'?'gold':'blue')); return `<span class="pill ${c}">${esc(s.replace(/_/g,' '))}</span>`; }

// Lista de OPs AGRUPADA por pedido: um cabeçalho por pedido (com OP do Pedido / OS

function opsAgrupadas(arr, verFin){
  if(!arr.length) return `<div class="panel"><div class="empty">${verFin?'Nenhuma OP finalizada ainda.':'Nenhuma OP em produção. As finalizadas ficam em "📁 Finalizadas".'}</div></div>`;
  const groups=new Map();
  arr.forEach(o=>{ const k=o.pedidoId||('sem'+o.id); if(!groups.has(k)) groups.set(k,{ped:o.pedido?o.pedido.numero:null, pedidoId:o.pedidoId||0, ops:[]}); groups.get(k).ops.push(o); });
  const opAcoes=o=>`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${opFaseBtn(o)} ${canAccess('pcp')?`<button class="btn-sm" style="color:#8a5a00;border-color:#e7c98a" title="Enviar p/ facção externa" onclick='APP.opFaccaoExterna(${JSON.stringify(o).replace(/'/g,"&#39;")})'>🏭 Facção</button>`:''} <button class="btn-sm" onclick="APP.formRomaneio(${o.id})">🧾 Romaneio</button> <button class="btn-sm" onclick="APP.etiquetaOp(${o.id})">🏷 Etiqueta</button> <button class="btn-sm" onclick='APP.formOp(${JSON.stringify(o).replace(/'/g,"&#39;")})' title="Ajuste manual de fase/grade">Ajustar</button> ${o.status==='concluido'?`<button class="btn-sm" title="Reimprimir etiquetas de expedição" onclick="APP.opReimprimir(${o.id})">🖨 Etiq. exp.</button>`:''} <button class="btn-sm" title="Imprimir esta OP" onclick="APP.gerarDoc('op',${o.id})">🖨 OP</button></div>`;
  return [...groups.values()].map(g=>{
    const totPecas=g.ops.reduce((s,o)=>s+(o.quantidade||0),0);
    const head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;background:#faf6ea;border-bottom:1px solid var(--line);flex-wrap:wrap">

      <div style="display:flex;gap:6px;flex-wrap:wrap">${g.pedidoId?`<button class="btn-sm" style="color:#2a6a2a;border-color:#bfe0bf" title="Documento único com TODAS as OPs deste pedido (clean p/ produção)" onclick="APP.gerarDoc('op_pedido',${g.pedidoId})">📄 OP do Pedido</button> <button class="btn-sm" title="Ordem de Serviço p/ oficina (selecionar produto/tamanho)" onclick="APP.formOS(${g.pedidoId})">📋 OS oficina</button>`:''}</div>
    </div>`;
    const rows=g.ops.map(o=>`<tr>
      <td><span class="mono gold">${esc(o.numero)}</span>${o.corteParcial?' <span class="pill" style="background:#fff3e0;color:#9a5a00;border:1px solid #e7c98a;font-size:9px;padding:1px 5px">PARCIAL</span>':''}</td>

      <td>${o.quantidade}</td><td>${opPill(o.status)}</td><td style="min-width:110px">${bar(o.progresso)}</td>
      <td><b>${esc(o.setorAtual||'—')}</b></td><td>${prioPill(o.prioridade)}</td><td>${opAcoes(o)}</td></tr>`).join('');
    return `<div class="panel" style="margin-bottom:14px;overflow:hidden">${head}<div style="overflow-x:auto"><table><thead><tr><th>OP</th><th>Produto</th><th>Qtd</th><th>Status</th><th>Progresso</th><th>Fase atual</th><th>Prioridade</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');

// Ao finalizar a fabricação: gera etiqueta unitária por peça (uma por tamanho da grade)
// e o operador escolhe se vai ESTOCAR ou ir DIRETO PRA EXPEDIÇÃO despachar pro cliente.
async function opConcluirEtiquetas(id){
  let d;
  try{ const r = await api('/ops/'+id+'/etiqueta'); d = r.dados || r; }
  catch(e){ toast(e.message,'err'); return; }
  const descProd = (d.produto||'').split('·').slice(1).join('·').trim() || (d.produto||'').trim() || 'PRODUTO';
  const refProd = (d.produto||'').split('·')[0].trim();
  // grade "P:10, M:20" -> [[P,10],[M,20]]; se não houver, usa a quantidade total.
  const pares = [];
  if(d.gradeObj && typeof d.gradeObj==='object' && Object.keys(d.gradeObj).length){
    for(const [t,q] of Object.entries(d.gradeObj)){ if(Number(q)>0) pares.push([String(t).toUpperCase(),Number(q)]); }
  } else {
    (d.grade||'').split(/[\s,;]+/).forEach(par=>{ const [t,q]=par.split(/[:=]/).map(s=>(s||'').trim()); if(t&&q&&Number(q)>0) pares.push([t.toUpperCase(),Number(q)]); });
  }
  const totalGrade = pares.reduce((s,p)=>s+p[1],0);
  const linhas = pares.length ? pares.map(([t,q])=>`${t}: <b>${q}</b>`).join(' &nbsp;·&nbsp; ') : `<b>${d.quantidade}</b> peças (sem grade)`;
  openModal(`<h3>Finalizar OP ${esc(d.op)} · Etiquetas</h3>
    <div class="r" style="margin-bottom:6px"><b>Produto:</b> ${esc(descProd)}${d.cor&&d.cor!=='-'?' · Cor '+esc(d.cor):''}</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Grade: ${linhas}${pares.length&&totalGrade!==d.quantidade?` <span style="color:#c0392b">(soma ${totalGrade} ≠ qtd ${d.quantidade})</span>`:''}</div>
    <div class="mrow"><label class="fl">Destino das peças *</label>
      <select id="oc_dest" class="inp">
        <option value="estoque">📦 Estocar (endereçar depois)</option>
        <option value="expedicao">🚚 Ir direto pra expedição (despachar pro cliente)</option>
      </select></div>
    <div class="grid2">${field('oc_ref','Ref (código do produto)','value="'+esc(refProd)+'"')}<div><label class="fl">Cor <span class="muted" style="font-weight:400">(puxada do pedido)</span></label><input id="oc_cor" class="inp" value="${esc(d.cor&&d.cor!=='-'?d.cor:'')}" readonly title="A cor vem do cadastro/pedido e não pode ser alterada aqui" style="background:#f4f2ed;color:#3a2f08;font-weight:600;cursor:not-allowed"></div></div>
    ${(!d.cor||d.cor==='-')?'<div class="card" style="background:#fff5e6;border-color:#f0c987;color:#8a5a00;font-size:11.5px;margin:-2px 0 8px">⚠️ Este produto está <b>sem cor</b> no cadastro. Cadastre a cor no produto para a etiqueta sair correta.</div>':''}
    ${field('oc_desc','Nome da peça (descrição)','value="'+esc(descProd)+'"')}
    <div class="muted" style="font-size:11px;margin:2px 0 8px">Gera 1 etiqueta única por peça (ref + nome + tamanho + código de barras). Estoque: ficam "aguardando endereço". Expedição: já saem reservadas ao pedido.</div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick='APP.opConcluirGerar(${id}, ${JSON.stringify(pares)}, ${d.quantidade}, ${d.pedidoId||'null'})'>Gerar etiquetas</button></div>`);
}
async function opConcluirGerar(id, pares, qtdTotal, pedidoId){
  const destino = val('oc_dest');
  const descricao = val('oc_desc').trim();
  const cor = val('oc_cor').trim();
  const ref = val('oc_ref').trim();
  if(!descricao){ toast('Informe a descrição.','err'); return; }
  const lotes = (pares && pares.length) ? pares.map(([t,q])=>({tamanho:t, quantidade:q})) : [{tamanho:'', quantidade:qtdTotal}];
  try{
    toast('Gerando etiquetas…','ok');
    const todas = [];
    for(const l of lotes){
      const body = { tipo:'produto', descricao, ref:ref||undefined, cor:cor||undefined, tamanho:l.tamanho||undefined,
        quantidade:l.quantidade, origem:'producao', destino, loteEntrada:'OP-'+id };
      if(destino==='expedicao' && pedidoId) body.pedidoId = pedidoId;
      const r = await api('/estoque/entrada',{method:'POST',body});
      (r.pecas||[]).forEach(p=>{ p.qtdLote=l.quantidade; todas.push(p); });
    }
    // Marca a OP como Finalizada (fase final + 100%).
    try{ await api('/ops/'+id+'/status',{method:'PATCH',body:{status:'concluido', setorAtual:'Finalizado'}}); await api('/ops/'+id+'/progresso',{method:'PATCH',body:{progresso:100}}); }catch(_){}
    closeModal();
    toast(todas.length+' etiquetas geradas ('+(destino==='expedicao'?'p/ expedição':'p/ estoque')+') · OP finalizada.','ok');
    imprimirEtqUnidades(todas, {loteEntrada:'OP-'+id});
    loadRoute();
  }catch(e){ toast(e.message,'err'); }
}
