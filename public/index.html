<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherkesian ERP</title>
<!-- PWA / instalar no iPhone e Android -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E2C48">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cherkesian">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<style>
:root{
  --onyx:#0A0A0A; --onyx2:#100f0d; --sidebar:#131109; --sidebar2:#1b1810;
  --gold:#C9A227; --gold-d:#9a7d1e; --gold-l:#E4C76B;
  --ivory:#F4F2ED; --bg:#f4f2ed; --card:#ffffff; --ink:#242a26; --ink2:#3c433d;
  --muted:#807d72; --muted2:#93998f; --line:#e6e4dc; --line2:#eceae2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfccc2;border-radius:6px}
h1,h2,h3{font-family:'Sora',sans-serif;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.gold{color:var(--gold-d)}
a{color:var(--gold-d);text-decoration:none}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--onyx)}
#login .brandcol{background:var(--onyx);padding:56px 48px;display:flex;flex-direction:column;justify-content:center}
#login .formcol{background:var(--onyx2);padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.emblem{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Sora';font-weight:800;font-size:30px}
.kicker{font-size:10px;letter-spacing:.38em;color:var(--gold);font-weight:600;font-family:'Sora'}
.wordmark{font-family:'Sora';font-weight:700;font-size:30px;letter-spacing:.02em;color:var(--ivory);line-height:1}
.subm{font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-top:6px}
.tagline{font-family:'Sora';font-weight:600;font-size:19px;color:var(--gold-l);line-height:1.35;margin-top:40px}
.formcard{width:100%;max-width:360px;margin:0 auto}
.formcard h2{color:var(--ivory);font-size:22px}
.formcard .hint{font-size:12.5px;color:var(--muted);margin-top:5px;margin-bottom:24px}
.field-lbl{font-size:11px;color:var(--muted2);margin-bottom:6px;display:block}
.inp-dark{width:100%;height:44px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:var(--onyx);color:var(--ivory);padding:0 14px;font-size:14px;outline:none;margin-bottom:16px}
.inp-dark:focus{border-color:var(--gold)}
.btn-gold{height:46px;border:none;border-radius:10px;background:var(--gold);color:#0A0A0A;font-size:14px;font-weight:700;font-family:'Sora';width:100%}
.btn-gold:hover{background:var(--gold-l)}
.biz{display:flex;gap:9px;align-items:center;margin-top:18px}
.biz .dot{width:7px;height:7px;border-radius:50%;flex:none}
.biz .lbl{font-size:11px;color:var(--muted2);line-height:1.4}
.err{color:#e8998f;font-size:12.5px;margin-top:6px;min-height:16px}
.creds{margin-top:22px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.creds .t{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.creds .row{font-size:11px;color:var(--muted2);font-family:'IBM Plex Mono';line-height:1.7;cursor:pointer}
.creds .row:hover{color:var(--gold-l)}

/* ---------- Shell ---------- */
#shell{display:grid;grid-template-columns:248px 1fr;height:100%}
#side{background:var(--sidebar);color:#cfc9b8;display:flex;flex-direction:column;overflow-y:auto}
#side .head{padding:20px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06)}
#side .emblem-sm{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Sora';font-weight:800;font-size:15px;flex:none}
#side .grp{padding:14px 12px 2px}
#side .grp .gt{font-size:9.5px;letter-spacing:.18em;color:#6d6857;text-transform:uppercase;padding:0 8px 6px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:#c7c1b1;cursor:pointer;margin-bottom:1px}
.navitem:hover{background:rgba(255,255,255,.05);color:#fff}
.navitem.active{background:var(--gold);color:#0A0A0A;font-weight:600}
.navitem svg{width:16px;height:16px;flex:none}
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#top{height:64px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex:none}
#top .tt{font-size:17px;font-weight:700}
#top .ts{font-size:12px;color:var(--muted);margin-top:2px}
#top .user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:13px}
.btn-ghost{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font-size:12.5px;font-weight:600}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-d)}
#content{padding:24px 26px;overflow-y:auto}

/* ---------- Components ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k{font-size:11px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-family:'Sora';font-weight:700;font-size:24px;margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--muted2);margin-top:4px}
.sect{margin-top:26px}
.sect h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:#faf9f5;font-weight:600}
td{font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line2);color:var(--ink2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfbf7}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.pill.gold{background:#f7efd3;color:var(--gold-d)}
.pill.green{background:#e3f5e9;color:#1f8a4c}
.pill.red{background:#fbe6e2;color:#c14a34}
.pill.blue{background:#e5eefb;color:#2563a8}
.pill.gray{background:#eeece5;color:#6d6857}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.btn-primary{height:38px;padding:0 16px;border:none;border-radius:9px;background:var(--gold);color:#0A0A0A;font-size:13px;font-weight:700;font-family:'Sora'}
.btn-primary:hover{background:var(--gold-l)}
.btn-sm{height:30px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink2);font-size:12px;font-weight:600}
.btn-sm:hover{border-color:var(--gold);color:var(--gold-d)}
.inp{height:38px;border:1px solid #dcdfd6;border-radius:8px;padding:0 12px;font-size:13px;color:var(--ink);background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
label.fl{font-size:11px;color:var(--muted);margin-bottom:5px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.spin{width:22px;height:22px;border:2.5px solid #e6e2d4;border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-box h3{font-size:17px;margin-bottom:16px}
.mrow{margin-bottom:12px}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.tst{background:#131109;color:#fff;border-left:3px solid var(--gold);padding:12px 16px;border-radius:8px;font-size:13px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slideup .25s}
.tst.ok{border-left-color:#2fae63}.tst.err{border-left-color:#e05a3c}
@keyframes slideup{from{transform:translateY(10px);opacity:0}}
.gate{background:var(--onyx2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px;max-width:420px;color:var(--ivory)}
.hamb{display:none;background:transparent;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer;align-items:center;justify-content:center;color:var(--ink);flex:none}
#navmask{display:none}
@media(max-width:860px){
  #shell{grid-template-columns:1fr}
  #side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:84vw;z-index:1000;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 34px rgba(0,0,0,.55)}
  #shell.navopen #side{transform:translateX(0)}
  #navmask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999}
  #shell:not(.navopen) #navmask{display:none}
  #shell.navopen #navmask{display:block}
  .hamb{display:inline-flex}
  #top{height:58px;padding:0 12px}
  #top .tt{font-size:15px}
  #top .ts{display:none}
  #top .user>div:first-child{display:none}
  #content{padding:14px}
  #login{grid-template-columns:1fr}#login .brandcol{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="modal"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const API = '/api/v1';
const LS = { access:'ck_access', refresh:'ck_refresh', user:'ck_user' };

// ---------- Estado ----------
const S = {
  user: null,           // { id, nome, usuario, acesso, setor, cargo }
  access: null,         // token
  refresh: null,
  route: 'dashboard',
  loading: false,
  cache: {},            // dados por rota
  loginErr:'', gate:null, gateErr:'',
};

// ---------- RBAC (espelho do backend) ----------
const ACCESS = {

  consultoria:['dashboard','tv','bi','pcp','producao','kits','expedicao','estoque','vendas','clientes','comissoes'],
};
const NAVDEF = [
  ['Visão geral', [['dashboard','Dashboard','grid'],['bi','BI Produção','trend'],['tv','Painel de TV','tv'],['agente','Assistente IA','spark']]],
  ['Comercial', [['vendas','Vendas / Pedidos','cart'],['clientes','Clientes','users'],['medidas','Ficha de Medidas','ruler'],['comissoes','Comissões','pct'],['precificacao','Precificação','tag']]],
  ['Produção / PCP', [['pcp','Painel de PCP','cal'],['producao','Ordens de Produção','fact'],['kits','Kits / Rastreio','box'],['piloto','Peças Piloto','clip'],['compras','Ordens de Compra','bag']]],
  ['Estoque & Logística', [['estoque','Estoque','box'],['expedicao','Expedição','truck'],['notas','Notas Fiscais','file'],['entrada','Notas de Entrada','bag']]],
  ['Financeiro', [['receber','A Receber','in'],['pagar','A Pagar','out'],['fluxo','Fluxo de Caixa','trend'],['impostos','Impostos','file']]],
  ['Cadastros', [['produtos','Produtos','shirt'],['materia','Matéria-prima','layers'],['aviamentos','Aviamentos','scissors'],['fornecedores','Fornecedores','users'],['regras','Categorias & Regras','book']]],
  ['Administração', [['filiais','Filiais / CNPJs','box'],['empresa','Config. Fiscal (NF-e)','file'],['usuarios','Usuários & Acessos','shield'],['logs','Auditoria / Logs','clock']]],
];
// telas já implementadas nesta fatia vertical
const READY = new Set(['dashboard','bi','clientes','produtos','vendas','materia','fornecedores','receber','pagar','fluxo','comissoes','impostos','pcp','producao','kits','piloto','compras','estoque','expedicao','usuarios','logs','medidas','precificacao','aviamentos','tv','regras','empresa','notas','entrada','agente','filiais']);
const TITLES = {
  dashboard:['Dashboard','Visão geral · indicadores consolidados'],
  bi:['BI de Produção','Produtividade da cadeia: lead time, gargalos, facções, faturamento × produção'],
  vendas:['Vendas / Pedidos','Do orçamento à expedição · automação'],
  clientes:['Clientes','Cadastro central de clientes'],
  produtos:['Produtos','Catálogo · SKU PRD-CAT-0000'],
  materia:['Matéria-prima','Tecidos e insumos · MP-CAT-0000'],
  fornecedores:['Fornecedores','Fornecedores e facções'],
  receber:['Contas a Receber','O que os clientes devem'],
  pagar:['Contas a Pagar','Fornecedores, facção e despesas'],
  fluxo:['Fluxo de Caixa','Realizado e projeção por vencimento'],
  comissoes:['Comissões','Comissão por venda e por vendedor'],
  impostos:['Impostos por empresa','Estimativa de tributos federais por regime (Real/Presumido/Simples)'],
  pcp:['Painel de PCP','Programação, capacidade e prazos das OPs'],
  producao:['Ordens de Produção','Quadro de OPs por etapa'],
  kits:['Kits / Rastreabilidade','Corte por kit · etiqueta Zebra · expedição/retorno facção · rastreio por lote'],
  piloto:['Peças Piloto','Trava a produção até a aprovação da amostra'],
  compras:['Ordens de Compra','Geradas por déficit de material'],
  entrada:['Notas de Entrada','NFs de compra · estoque e contas a pagar'],
  estoque:['Estoque — Produto Acabado','Saldo por item e rastreio por lote'],
  expedicao:['Expedição','Envios com rastreio, NF e lote consumido'],
  usuarios:['Usuários & Acessos','Gestão de logins e permissões · admin'],
  logs:['Auditoria / Logs','Histórico de ações no sistema · admin'],
  medidas:['Ficha de Medidas','Grade de tamanhos por colaborador do cliente'],
  precificacao:['Precificação','Ficha de custo · preço sugerido pela margem'],
  aviamentos:['Aviamentos','Botões, zíperes, etiquetas · AVI-CAT-0000'],
  tv:['Painel de Setor','Modo TV · produção em tempo real'],
  regras:['Categorias & Regras','Padronização de códigos do sistema'],
  empresa:['Configuração Fiscal','Empresa emitente da NF-e + numeração · admin'],
  filiais:['Filiais / CNPJs do grupo','Matriz e filiais emissoras de NF-e · admin'],
  notas:['Notas Fiscais','NF-e emitidas · status, chave e protocolo'],
  agente:['Assistente IA','Pergunte sobre pedidos, produção, estoque e financeiro'],
};
const ICONS = {
  grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  cart:'M3 4h2l2.2 11.2a1 1 0 001 .8h8.6a1 1 0 001-.8L20 8H6M9 20a1 1 0 100-.01M17 20a1 1 0 100-.01',
  users:'M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9.5 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7M22 21v-2a4 4 0 00-3-3.87',
  pct:'M19 5L5 19M7 7a1.6 1.6 0 100 .01M17 17a1.6 1.6 0 100 .01',
  cal:'M4 5h16v16H4zM4 9h16M8 3v4M16 3v4',
  fact:'M3 21V9l6 4V9l6 4V5l6 3v13z',
  clip:'M9 4h6v3H9zM7 6h10v14H7z',
  bag:'M6 7h12l-1 13H7zM9 7a3 3 0 016 0',
  box:'M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7',
  truck:'M3 6h11v9H3zM14 9h4l3 3v3h-7M7 19a1.5 1.5 0 100-.01M18 19a1.5 1.5 0 100-.01',
  in:'M12 3v12M7 10l5 5 5-5M4 21h16',
  out:'M12 15V3M7 8l5-5 5 5M4 21h16',
  trend:'M3 17l6-6 4 4 8-8M15 7h6v6',
  file:'M6 2h9l5 5v15H6zM14 2v6h6',
  shirt:'M6 4l3-2 3 2 3-2 3 2-3 3v13H9V7z',
  layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',
  shield:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
  clock:'M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18',
  tv:'M3 7h18v11H3zM8 21h8M8 3l4 4 4-4',
  ruler:'M3 17L17 3l4 4L7 21zM8 12l2 2M11 9l2 2M14 6l2 2',
  tag:'M3 12V3h9l9 9-9 9zM7.5 7.5a.5.5 0 100 .01',
  scissors:'M6 9a3 3 0 100-6 3 3 0 000 6M6 21a3 3 0 100-6 3 3 0 000 6M20 4L8.5 15.5M20 20L8.5 8.5',
  book:'M4 19V5a2 2 0 012-2h14v18H6a2 2 0 01-2-2zM4 17h16',
  spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z',
};
function icon(k){ const d=ICONS[k]||'M5 12h14'; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>'; }

// ---------- Utilidades ----------
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money = v => BRL.format(Number(v||0));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciais = n => String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const $ = id => document.getElementById(id);
function toast(msg, kind){ const el=document.createElement('div'); el.className='tst '+(kind||''); el.textContent=msg; $('toast').appendChild(el); setTimeout(()=>el.remove(), 4200); }

// ---------- API ----------
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(S.access && !opts.noauth) headers['Authorization'] = 'Bearer '+S.access;
  let res = await fetch(API+path, { method:opts.method||'GET', headers, body: opts.body?JSON.stringify(opts.body):undefined });
  if(res.status===401 && !opts.noauth && !opts._retry && S.refresh){
    const ok = await tryRefresh();
    if(ok) return api(path, Object.assign({}, opts, {_retry:true}));
  }
  const text = await res.text();
  let data = null; try{ data = text?JSON.parse(text):null; }catch(e){ data = text; }
  if(!res.ok){
    const msg = (data && (data.message||data.error)) || ('Erro '+res.status);
    const e = new Error(Array.isArray(msg)?msg.join(' · '):msg); e.status=res.status; e.data=data; throw e;
  }
  return data;
}
async function tryRefresh(){
  try{
    const d = await api('/auth/refresh', {method:'POST', noauth:true, body:{refreshToken:S.refresh}});
    S.access=d.accessToken; S.refresh=d.refreshToken;
    localStorage.setItem(LS.access,S.access); localStorage.setItem(LS.refresh,S.refresh);
    return true;
  }catch(e){ logout(true); return false; }
}

// ---------- Auth ----------
async function doLogin(usuario, senha){
  S.loginErr=''; renderLogin();
  try{
    const d = await api('/auth/login', {method:'POST', noauth:true, body:{usuario, senha}});
    onAuthed(d);
  }catch(e){
    if(e.status===403){ // fora do horário -> gate do admin
      S.gate = { usuario, senha }; S.gateErr=''; renderLogin();
    } else { S.loginErr = e.message || 'Falha no login.'; renderLogin(); }
  }
}
async function doGate(adminUsuario, adminSenha){
  S.gateErr=''; renderLogin();
  try{
    const d = await api('/auth/authorize-offhours', {method:'POST', noauth:true,
      body:{ usuario:S.gate.usuario, senha:S.gate.senha, adminUsuario, adminSenha }});
    S.gate=null; onAuthed(d);
  }catch(e){ S.gateErr = e.message || 'Autorização negada.'; renderLogin(); }
}
function onAuthed(d){
  S.access=d.accessToken; S.refresh=d.refreshToken; S.user=d.usuario;
  localStorage.setItem(LS.access,S.access); localStorage.setItem(LS.refresh,S.refresh);
  localStorage.setItem(LS.user, JSON.stringify(d.usuario));
  const allowed = ACCESS[S.user.acesso];
  S.route = (allowed==='*') ? 'dashboard' : (allowed.includes('dashboard')?'dashboard':firstReady(allowed));
  S.cache={};
  renderShell(); loadRoute(); checkDeepLink();
  toast('Bem-vindo, '+S.user.nome.split(' ')[0]+'!', 'ok');
}
function firstReady(allowed){ for(const r of allowed){ if(READY.has(r)) return r; } return allowed[0]; }
function logout(silent){
  S.user=S.access=S.refresh=null; S.cache={};
  localStorage.removeItem(LS.access); localStorage.removeItem(LS.refresh); localStorage.removeItem(LS.user);
  renderLogin(); if(!silent) toast('Sessão encerrada.');
}
function canAccess(route){ const a=ACCESS[S.user.acesso]; return a==='*'||a.includes(route); }

async function formExpParcial(pedidoId){
  let ped; try{ ped=await api('/pedidos/'+pedidoId); }catch(e){ toast(e.message,'err'); return; }
  const itens = ped.itens||[];
  const cards = itens.map(it=>{
    const grade = it.grade && Object.keys(it.grade).length ? it.grade : null;
    if(grade){
      const jaG = it.gradeExpedida||{};
      const sizes = Object.entries(grade).map(([t,q])=>{
        const res = Number(q) - Number(jaG[t]||0);
        return `<div style="display:inline-flex;flex-direction:column;align-items:center;margin:0 8px 6px 0">
          <span style="font-size:9px;letter-spacing:.5px;color:#6b6b72;text-transform:uppercase">${esc(t)} · resid ${res}</span>
          <input type="number" min="0" max="${res}" value="${res>0?res:0}" ${res>0?'':'disabled'} class="expg" data-item="${it.id}" data-tam="${esc(t)}" style="width:56px;text-align:center;padding:4px;margin-top:2px;${res>0?'':'background:#f2f2f2'}">
        </div>`;
      }).join('');
      const totalRes = Object.entries(grade).reduce((s,[t,q])=>s+(Number(q)-Number(jaG[t]||0)),0);
      return `<div style="padding:10px 12px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:8px;background:#fff">
        <div style="font-weight:700;font-size:13px">${esc(it.descricao)} <span class="muted" style="font-weight:400;font-size:11px">· residual ${totalRes}</span></div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap">${sizes}</div></div>`;
    }
    const exp = it.quantidadeExpedida||0; const res = it.quantidade-exp;
    return `<div style="padding:10px 12px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:700;font-size:13px">${esc(it.descricao)}</div><div class="muted" style="font-size:11px">Residual: ${res} de ${it.quantidade}</div></div>
      <input type="number" min="0" max="${res}" value="${res>0?res:0}" ${res>0?'':'disabled'} class="expq" data-item="${it.id}" style="width:74px;text-align:center;padding:5px"></div>`;
  }).join('');
  openModal(`<h3>📦 Expedição parcial · <span class="mono gold">${esc(ped.numero)}</span></h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 10px">Informe quanto expedir agora — <b>por tamanho</b> quando o item tem grade. O que sobrar fica em <b>residual em aberto</b> aguardando finalizar.</div>
    <div style="max-height:52vh;overflow:auto">${cards||'<div class="muted">Pedido sem itens.</div>'}</div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveExpParcial(${pedidoId})">Gerar expedição parcial</button></div>`);
}
async function saveExpParcial(pedidoId){
  const byItem = {};
  document.querySelectorAll('.expg').forEach(inp=>{ const q=Number(inp.value||0); if(q>0){ const id=inp.dataset.item; if(!byItem[id]) byItem[id]={grade:{}}; byItem[id].grade[inp.dataset.tam]=q; } });
  document.querySelectorAll('.expq').forEach(inp=>{ const q=Number(inp.value||0); if(q>0){ byItem[inp.dataset.item]={quantidade:q}; } });
  const itens = Object.entries(byItem).map(([id,v])=>({pedidoItemId:Number(id), ...v}));
  if(!itens.length){ toast('Informe ao menos uma quantidade para expedir.','err'); return; }
  try{ const e=await api('/expedicoes/parcial/'+pedidoId,{method:'POST',body:{itens}});
    closeModal(); toast('Expedição parcial '+e.numero+' criada. Emita a NF na tela de Expedição.','ok'); loadRoute();
  }catch(err){ toast(err.message,'err'); }
}

function relatorio(tipo){
  const cfg = REL_FILTROS[tipo]||{};
  const temFiltro = cfg.periodo||cfg.status;
  const periodo = cfg.periodo ? `<div class="grid2">${field('rel_de','De','type="date"')}${field('rel_ate','Até','type="date"')}</div>` : '';
  const status = cfg.status ? `<div class="mrow"><label class="fl">${esc(cfg.status.label)}</label><select id="rel_status" class="inp"><option value="">— todos —</option>${cfg.status.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>` : '';
  openModal(`<h3>📄 Gerar relatório</h3>
    <p class="muted" style="font-size:12px;margin:-4px 0 10px">${temFiltro?'Filtre por período/status (em branco = tudo) e escolha o formato.':'Escolha o formato do relatório.'}</p>
    ${periodo}${status}
    <div class="mrow"><label class="fl">Formato do arquivo</label>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn-primary" style="flex:1" onclick="APP.relGerar('${tipo}','pdf')">📄 Gerar PDF</button>
        <button type="button" class="btn-primary" style="flex:1;background:#1e7a44" onclick="APP.relGerar('${tipo}','xlsx')">📊 Gerar Excel</button>
      </div></div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Fechar</button></div>`);
}
function relGerar(tipo, fmt){
  const p = new URLSearchParams();
  const de=val('rel_de'), ate=val('rel_ate'), se=$('rel_status');
  if(de) p.set('de',de); if(ate) p.set('ate',ate); if(se && se.value) p.set('status',se.value);
  closeModal();
  baixarRel(tipo, p.toString(), fmt||'pdf');
}
async function baixarRel(tipo, qs, fmt){
  fmt = fmt||'pdf';
  try{
    const r = await fetch(API+'/relatorios/'+tipo+'/'+fmt+(qs?'?'+qs:''), { headers:{ Authorization:'Bearer '+S.access } });
    if(!r.ok){ let m='Falha ao gerar relatório ('+r.status+').'; try{ const j=await r.json(); m=j.message||m; }catch(e){} throw new Error(m); }
    const blob = await r.blob();
    if(fmt==='xlsx'){
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relatorio-'+tipo+'.xlsx';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); },120); toast('Excel gerado — verifique os downloads.','ok');
    } else {
      window.open(URL.createObjectURL(blob), '_blank');
    }
  }catch(e){ toast(e.message,'err'); }
}
function panelTable(cols, rows, emptyMsg){
  if(emptyMsg) return `<div class="panel"><div class="empty">${esc(emptyMsg)}</div></div>`;
  return `<div class="panel" style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

    const cancelBtn = o.cancel!==false ? `<button class="uibtn ghost" data-r="0">${esc(o.cancel||'Cancelar')}</button>` : '';

    </div></div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('on'));
    function done(v){ ov.classList.remove('on'); document.removeEventListener('keydown',onKey); setTimeout(()=>ov.remove(),170); resolve(v); }
    function onKey(e){ if(e.key==='Escape') done(false); if(e.key==='Enter') done(true); }
    ov.addEventListener('click',e=>{ if(e.target===ov){ if(o.cancel!==false) done(false); return; } const b=e.target.closest('[data-r]'); if(b) done(b.dataset.r==='1'); });
    document.addEventListener('keydown',onKey);
    setTimeout(()=>{ const b=ov.querySelector('[data-r="1"]'); if(b) b.focus(); },60);
  });
}

async function lookupCnpj(cnpjId, map){
  const dig=(val(cnpjId)||'').replace(/\D/g,'');
  if(dig.length!==14){ toast('Digite o CNPJ completo (14 dígitos) para buscar.','err'); return; }
  toast('Buscando dados do CNPJ…','ok');
  try{
    const d=await api('/lookup/cnpj/'+dig);
    for(const k in map){ if(k==='_cidadeUf') continue; const el=$(map[k]); if(el && d[k]!=null && d[k]!=='') el.value=d[k]; }
    if(map._cidadeUf){ const el=$(map._cidadeUf); if(el && (d.municipio||d.uf)) el.value=(d.municipio||'')+(d.uf?'/'+d.uf:''); }
    toast('Dados preenchidos'+(d.situacao?(' · '+d.situacao):'')+'.','ok');
  }catch(e){ toast(e.message||'CNPJ não encontrado.','err'); }
}
async function lookupCep(cepId, map){
  const dig=(val(cepId)||'').replace(/\D/g,'');
  if(dig.length!==8) return;
  try{
    const d=await api('/lookup/cep/'+dig);
    for(const k in map){ if(k==='_cidadeUf') continue; const el=$(map[k]); if(el && d[k]!=null && d[k]!=='') el.value=d[k]; }
    if(map._cidadeUf){ const el=$(map._cidadeUf); if(el && (d.municipio||d.uf)) el.value=(d.municipio||'')+(d.uf?'/'+d.uf:''); }
  }catch(e){}
}

function expandGradeJS(grade){
  const E=['PP','P','M','G','GG','G1','G2','G3','G4','G5','G6','G7','G8'];
  const t=(grade||'').trim().toUpperCase();
  const m=/^(\S+)\s+A[O]?\s+(\S+)$/.exec(t);
  if(m){ const i=E.indexOf(m[1]), f=E.indexOf(m[2]); if(i>=0&&f>=i) return E.slice(i,f+1); }
  return t.split(/[,;/ ]+/).map(s=>s.trim()).filter(Boolean).slice(0,16);
}
function deriveSizes(p){
  let s = expandGradeJS(p.grade);
  if(!s.length){ const set=[]; (p.medidas||[]).forEach(m=>Object.keys(m.valores||{}).forEach(k=>{ if(!set.includes(k)) set.push(k); })); s=set; }
  return s;
}
function fileToDataURL(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ const r=Math.min(maxDim/w,maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg',quality));
    }; img.onerror=reject; img.src=fr.result; };
    fr.onerror=reject; fr.readAsDataURL(file);
  });
}

async function saveProduto(id){
  pmedSync();
  const body = { categoria:val('f_cat'), descricao:val('f_desc'), cor:val('f_cor'), grade:val('f_grade'),
    referencia:val('f_ref'), marca:val('f_marca'), linha:val('f_linha'), grupo:val('f_grupo'),
    modelagem:val('f_model'), tecido:val('f_tec'), composicao:val('f_comp'),
    especificacoes:val('f_espec'), observacoes:val('f_obs'),
    ncm:val('f_ncm'), cfop:val('f_cfop'), unidadeComercial:val('f_un'), cest:val('f_cest'),
    icmsCst:val('f_icst'), pisCst:val('f_piscof'), cofinsCst:val('f_piscof') };
  const preco = val('f_preco'); if(preco) body.precoBase = Number(preco);
  const precoEsp = val('f_precoesp'); if(precoEsp!=='') body.precoEspecial = Number(precoEsp);
  const tamsEsp = val('f_tamsesp'); if(tamsEsp) body.tamsEspeciais = tamsEsp;
  const cliGrupo = val('f_cligrupo'); if(cliGrupo) body.clienteGrupo = cliGrupo;
  const cliId = val('f_cliid'); if(cliId) body.clienteId = Number(cliId);
  const setor = val('f_setor'); if(setor) body.setor = setor;
  const custo = val('f_custo'); if(custo!=='') body.custo = Number(custo);
  const tipo = val('f_tipo'); if(tipo) body.tipo = tipo;
  const orig = val('f_orig'); if(orig!=='') body.origem = Number(orig);
  const ialq = val('f_ialq'); if(ialq) body.icmsAliquota = Number(ialq);
  if(!body.categoria||!body.descricao){ toast('Categoria e descrição são obrigatórias.','err'); return; }
  Object.keys(body).forEach(k=>{ if(body[k]==='') delete body[k]; });
  // fotos e medidas SEMPRE enviadas (string vazia limpa; medidas substituem a grade)
  const fm=window.__FOTO||{};
  body.fotoModelo = fm.modelo||''; body.fotoModelagem = fm.modelagem||'';
  const am=window.__ARQMOD||{};
  body.arquivoModelagem = am.data||''; body.arquivoModelagemNome = am.nome||'';
  body.medidas = (window.__PMED||[]).filter(r=>r.descricao&&r.descricao.trim())
    .map((r,i)=>({ descricao:r.descricao.trim(), tolerancia:(r.tolerancia||'').trim()||undefined, valores:r.valores||{}, ordem:i }));
  // Tamanhos: sincroniza o campo "Tamanhos (colunas)" para a grade — persiste sempre,
  // mesmo sem linhas de medida (corrige tamanhos que sumiam ao reabrir/na ficha).
  const tams = val('f_tam').split(/[,;/ ]+/).map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,16);
  const gradeStr = val('f_grade').trim() || tams.join(', ');
  body.grade = gradeStr; // string vazia limpa a grade
  try{ await api(id?('/produtos/'+id):'/produtos',{method:id?'PATCH':'POST',body}); closeModal(); toast('Produto salvo.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

// ===== Receita (BOM): materiais + consumo por tamanho + componentes do conjunto =====
async function formReceita(id){
  let prod, consumos, materiais, produtos;
  try{
    [prod, consumos, materiais, produtos] = await Promise.all([
      api('/produtos/'+id), api('/consumo?produtoId='+id), api('/materiais'), api('/produtos')
    ]);
  }catch(e){ toast(e.message,'err'); return; }
  window.__REC = {
    id, prod,
    grade: (prod.grade||'').split(/[,;/ ]+/).map(s=>s.trim().toUpperCase()).filter(Boolean).slice(0,16),
    consumos: consumos||[],
    materiais: materiais||[],
    produtos: (produtos||[]).filter(p=>p.id!==id),
    componentes: Array.isArray(prod.componentes)? prod.componentes.map(c=>({produtoId:c.produtoId, quantidade:Number(c.quantidade)||1})) : [],
    open: null, // id do consumo com o painel "por tamanho" aberto
  };
  renderReceita();
}
function recMatName(mid){ const m=(window.__REC.materiais||[]).find(x=>x.id===mid); return m?(m.codigo+' · '+m.descricao):('#'+mid); }
function recProdName(pid){ const p=(window.__REC.produtos||[]).find(x=>x.id===pid)|| (window.__REC.prod.id===pid?window.__REC.prod:null); return p?(p.codigo+' · '+p.descricao):('#'+pid); }

  }).join('');

  const prodOpts = (R.produtos||[]).map(p=>`<option value="${p.id}">${esc(p.codigo)} · ${esc(p.descricao)}</option>`).join('');

  openModal(`<h3>🧬 Receita técnica — ${esc(R.prod.codigo)} <span class="muted" style="font-size:12px;font-weight:400">${esc(R.prod.descricao)}</span></h3>

    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #e7e3d8;border-radius:10px;overflow:hidden">
      <thead><tr><th style="text-align:left;padding:7px 8px;background:#F4F2ED;font-size:11px">Peça componente</th><th style="text-align:right;padding:7px 8px;background:#F4F2ED;font-size:11px">Qtd / conjunto</th><th style="background:#F4F2ED"></th></tr></thead>
      <tbody>${compRows||'<tr><td colspan="3" style="padding:8px;text-align:center;color:#999">Não é conjunto (produto simples).</td></tr>'}</tbody></table></div>

      <button class="btn-sm" onclick="APP.recCompAdd()">+ Adicionar</button>
    </div>

    ${secDivisor('MATERIAIS / TECIDOS (BOM)')}

function recToggle(cid){ window.__REC.open = cid||null; renderReceita(); }
async function recAddMaterial(){
  const R=window.__REC; const txt=val('rec_mat').trim(); const qt=Number(val('rec_qt')); const un=val('rec_un').trim()||'m';
  if(!txt){ toast('Escolha o material.','err'); return; }
  if(!(qt>0)){ toast('Informe a quantidade base.','err'); return; }
  const cod=txt.split(' · ')[0].trim().toUpperCase();
  const m=(R.materiais||[]).find(x=>x.codigo.toUpperCase()===cod) || (R.materiais||[]).find(x=>(x.codigo+' · '+x.descricao).toUpperCase()===txt.toUpperCase());
  if(!m){ toast('Material não encontrado. Selecione da lista.','err'); return; }
  try{ await api('/consumo',{method:'POST',body:{produtoId:R.id, materialId:m.id, quantidade:qt, unidade:un}}); toast('Material vinculado.','ok'); formReceita(R.id); }
  catch(e){ toast(e.message,'err'); }
}
async function recSalvarLinha(cid){
  const qt=Number(val('qt_'+cid)); const un=val('un_'+cid).trim();
  if(!(qt>0)){ toast('Quantidade inválida.','err'); return; }
  try{ await api('/consumo/'+cid,{method:'PATCH',body:{quantidade:qt, unidade:un||undefined}}); toast('Linha salva.','ok');
    const cs=window.__REC.consumos.find(x=>x.id===cid); if(cs){ cs.quantidade=qt; if(un)cs.unidade=un; } renderReceita();
  }catch(e){ toast(e.message,'err'); }
}
async function recSalvarPorTamanho(cid){
  const R=window.__REC; const grid=R.grade.length?R.grade:Object.keys((R.consumos.find(x=>x.id===cid)||{}).porTamanho||{});
  const pt={}; grid.forEach(t=>{ const v=val('pt_'+cid+'_'+t); if(v!=='' && !isNaN(Number(v))) pt[t]=Number(v); });
  try{ await api('/consumo/'+cid,{method:'PATCH',body:{porTamanho:pt}}); toast('Consumo por tamanho salvo.','ok');
    const cs=R.consumos.find(x=>x.id===cid); if(cs) cs.porTamanho=pt; R.open=null; renderReceita();
  }catch(e){ toast(e.message,'err'); }
}
async function recLimparPorTamanho(cid){
  try{ await api('/consumo/'+cid,{method:'PATCH',body:{porTamanho:{}}}); toast('Por tamanho limpo.','ok');
    const cs=window.__REC.consumos.find(x=>x.id===cid); if(cs) cs.porTamanho={}; window.__REC.open=null; renderReceita();
  }catch(e){ toast(e.message,'err'); }
}
async function recRemover(cid){
  if(!await uiConfirm('Remover este material da receita?')) return;
  try{ await api('/consumo/'+cid,{method:'DELETE'}); toast('Removido.','ok'); formReceita(window.__REC.id); }
  catch(e){ toast(e.message,'err'); }
}
function recCompAdd(){
  const R=window.__REC; const pid=Number(val('rec_comp')); const q=Number(val('rec_compq'))||1;
  if(!pid){ toast('Escolha o produto.','err'); return; }
  if(R.componentes.some(c=>c.produtoId===pid)){ toast('Peça já está no conjunto.','err'); return; }

// Calcula o vencimento estimado a partir da forma de pagamento (ex.: "20 DDL", "30/60/90").
function calcVenc(){
  const el=$('f_pag_venc'); if(!el) return;
  const forma=val('f_pag');
  const dias=[...(forma||'').matchAll(/(\d{1,3})/g)].map(m=>parseInt(m[1],10)).filter(d=>d>0&&d<=360).sort((a,b)=>a-b);
  if(!dias.length){ el.innerHTML = forma?'<span style="color:#3a8f4f">À vista / sem prazo</span>':''; return; }
  const hoje=new Date();
  const fmt=d=>{ const x=new Date(hoje); x.setDate(x.getDate()+d); return x.toLocaleDateString('pt-BR'); };
  const txt = dias.map(d=>'<b>'+fmt(d)+'</b> ('+d+'d)').join(' · ');
  el.innerHTML = '📅 Vencimento: '+txt+' <span style="color:#8a8674">— a partir do faturamento</span>';
}
function prodLabel(p){ return p.codigo+' · '+p.descricao; }
function prodByLabel(list,v){ if(!v) return null; v=String(v).trim(); const code=(v.split('·')[0]||v).trim(); return (list||[]).find(x=>prodLabel(x)===v||x.codigo===code||x.descricao===v)||null; }
function prodDatalist(id,list){ return `<datalist id="${id}">${(list||[]).map(p=>`<option value="${esc(prodLabel(p))}"></option>`).join('')}</datalist>`; }
const TAMS_PADRAO=['PP','P','M','G','GG','G1','G2','G3'];
function parseGradeTxt(txt){ const o={}; let soma=0; for(const par of String(txt||'').split(/[,;]+/)){ const m=par.split(':'); const t=(m[0]||'').trim().toUpperCase(); const q=Math.round(Number((m[1]||'').trim())); if(t&&q>0){o[t]=q;soma+=q;} } return {o,soma}; }
function renderItens(){
  const prods = window.__PROD||[];
  $('pitens').innerHTML = prodDatalist('prodlist',prods) + PITENS.map((it,i)=>{
    const cur = it.produtoId ? prods.find(p=>p.id===it.produtoId) : null;
    const gradeTxt = it.grade ? Object.entries(it.grade).map(([t,q])=>t+':'+q).join(', ') : '';
    return `<div style="border:1px solid #efece3;border-radius:8px;padding:8px;margin-bottom:8px">
      <div class="grid2" style="align-items:end;margin-bottom:6px">
        <div><input class="inp" id="it_prod_${i}" list="prodlist" placeholder="digite p/ buscar produto…" value="${cur?esc(prodLabel(cur)):''}" onchange="APP.itemPreco(${i})"></div>
        <div style="display:flex;gap:6px"><input class="inp" id="it_val_${i}" type="number" step="0.01" placeholder="valor unit." value="${it.val||''}">
          ${PITENS.length>1?`<button class="btn-sm" onclick="APP.rmItem(${i})">×</button>`:''}</div>
      </div>
      <input class="inp" id="it_grade_${i}" placeholder="Grade por tamanho: PP:8, M:2, G:2 (ou deixe vazio e informe a qtd)" value="${esc(gradeTxt)}" oninput="APP.itemQty(${i})">
      <div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        ${TAMS_PADRAO.map(t=>`<button class="btn-sm" type="button" onclick="APP.itemAddTam(${i},'${t}')">+${t}</button>`).join('')}
        <span style="margin-left:auto;font-size:12px;color:#4a473f">Qtd total: <b id="it_qtdlbl_${i}">0</b></span>
        <input class="inp" id="it_qtd_${i}" type="number" min="1" placeholder="qtd s/ grade" value="${it.grade?'':(it.qtd||'')}" style="width:120px" oninput="APP.itemQty(${i})">
      </div>
    </div>`;
  }).join('');
  PITENS.forEach((it,i)=>itemQty(i));
}
function addItem(){ PITENS.push({}); renderItens(); }
function rmItem(i){ PITENS.splice(i,1); renderItens(); }
function itemQty(i){ const g=parseGradeTxt(val('it_grade_'+i)); const lbl=$('it_qtdlbl_'+i); if(!lbl)return; const manual=Number(val('it_qtd_'+i))||0; lbl.textContent = g.soma>0?g.soma:manual; }
function itemAddTam(i,t){ const el=$('it_grade_'+i); if(!el)return; if(new RegExp('(^|[,;\\s])'+t+'\\s*:','i').test(el.value)){toast(t+' já está na grade.','err');return;} el.value=el.value.trim()?(el.value.replace(/[,;\s]*$/,'')+', '+t+':'):(t+':'); el.focus(); itemQty(i); }
function itemPreco(i){ const p=prodByLabel(window.__PROD,val('it_prod_'+i)); if(p && p.precoBase && !$('it_val_'+i).value) $('it_val_'+i).value=p.precoBase; }
async function savePedido(id){
  const clienteId = Number(val('f_cli'));
  const itens = [];
  for(let i=0;i<PITENS.length;i++){
    const p=prodByLabel(window.__PROD,val('it_prod_'+i)), v=val('it_val_'+i);
    if(!p) continue;
    const g=parseGradeTxt(val('it_grade_'+i)); const manual=Number(val('it_qtd_'+i))||0;
    const quantidade = g.soma>0?g.soma:manual;
    if(!(quantidade>0)){ toast('Item '+(i+1)+': informe a grade ou a quantidade.','err'); return; }
    const item={ produtoId:p.id, quantidade, valorUnit:Number(v) };
    if(g.soma>0) item.grade=g.o;
    itens.push(item);
  }
  if(!clienteId){ toast('Selecione o cliente.','err'); return; }
  if(!itens.length){ toast('Adicione ao menos um item com produto.','err'); return; }
  const body = { clienteId, itens }; const pag=val('f_pag'); if(pag) body.formaPagamento=pag;
  const fil=val('f_filial'); if(fil) body.filialId=Number(fil);
  const prazo=val('f_prazo'); if(prazo) body.prazoEntrega=prazo;
  const oc=val('f_oc'); if(oc) body.ordemCompraCliente=oc;
  try{
    if(id){ const p=await api('/pedidos/'+id,{method:'PATCH',body}); closeModal(); toast('Pedido '+p.numero+' atualizado.','ok'); }
    else { const p=await api('/pedidos',{method:'POST',body}); closeModal(); toast('Pedido '+p.numero+' criado'+(p.exigePiloto?' (exige piloto)':'')+'.','ok'); }
    loadRoute();
  } catch(e){ toast(e.message,'err'); }
}

async function gerarOp(id){
  try{
    const r = await api('/pedidos/'+id+'/gerar-op',{method:'POST'});

      let msg=(r.ops&&r.ops.length>1?'OPs geradas: ':'OP gerada: ')+nums+'. Material baixado.';
      if(r.revenda&&r.revenda.length) msg+=' '+r.revenda.length+' item(ns) de revenda não geram OP.';
      toast(msg,'ok');
    }
    else if(r.status==='sem_producao') toast('Pedido só de revenda — nenhuma OP. Liberado para expedição.','ok');
    else if(r.status==='bloqueado_material'){ const oc=r.ordensCompra.map(o=>o.numero).join(', '); toast('Bloqueado por material. Ordem(ns) de compra criada(s): '+oc,'err'); }
    else if(r.status==='bloqueado_piloto') toast('Bloqueado: '+r.message,'err');
    loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

function fluxoMesRef(){ if(!window.__FLUXOMES){ const d=new Date(); window.__FLUXOMES={a:d.getFullYear(),m:d.getMonth()}; } return window.__FLUXOMES; }
function fluxoMesNav(delta){ const r=fluxoMesRef(); let m=r.m+delta,a=r.a; if(m<0){m=11;a--;} if(m>11){m=0;a++;} window.__FLUXOMES={a,m}; renderFluxoCalendario($('fluxoBody')); }
function fluxoRange(){ const r=fluxoMesRef(); const p2=n=>String(n).padStart(2,'0'); const de=`${r.a}-${p2(r.m+1)}-01`; const ult=new Date(r.a,r.m+1,0).getDate(); const ate=`${r.a}-${p2(r.m+1)}-${p2(ult)}`; return {de,ate}; }
async function renderFluxoCalendario(host){
  const {de,ate} = fluxoRange();
  host.innerHTML = '<div class="muted" style="padding:20px">Carregando calendário…</div>';
  let cal; try{ cal = await api('/financeiro/fluxo/calendario?de='+de+'&ate='+ate); }catch(e){ host.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  window.__FLUXOCAL=cal;
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const r=fluxoMesRef();
  const byDay={}; cal.dias.forEach(d=>{ byDay[d.data]=d; });
  const primeiro=new Date(r.a,r.m,1); const offset=primeiro.getDay(); const ndias=new Date(r.a,r.m+1,0).getDate();
  const p2=n=>String(n).padStart(2,'0');
  const cells=[];
  for(let i=0;i<offset;i++) cells.push('<div class="fcal-cell fcal-empty"></div>');
  for(let dia=1;dia<=ndias;dia++){
    const key=`${r.a}-${p2(r.m+1)}-${p2(dia)}`; const d=byDay[key];
    const ent=d?Number(d.entrada):0, sai=d?Number(d.saida):0, sal=d?Number(d.saldoAcumulado):null, def=d&&d.deficit;
    const cnt=(d?d.entradas.length+d.saidas.length:0);
    cells.push(`<div class="fcal-cell${def?' fcal-def':''}${(ent||sai)?' fcal-has':''}" ${cnt?`onclick="APP.fluxoDiaDet('${key}')" style="cursor:pointer"`:''}>
      <div class="fcal-d">${dia}</div>
      ${ent?`<div class="fcal-in">▲ ${money(ent)}</div>`:''}
      ${sai?`<div class="fcal-out">▼ ${money(sai)}</div>`:''}
      ${sal!=null?`<div class="fcal-sal" style="color:${sal<0?'#c14a34':'#5b6b53'}">${money(sal)}</div>`:''}
    </div>`);
  }
  const alertas = (cal.alertas||[]).map(a=>`<div class="fcal-alert ${a.nivel}">
    <b>${a.nivel==='critico'?'⛔':'⚠️'} ${esc(a.titulo)}</b>
    <div style="font-size:12px;margin-top:3px">${esc(a.detalhe)}</div>
    ${a.data?`<button class="btn-sm" style="margin-top:6px" onclick="APP.fluxoDiaDet('${a.data}')">Ver dia</button>`:''}
  </div>`).join('');
  host.innerHTML = `
    <style>
      .fcal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
      .fcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
      .fcal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
      .fcal-cell{min-height:74px;border:1px solid var(--line,#e6e3d8);border-radius:8px;padding:5px 6px;background:#fff;position:relative}
      .fcal-empty{background:transparent;border:none}
      .fcal-has{box-shadow:inset 0 0 0 1px #eee}
      .fcal-def{background:#fdecea;border-color:#e7a99e}
      .fcal-d{font-size:12px;font-weight:700;color:#3a4152}
      .fcal-in{font-size:11px;color:#1e7a44;font-weight:600;margin-top:2px}
      .fcal-out{font-size:11px;color:#c14a34;font-weight:600}
      .fcal-sal{font-size:11px;font-weight:700;position:absolute;bottom:4px;right:6px}
      .fcal-alert{border-radius:10px;padding:11px 13px;margin-bottom:8px}
      .fcal-alert.critico{background:#fdecea;border:1px solid #e7a99e;color:#8a2f1e}
      .fcal-alert.atencao{background:#fbf7e8;border:1px solid #efe2b8;color:#7a6a2e}
    </style>
    <div class="cards" style="margin-bottom:12px">
      ${kpi('Saldo inicial', money(cal.saldoInicial), 'caixa realizado')}
      ${kpi('Entradas do mês', money(cal.totais.entrada), '')}
      ${kpi('Saídas do mês', money(cal.totais.saida), '')}
      ${kpi('Saldo final projetado', money(cal.totais.saldoFinal), Number(cal.totais.saldoFinal)<0?'⛔ negativo':'')}
    </div>
    ${alertas?`<div class="sect"><h3>Alertas e sugestões de prorrogação</h3>${alertas}</div>`:'<div class="fcal-alert atencao">✓ Sem risco de caixa negativo no período. Entradas cobrem as saídas.</div>'}
    <div class="sect">
      <div class="fcal-head">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn-sm" onclick="APP.fluxoMesNav(-1)">‹</button>
          <b style="min-width:150px;text-align:center">${meses[r.m]} ${r.a}</b>
          <button class="btn-sm" onclick="APP.fluxoMesNav(1)">›</button>
        </div>
        <button class="btn-primary" style="background:#1e7a44" onclick="APP.fluxoExcel()">📊 Baixar Excel</button>
      </div>
      <div class="fcal-grid" style="margin-bottom:6px">
        ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="fcal-dow">${x}</div>`).join('')}
      </div>
      <div class="fcal-grid">${cells.join('')}</div>
      <div class="muted" style="font-size:11px;margin-top:8px">▲ entradas · ▼ saídas · nº embaixo = saldo acumulado projetado. Dias em vermelho ficam com caixa negativo. Clique num dia para ver os títulos.</div>
    </div>`;
}
function fluxoDiaDet(key){
  const cal=window.__FLUXOCAL; if(!cal) return;
  const d=cal.dias.find(x=>x.data===key); if(!d) return;
  const [a,m,dd]=key.split('-'); const titulo=`${dd}/${m}/${a}`;
  const lin=(arr,cor,sig)=>arr.length?arr.map(x=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0ede2">
      <span>${sig} ${esc(x.parte)}${x.atrasado?' <span class="pill" style="background:#fdecea;color:#c14a34">atrasado</span>':''}</span>
      <b style="color:${cor}">${money(x.valor)}</b></div>`).join(''):'<div class="muted" style="font-size:12px;padding:4px 0">—</div>';
  openModal(`<h3>${titulo}</h3>
    <div style="display:flex;gap:14px;margin-bottom:6px"><span class="muted">Saldo acumulado projetado:</span> <b style="color:${Number(d.saldoAcumulado)<0?'#c14a34':'#1e7a44'}">${money(d.saldoAcumulado)}</b></div>
    <div class="sect" style="margin-top:8px"><h3 style="color:#1e7a44;font-size:13px">▲ A receber neste dia — ${money(d.entrada)}</h3>${lin(d.entradas,'#1e7a44','▲')}</div>
    <div class="sect" style="margin-top:10px"><h3 style="color:#c14a34;font-size:13px">▼ A pagar neste dia — ${money(d.saida)}</h3>${lin(d.saidas,'#c14a34','▼')}</div>
    <div class="muted" style="font-size:11.5px;margin-top:10px">💡 Para prorrogar um pagamento, ajuste o vencimento em <b>A Pagar → Editar</b>.</div>
    <div class="mactions"><button class="btn-primary" onclick="APP.closeModal()">Fechar</button></div>`);
}
async function fluxoExcel(){
  const {de,ate}=fluxoRange();
  try{
    const r=await fetch(API+'/financeiro/fluxo/calendario/xlsx?de='+de+'&ate='+ate,{headers:{Authorization:'Bearer '+S.access}});
    if(!r.ok){ let m='Falha ao gerar Excel ('+r.status+').'; try{const j=await r.json();m=j.message||m;}catch(e){} throw new Error(m); }
    const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fluxo-caixa-'+de+'_'+ate+'.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),120); toast('Excel gerado — verifique os downloads.','ok');
  }catch(e){ toast(e.message,'err'); }
}

let PGPARC=[];
function pgParcGerar(total){
  const diasStr=(val('pg_dias')||'').trim();
  let offs=diasStr?diasStr.split(/[\/,;\s]+/).map(x=>parseInt(x)).filter(x=>!isNaN(x)):[];
  let n;
  if(offs.length){ n=offs.length; }
  else { n=Math.max(2,parseInt(val('pg_np')||'0')||0); if(!n||n<2){ toast('Informe os dias (30/60/91) ou o nº de parcelas.','err'); return; } offs=Array.from({length:n},(_,i)=>30*(i+1)); }
  const base=new Date(); base.setHours(12,0,0,0);
  const cent=Math.round(Number(total)*100), part=Math.floor(cent/n);
  PGPARC=[]; for(let i=0;i<n;i++){ const dt=new Date(base); dt.setDate(dt.getDate()+(offs[i]||0)); const c=(i===n-1)?(cent-part*(n-1)):part; PGPARC.push({vencimento:dt.toISOString().slice(0,10), valor:c/100}); }
  pgParcRender(total);
}
function pgParcRender(total){
  const box=$('pg_parclist'), btn=$('pg_parcbtn'); if(!box) return;
  if(!PGPARC.length){ box.innerHTML=''; if(btn)btn.style.display='none'; return; }
  const soma=PGPARC.reduce((s,p)=>s+Number(p.valor||0),0), dif=Math.abs(soma-Number(total))>0.005;
  box.innerHTML=PGPARC.map((p,i)=>`<div class="grid2" style="margin-bottom:4px">
      <input class="inp" type="date" id="pg_pv_${i}" value="${esc(p.vencimento)}" onchange="APP.pgParcSync()">
      <div style="display:flex;gap:6px"><input class="inp" type="number" step="0.01" id="pg_pval_${i}" value="${p.valor}" onchange="APP.pgParcSync()"><button type="button" class="btn-sm" onclick="APP.pgParcDel(${i},${total})">×</button></div>
    </div>`).join('')+`<div class="muted" style="font-size:11px">${PGPARC.length}x · soma <b style="color:${dif?'#c14a34':'inherit'}">${money(soma)}</b> · valor do título ${money(total)}${dif?' ⚠️ diferente':''}</div>`;
  if(btn)btn.style.display='';
}
function pgParcSync(){ PGPARC.forEach((p,i)=>{ const v=$('pg_pv_'+i),a=$('pg_pval_'+i); if(v)p.vencimento=v.value; if(a)p.valor=Number(a.value); }); }
function pgParcDel(i,total){ pgParcSync(); PGPARC.splice(i,1); pgParcRender(total); }
async function parcelarPagar(id){
  pgParcSync();
  const parc=PGPARC.filter(p=>p.vencimento&&Number(p.valor)>0);
  if(parc.length<2){ toast('Gere ao menos 2 parcelas.','err'); return; }
  try{ await api('/financeiro/pagar/'+id+'/parcelar',{method:'POST',body:{parcelas:parc.map(p=>({vencimento:p.vencimento,valor:Number(Number(p.valor).toFixed(2))}))}});
    closeModal(); toast('Título parcelado em '+parc.length+'x.','ok'); loadRoute();
  }catch(e){ toast(e.message,'err'); }
}
async function savePagarEdit(id){
  const body={ categoria:val('f_cat'), referencia:val('f_ref') };
  const filid=val('f_filial'); if(filid) body.filialId=Number(filid);

// Ao finalizar a fabricação: gera etiqueta unitária por peça (uma por tamanho da grade)
// e o operador escolhe se vai ESTOCAR ou ir DIRETO PRA EXPEDIÇÃO despachar pro cliente.
async function opConcluirEtiquetas(id){
  let d;
  try{ const r = await api('/ops/'+id+'/etiqueta'); d = r.dados || r; }
  catch(e){ toast(e.message,'err'); return; }
  const descProd = (d.produto||'').split('·').slice(1).join('·').trim() || (d.produto||'').trim() || 'PRODUTO';
  const refProd = (d.produto||'').split('·')[0].trim();
  // grade "P:10, M:20" -> [[P,10],[M,20]]; se não houver, usa a quantidade total.
  const pares = [];
  (d.grade||'').split(/[,;]+/).forEach(par=>{ const [t,q]=par.split(':').map(s=>(s||'').trim()); if(t&&q&&Number(q)>0) pares.push([t.toUpperCase(),Number(q)]); });
  const totalGrade = pares.reduce((s,p)=>s+p[1],0);
  const linhas = pares.length ? pares.map(([t,q])=>`${t}: <b>${q}</b>`).join(' &nbsp;·&nbsp; ') : `<b>${d.quantidade}</b> peças (sem grade)`;
  openModal(`<h3>Finalizar OP ${esc(d.op)} · Etiquetas</h3>
    <div class="r" style="margin-bottom:6px"><b>Produto:</b> ${esc(descProd)}${d.cor&&d.cor!=='-'?' · Cor '+esc(d.cor):''}</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Grade: ${linhas}${pares.length&&totalGrade!==d.quantidade?` <span style="color:#c0392b">(soma ${totalGrade} ≠ qtd ${d.quantidade})</span>`:''}</div>
    <div class="mrow"><label class="fl">Destino das peças *</label>
      <select id="oc_dest" class="inp">
        <option value="estoque">📦 Estocar (endereçar depois)</option>
        <option value="expedicao">🚚 Ir direto pra expedição (despachar pro cliente)</option>
      </select></div>

async function opConcluirGerar(id, pares, qtdTotal, pedidoId){
  const destino = val('oc_dest');
  const descricao = val('oc_desc').trim();
  const cor = val('oc_cor').trim();
  const ref = val('oc_ref').trim();
  if(!descricao){ toast('Informe a descrição.','err'); return; }
  const lotes = (pares && pares.length) ? pares.map(([t,q])=>({tamanho:t, quantidade:q})) : [{tamanho:'', quantidade:qtdTotal}];
  try{
    toast('Gerando etiquetas…','ok');
    const todas = [];
    for(const l of lotes){
      const body = { tipo:'produto', descricao, ref:ref||undefined, cor:cor||undefined, tamanho:l.tamanho||undefined,
        quantidade:l.quantidade, origem:'producao', destino };
      if(destino==='expedicao' && pedidoId) body.pedidoId = pedidoId;
      const r = await api('/estoque/entrada',{method:'POST',body});
      (r.pecas||[]).forEach(p=>todas.push(p));
    }
    closeModal();
    toast(todas.length+' etiquetas geradas ('+(destino==='expedicao'?'p/ expedição':'p/ estoque')+').','ok');
    imprimirEtqUnidades(todas, {loteEntrada:'OP-'+id});
    loadRoute();
  }catch(e){ toast(e.message,'err'); }
}
async function saveOp(id){
  try{
    await api('/ops/'+id+'/status',{method:'PATCH',body:{status:val('f_st'), setorAtual:val('f_setor')||undefined, responsavel:val('f_resp')||undefined}});
    await api('/ops/'+id+'/progresso',{method:'PATCH',body:{progresso:Number(val('f_prog')||0)}});
    const gradeTxt = val('f_gradeop');
    const grade = {};
    if(gradeTxt){
      for(const par of gradeTxt.split(/[,;]+/)){
        const [t,q] = par.split(':').map(s=>s.trim());
        if(t && q) grade[t.toUpperCase()] = Number(q);
      }
    }
    await api('/ops/'+id+'/grade',{method:'PATCH',body:{grade}});
    closeModal(); toast('OP atualizada.','ok'); loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

function neMatLabel(m){ return m.codigo+' · '+m.descricao+(m.cor?' · '+m.cor:''); }
function neFindMat(text){
  const mats=window.__MATS||[]; const t=(text||'').trim().toLowerCase(); if(!t) return null;
  let m=mats.find(x=>neMatLabel(x).toLowerCase()===t);       // escolha exata do datalist
  if(!m) m=mats.find(x=>x.codigo.toLowerCase()===t);          // código exato
  if(!m) m=mats.find(x=>t.startsWith(x.codigo.toLowerCase()+' · '));
  return m||null;
}
function neRender(){
  const box=$('neitens'); if(!box) return;
  const mats=window.__MATS||[];
  const dl = `<datalist id="ne_matlist">${mats.map(m=>`<option value="${esc(neMatLabel(m))}"></option>`).join('')}</datalist>`;
  box.innerHTML = dl + NEITENS.map((it,i)=>`
    <div class="grid2" style="margin-bottom:6px">
      <input class="inp" id="ne_mat_${i}" list="ne_matlist" autocomplete="off" placeholder="🔎 vincular material (digite código ou nome)" oninput="APP.neMat(${i})" onchange="APP.neMat(${i})">
      <input class="inp" id="ne_desc_${i}" placeholder="descrição *" value="${esc(it.descricao||'')}">
    </div>
    <div class="grid3" style="margin-bottom:12px">
      <input class="inp" id="ne_qtd_${i}" type="number" step="0.001" placeholder="qtd" value="${it.quantidade!=null?it.quantidade:''}">
      <input class="inp" id="ne_un_${i}" placeholder="un" value="${esc(it.unidade||'un')}">
      <div style="display:flex;gap:6px"><input class="inp" id="ne_vu_${i}" type="number" step="0.0001" placeholder="valor unit." value="${it.valorUnit!=null?it.valorUnit:''}">${NEITENS.length>1?`<button class="btn-sm" onclick="APP.neDel(${i})">×</button>`:''}</div>
    </div>`).join('');
  // Prefill do vínculo quando o item já tem material (ex.: edição).
  NEITENS.forEach((it,i)=>{ if(it.materialId){ const m=mats.find(x=>x.id===it.materialId); const s=$('ne_mat_'+i); if(m&&s) s.value=neMatLabel(m); } });
}
function neSync(){ NEITENS.forEach((it,i)=>{ const d=$('ne_desc_'+i); if(!d) return; it.descricao=d.value; it.quantidade=val('ne_qtd_'+i); it.unidade=val('ne_un_'+i)||'un'; it.valorUnit=val('ne_vu_'+i); const m=neFindMat(val('ne_mat_'+i)); it.materialId=m?m.id:undefined; }); }
function neAdd(){ neSync(); NEITENS.push({unidade:'un'}); neRender(); }
function neDel(i){ neSync(); NEITENS.splice(i,1); neRender(); }
function neMat(i){ const m=neFindMat(val('ne_mat_'+i)); if(m){ const d=$('ne_desc_'+i); if(d&&!d.value)d.value=m.descricao; const u=$('ne_un_'+i); if(u)u.value=m.unidade||'un'; const vu=$('ne_vu_'+i); if(vu&&!vu.value&&Number(m.custo)>0)vu.value=Number(m.custo); } }
function neCpToggle(){ $('ne_cpbox').style.display=$('ne_cp').checked?'':'none'; }
function neTotalEntrada(){ neSync(); return NEITENS.reduce((s,it)=>s+(Number(it.quantidade)||0)*(Number(it.valorUnit)||0),0); }
function neParcGerar(){
  const n=Math.max(1,parseInt(val('ne_np')||'1')||1);
  const dias=Math.max(0,parseInt(val('ne_pint')||'0')||0);
  const d0=val('ne_p1'); if(!d0){ toast('Informe a data do 1º vencimento.','err'); return; }
  const total=neTotalEntrada(); if(!(total>0)){ toast('Adicione itens com valor antes de gerar as parcelas.','err'); return; }
  const cent=Math.round(total*100), base=Math.floor(cent/n);
  NEPARC=[];
  for(let i=0;i<n;i++){ const dt=new Date(d0+'T12:00:00'); dt.setDate(dt.getDate()+dias*i); const c=(i===n-1)?(cent-base*(n-1)):base; NEPARC.push({vencimento:dt.toISOString().slice(0,10), valor:c/100}); }
  neParcRender();
}
function neParcRender(){
  const box=$('ne_parclist'); if(!box) return;
  if(!NEPARC.length){ box.innerHTML=''; return; }
  const soma=NEPARC.reduce((s,p)=>s+Number(p.valor||0),0), tot=neTotalEntrada(), dif=Math.abs(soma-tot)>0.005;
  box.innerHTML = NEPARC.map((p,i)=>`<div class="grid2" style="margin-bottom:4px">
      <input class="inp" type="date" id="ne_pv_${i}" value="${esc(p.vencimento||'')}" onchange="APP.neParcSync()">
      <div style="display:flex;gap:6px"><input class="inp" type="number" step="0.01" id="ne_pval_${i}" value="${p.valor!=null?p.valor:''}" onchange="APP.neParcSync()"><button type="button" class="btn-sm" onclick="APP.neParcDel(${i})">×</button></div>
    </div>`).join('')
    + `<div class="muted" style="font-size:11px">${NEPARC.length} parcela(s) · soma <b style="color:${dif?'#c14a34':'inherit'}">${money(soma)}</b> · total da NF ${money(tot)}${dif?' ⚠️ diferente':''}</div>`;
}
function neParcSync(){ NEPARC.forEach((p,i)=>{ const v=$('ne_pv_'+i), a=$('ne_pval_'+i); if(v)p.vencimento=v.value; if(a)p.valor=Number(a.value); }); }
function neParcDel(i){ neParcSync(); NEPARC.splice(i,1); neParcRender(); }
async function saveNotaEntrada(){
  neSync();

async function gerarUnidadesMP(destino){
  mpSyncLotes();
  const itens = window.__MPITENS||[], L=window.__MPLOTES||[]; const todas=[];
  let totalVol=0; L.forEach(rows=>rows.forEach(r=> totalVol+=Math.max(0,Math.round(Number(r.vol)||0))));
  if(totalVol===0){ toast('Informe ao menos 1 volume para etiquetar.','err'); return; }
  toast('Gerando etiquetas…','ok');
  try{
    for(let i=0;i<itens.length;i++){
      const it=itens[i];
      for(const r of (L[i]||[])){
        const q=Math.min(500, Math.max(0, Math.round(Number(r.vol)||0))); if(!q) continue;
        const body={tipo:'materia', descricao:it.descricao, quantidade:q, origem:'entrada', destino};
        const lote=(r.lote||'').trim(); if(lote) body.loteFornecedor=lote;
        const res=await api('/estoque/entrada',{method:'POST',body});
        (res.pecas||[]).forEach(p=>todas.push(p));
      }
    }
    closeModal(); window.__MPITENS=null; window.__MPLOTES=null;
    if(!todas.length){ toast('Nenhuma etiqueta gerada.','err'); loadRoute(); return; }
    if(window.__MPNF){ api('/notas-entrada/'+window.__MPNF+'/etiquetas-geradas',{method:'POST'}).catch(()=>{}); window.__MPNF=null; }
    if(destino==='estoque'){
      imprimirEtqUnidades(todas,{loteEntrada:'ENTRADA-MP'});
      toast(todas.length+' etiqueta(s) de volume gerada(s) — bipe para endereçar.','ok');
      setTimeout(()=>APP.formEnderecar(),500);
    } else {
      imprimirEtqUnidades(todas,{loteEntrada:'MP-EXPEDICAO'});
      toast(todas.length+' volume(s) reservado(s) para expedição.','ok');
    }
    loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

// Puxa a NF da SEFAZ pela chave (Focus nfes_recebidas) e pré-preenche a entrada.
async function puxarSefazChave(){
  const chave=(val('ne_chave')||'').replace(/\D/g,'');
  if(chave.length!==44){ toast('Bipe ou digite a chave de 44 dígitos.','err'); return; }
  toast('Puxando a NF da SEFAZ…','ok');
  let d; try{ d=await api('/notas-entrada/sefaz/'+chave); }catch(e){
    await uiAlert({tipo:'warn', titulo:'Nota ainda não baixada da SEFAZ', ok:'Preencher manual', msg:'A distribuição da SEFAZ ainda não tem esta nota — isso é normal e não é erro do sistema:\n\n• A Focus baixa as notas em CICLOS (pode levar algumas horas depois de habilitar o "Recebimento de NFes").\n• Só captura notas emitidas A PARTIR da data de início configurada na Focus.\n\nPode preencher os itens abaixo manualmente e salvar — o fornecedor é cadastrado sozinho pelo CNPJ.'});
    return;
  }
  const g=(o,ks)=>{ for(const k of ks){ if(o&&o[k]!=null&&o[k]!=='') return o[k]; } return undefined; };
  const itensRaw = d.itens || d.produtos || d.det || [];
  const itens = (Array.isArray(itensRaw)?itensRaw:[]).map(it=>{
    const p = it.produto || it.prod || it;
    return { descricao: g(p,['descricao','descricao_produto','xProd'])||'Item',
      quantidade: Number(g(p,['quantidade_comercial','quantidade','qCom'])||1),
      unidade: g(p,['unidade_comercial','unidade','uCom'])||'un',
      valorUnit: Number(g(p,['valor_unitario_comercial','valor_unitario','vUnCom'])||0) };
  });
  const cnpjE=String(g(d,['cnpj_emitente','documento_emitente','cnpj','cpf_cnpj_emitente'])||'').replace(/\D/g,'');
  const nomeE=g(d,['nome_emitente','razao_social_emitente','xNome','nome'])||'';
  // Vencimento: primeira duplicata/fatura da cobrança da NF.
  let venc='';
  const dups = d.duplicatas || d.faturas || (d.cobranca&&d.cobranca.duplicatas) || (d.fatura&&d.fatura.duplicatas) || [];
  if(Array.isArray(dups)&&dups.length) venc=String(g(dups[0],['data_vencimento','vencimento','dVenc'])||'').slice(0,10);
  if(!venc) venc=String(g(d,['data_vencimento','vencimento'])||'').slice(0,10);
  // Volumes declarados na NF (transporte/vol qVol) — usados como padrão de etiquetas por volume.
  let volTot=Number(g(d,['quantidade_volumes','volumes_quantidade','qVol','quantidade_volume'])||0);
  if(!volTot){ const vs=d.volumes||d.vol||(d.transporte&&d.transporte.volumes)||(d.transp&&d.transp.vol)||[]; if(Array.isArray(vs)) volTot=vs.reduce((s,v)=>s+Number(g(v,['quantidade','qVol','volumes_quantidade'])||0),0); }
  window.__NEVOL = volTot||0;
  window.__NEPRE={ cnpjEmitente:cnpjE, nomeEmitente:nomeE };
  closeModal();
  await formNotaEntrada({
    numero:String(g(d,['numero','nnf','numero_nf'])||''), serie:String(g(d,['serie'])||''), chave,
    data:String(g(d,['data_emissao','dhEmi','data'])||'').slice(0,10),
    vencimento:venc,
    nomeEmitente:nomeE, cnpjEmitente:cnpjE,
    itens: itens.length?itens:[{descricao:'Mercadoria conforme NF', quantidade:1, unidade:'un', valorUnit:Number(g(d,['valor_total','valor_liquido','valor'])||0)}]
  });
  if(itens.length) toast('NF puxada da SEFAZ ('+itens.length+' item(ns)) — confira e salve.','ok');
  else await uiAlert({tipo:'info', titulo:'Itens ainda sendo baixados', ok:'Entendi', msg:'Número, fornecedor e vencimento foram puxados ✔\n\nOs ITENS da nota ainda estão sendo baixados pela SEFAZ (isso acontece logo após a ciência da operação). \n\n• Clique em "🔎 Puxar SEFAZ" de novo em alguns minutos para trazer os produtos automaticamente,\n• ou adicione os itens manualmente agora e salve.'});
}

async function enderecarBip(){
  const codigo=val('ed_bip'); if(!codigo){ return; }
  const body={ codigo, coluna:val('ed_col'), andar:val('ed_and'), caixaMaster:val('ed_cx') };
  try{
    let r=await api('/estoque/enderecar',{method:'POST',body});
    // Já está exatamente neste endereço → avisa e NÃO duplica.
    if(r && r.jaAqui){
      beepErro();
      const log=$('ed_log'); if(log) log.innerHTML=`<div style="padding:4px 0;border-bottom:1px solid #eee;color:#8a6d3b">⚠️ ${esc(r.codigo)} já está endereçado aqui (${esc(r.endereco)}) — entrada ignorada.</div>`+log.innerHTML;
      toast('Esta peça já está neste endereço.','err'); $('ed_bip').value=''; $('ed_bip').focus(); return;
    }
    // Já endereçado em outro lugar → confirma antes de mover (evita troca sem querer).
    if(r && r.precisaConfirmar){
      const ok = await uiConfirm({tipo:'warn', titulo:'Item já está endereçado',
        ok:'Mover para o novo local', cancel:'Manter onde está',
        msg:`${r.codigo} · ${r.descricao}${r.tamanho?(' · TAM '+r.tamanho):''}\n\nJÁ está guardado em:\n📍 ${r.atual}\n\nDeseja realmente MOVER para:\n➡️ ${r.novo} ?`});
      if(!ok){ const log=$('ed_log'); if(log) log.innerHTML=`<div style="padding:4px 0;border-bottom:1px solid #eee;color:#8a6d3b">↩️ ${esc(r.codigo)} mantido em ${esc(r.atual)}</div>`+log.innerHTML; $('ed_bip').value=''; $('ed_bip').focus(); return; }
      r=await api('/estoque/enderecar',{method:'POST',body:Object.assign({},body,{confirmar:true})});
    }
    beepOk();
    const log=$('ed_log'); if(log) log.innerHTML=`<div style="padding:4px 0;border-bottom:1px solid #eee">${r.movido?'🔀':'✅'} ${esc(r.codigo)} · ${esc(r.descricao)} ${r.tamanho?('· '+esc(r.tamanho)):''} → ${esc(r.endereco)}${r.movido?' <span style="color:#8a6d3b">(movido)</span>':''}</div>`+log.innerHTML;
    $('ed_bip').value=''; $('ed_bip').focus();
  }catch(e){ beepErro(); toast('Falha: '+(e.message||e),'err'); $('ed_bip').select(); }
}

function formConsultaEtiqueta(){
  openModal(`<h3>🔎 Consultar etiqueta</h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 8px">Bipe ou digite a etiqueta para ver <b>onde está endereçada</b> e o status. Isto <b>não</b> movimenta nada.</div>
    <div style="display:flex;gap:8px;align-items:end">
      <div style="flex:1"><label class="fl">Etiqueta da peça</label><input id="cons_bip" class="inp" placeholder="UN-... (leitor ou digite)" onkeydown="if(event.key==='Enter')APP.consultarEtiqueta()"></div>
      <button class="btn-primary" onclick="APP.consultarEtiqueta()">Consultar</button>
      <button class="btn-sm" onclick="APP.abrirScanner(function(code){document.getElementById('cons_bip').value=code;APP.consultarEtiqueta();})">📷</button></div>
    <div id="cons_out" style="margin-top:12px"></div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Fechar</button></div>`);
  setTimeout(()=>{const i=$('cons_bip'); if(i)i.focus();},50);
}
async function consultarEtiqueta(){
  const codigo=(val('cons_bip')||'').trim(); if(!codigo){ return; }
  const out=$('cons_out');
  try{
    const u=await api('/estoque/unidade/'+encodeURIComponent(codigo));
    beepOk();
    const pill = u.status==='em_estoque'?'green':(u.status==='aguardando_endereco'?'red':(u.status==='reservado'?'blue':'gray'));
    out.innerHTML=`<div style="border:1px solid #e7e3d8;border-radius:10px;padding:12px 14px;background:#fff">
      <div style="font-weight:800;font-size:14px">${esc(u.descricao)}${u.cor?' · '+esc(u.cor):''}${u.tamanho?' · TAM '+esc(u.tamanho):''}</div>
      <div class="mono gold" style="font-size:12px;margin:2px 0 8px">${esc(u.codigo)}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span class="muted">Status</span><span class="pill ${pill}">${esc(u.statusLabel)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span class="muted">Endereço</span><b>${u.enderecado?esc(u.endereco):'<span style="color:#c14a34">sem endereço</span>'}</b></div>
      ${u.loteFornecedor?`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span class="muted">Lote fornecedor</span><b>${esc(u.loteFornecedor)}</b></div>`:''}
    </div>`;
  }catch(e){ beepErro(); out.innerHTML=`<div style="color:#c14a34;font-size:13px;padding:6px 0">❌ ${esc(e.message||'Etiqueta não encontrada.')}</div>`; }
  $('cons_bip').value=''; $('cons_bip').focus();
}

async function saveMov(){
  const body = { produtoId:Number(val('f_prod')), tamanho:val('f_tam'), tipo:val('f_tipo'), quantidade:Number(val('f_qtd')) };

async function viewExpedicao(c){
  const [list, clientes] = await Promise.all([api('/expedicoes'), api('/clientes')]);
  const nome={}; clientes.forEach(cl=>nome[cl.id]=cl.nome);
  c.innerHTML = toolbar('Expedições', 'Nova expedição', 'APP.formExpedicao()', relBtn('expedicoes')) + panelTable(
    ['Número','Cliente','Peças','NF-e','Conferência','Saída','Ações'],
    list.map(e=>[
      `<span class="mono gold">${esc(e.numero)}</span>`, esc(nome[e.clienteId]||('#'+e.clienteId)),
      `${e.pecasConferidas||0}/${e.pecas}`,
      e.nf?`<span class="mono gold">${esc(e.nf)}</span>`:`<button class="btn-sm" onclick="APP.emitirNfe(${e.id})">Emitir NF-e</button>`,
      confPill(e.conferenciaStatus),
      e.dataSaida?dfmtL(e.dataSaida):'<span class="muted">—</span>',
      `<button class="btn-sm" onclick="APP.formConferencia(${e.id})">✅ Conferir/Despachar</button> <button class="btn-sm" onclick="APP.etiquetaExpedicaoPrompt(${e.id})">🏷 Etiqueta</button> <button class="btn-sm" onclick="APP.gerarDoc('romaneio',${e.id})">Romaneio 🖨</button>`
    ]), list.length?null:'Nenhuma expedição.');
}
function confPill(s){ const m={pendente:['gray','pendente'],conferindo:['blue','conferindo'],conferida:['gold','conferida'],despachado:['green','despachado']}; const x=m[s]||['gray',s||'pendente']; return `<span class="pill ${x[0]}">${esc(x[1])}</span>`; }
async function formExpedicao(){
  const [clientes, pedidos] = await Promise.all([api('/clientes'), api('/pedidos')]);
  const co = clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');

  openModal(`<h3>Nova expedição</h3>
    <div class="grid2">
      <div><label class="fl">Cliente *</label><select id="f_cli" class="inp">${co||'<option>—</option>'}</select></div>
      <div><label class="fl">Pedido</label><select id="f_ped" class="inp">${po}</select></div>
    </div>
    <div class="grid3">${field('f_pecas','Peças *','type="number" min="1"')}${field('f_lote','Lote ID (consome estoque)','type="number"')}${field('f_vol','Volumes','type="number" value="1"')}</div>
    <div class="grid2">${field('f_transp','Transportadora','')}${field('f_cid','Cidade/UF','')}</div>
    ${field('f_nf','Nota fiscal','')}
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveExpedicao()">Criar</button></div>`);
}
async function saveExpedicao(){
  const body = { clienteId:Number(val('f_cli')), pecas:Number(val('f_pecas')) };
  const ped=val('f_ped'); if(ped) body.pedidoId=Number(ped);
  const lote=val('f_lote'); if(lote) body.loteId=Number(lote);
  const vol=val('f_vol'); if(vol) body.volumes=Number(vol);
  ['transp:transportadora','cid:cidadeUf','nf:nf'].forEach(m=>{ const [f,k]=m.split(':'); const v=val('f_'+f); if(v) body[k]=v; });
  if(!body.clienteId||!body.pecas){ toast('Informe cliente e peças.','err'); return; }
  try{ const e=await api('/expedicoes',{method:'POST',body}); closeModal(); toast('Expedição '+e.numero+' criada · rastreio '+e.rastreio,'ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

async function saveUsuario(id){
  const body = { nome:val('f_nome'), acesso:val('f_acesso'), cargo:val('f_cargo')||undefined, setor:val('f_setor')||undefined,
    horarioInicio:val('f_hi')||undefined, horarioFim:val('f_hf')||undefined };
  if(!id) body.usuario=val('f_user');
  const s=val('f_senha'); if(s) body.senha=s;
  if(!body.nome||(!id&&!body.usuario)||(!id&&!s)){ toast('Nome, login e senha são obrigatórios.','err'); return; }
  try{ await api(id?('/usuarios/'+id):'/usuarios',{method:id?'PATCH':'POST',body}); closeModal(); toast('Usuário salvo.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function removeUsuario(id){
  try{ await api('/usuarios/'+id,{method:'DELETE'}); toast('Usuário desativado.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

  try{ await api('/usuarios/'+id+'/desbloquear',{method:'PATCH'}); toast('Conta desbloqueada.','ok'); loadRoute(); }

async function saveMedida(id){
  const body = { colaborador:val('f_colab'), tamanho:val('f_tam') };
  if(!id) body.clienteId = Number(val('f_cli'));
  const opt = { cargo:'f_cargo', obs:'f_obs' };
  Object.entries(opt).forEach(([k,f])=>{ const v=val(f); if(v) body[k]=v; });
  const nums = { torax:'f_torax', cintura:'f_cint', quadril:'f_quad', altura:'f_alt' };
  Object.entries(nums).forEach(([k,f])=>{ const v=val(f); if(v) body[k]=Number(v); });
  if(!body.colaborador||!body.tamanho||(!id&&!body.clienteId)){ toast('Preencha cliente, colaborador e tamanho.','err'); return; }
  try{ await api(id?('/medidas/'+id):'/medidas',{method:id?'PATCH':'POST',body}); closeModal(); toast('Ficha salva.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function removeMedida(id){
  try{ await api('/medidas/'+id,{method:'DELETE'}); toast('Ficha excluída.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

async function viewPrecificacao(c){
  const prods = await api('/produtos');
  const po = ['<option value="">— selecione o produto —</option>'].concat(prods.map(p=>`<option value="${p.id}">${esc(p.codigo)} · ${esc(p.descricao)}</option>`)).join('');
  c.innerHTML = `
    <div class="panel" style="padding:18px">
      <label class="fl">Produto</label>
      <select id="pr_prod" class="inp" style="max-width:520px" onchange="APP.loadCusto()">${po}</select>
    </div>
    <div id="pr_out" style="margin-top:18px"><div class="empty">Selecione um produto para montar a ficha de custo.</div></div>`;

async function loadCusto(){
  const id = val('pr_prod'); const out = $('pr_out');
  if(!id){ out.innerHTML = '<div class="empty">Selecione um produto.</div>'; return; }
  out.innerHTML = '<div class="spin"></div>';
  try{
    const d = await api('/produtos/'+id+'/custo');
    window.__CUSTO = Number(d.custoMaterial);
    out.innerHTML = `
      <div class="sect" style="margin-top:0"><h3>Consumo (BOM) · ${esc(d.produto.codigo)}</h3>` +
      (d.itens.length ? panelTable(['Material','Descrição','Qtd','Custo unit.','Subtotal'],
        d.itens.map(i=>[`<span class="mono gold">${esc(i.material)}</span>`, esc(i.descricao), esc(i.quantidade)+' '+esc(i.unidade), money(i.custoUnit), `<b>${money(i.subtotal)}</b>`]))
        : '<div class="panel"><div class="empty">Este produto ainda não tem receita (BOM) cadastrada.</div></div>') + `</div>
      <div class="sect"><h3>Composição do preço</h3>
        <div class="panel" style="padding:18px">
          <div class="grid3">
            <div><label class="fl">Custo de material (BOM)</label><input class="inp" value="${money(d.custoMaterial)}" disabled></div>
            ${field('pr_mo','Mão de obra + facção (R$)','type="number" step="0.01" value="0" oninput="APP.calcPreco()"')}
            ${field('pr_outros','Outros custos (R$)','type="number" step="0.01" value="0" oninput="APP.calcPreco()"')}
          </div>
          <div class="grid2" style="margin-top:4px">
            ${field('pr_imp','Impostos sobre venda (%)','type="number" step="0.01" value="5.93" oninput="APP.calcPreco()"')}
            ${field('pr_marg','Margem desejada (%)','type="number" step="0.5" value="40" oninput="APP.calcPreco()"')}
          </div>
          <div id="pr_res" style="margin-top:10px"></div>
        </div>
      </div>`;
    calcPreco();
  }catch(e){ out.innerHTML = `<div class="empty" style="color:#c14a34">${esc(e.message)}</div>`; }
}
function calcPreco(){
  const custo = (window.__CUSTO||0) + Number(val('pr_mo')||0) + Number(val('pr_outros')||0);
  const imp = Number(val('pr_imp')||0), marg = Number(val('pr_marg')||0);
  const divisor = 1 - (imp+marg)/100;
  const el = $('pr_res'); if(!el) return;
  if(divisor <= 0){ el.innerHTML = '<div class="err">Impostos + margem não podem somar 100% ou mais.</div>'; return; }
  const preco = custo/divisor, lucro = preco*marg/100;
  el.innerHTML = `<div class="cards">
    ${kpi('Custo total da peça', money(custo), 'material + mão de obra + outros')}
    ${kpi('Preço de venda sugerido', money(preco), 'markup divisor: 1 − (imp% + margem%)')}
    ${kpi('Lucro estimado / peça', money(lucro), marg+'% sobre o preço')}
  </div>`;
}
