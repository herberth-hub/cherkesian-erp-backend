    <div class="muted" style="font-size:12px;margin:-4px 0 8px">Planejado: <b>${o.quantidade}</b> peça(s). Informe quanto foi <b>realmente cortado</b>. Se o tecido acabou, corte parcial (menos que o planejado) é permitido.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">${cels}
      <div style="margin-left:auto;text-align:right"><label class="fl" style="font-size:10px">Total cortado</label><div id="ct_tot" style="font-size:18px;font-weight:800">0</div></div>
    </div>
    <div id="ct_aviso" style="margin-top:8px"></div>
    ${taField('ct_obs','Observação do corte (ex.: acabou o tecido, faltou G1/G2)','',2, o.corteObs||'')}
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveCorte(${o.id})">Confirmar corte</button></div>`);
  if(o.corteObs){ const el=$('ct_obs'); if(el) el.value=o.corteObs; }
  corteTotal();
}
function corteTotal(){
  const o=window.__CORTE||{}; const tams = document.querySelectorAll('[id^="ct_"][data-plan]');
  let tot=0, plan=0;
  tams.forEach(el=>{ tot+=Number(el.value)||0; plan+=Number(el.getAttribute('data-plan'))||0; });
  const t=$('ct_tot'); if(t) t.textContent=tot;
  const av=$('ct_aviso'); if(av){
    if(tot>0 && tot<(plan|| o.quantidade)) av.innerHTML=`<div class="card" style="background:#fff5e6;border-color:#f0c987;color:#8a5a00;font-size:12px">⚠️ Corte parcial: ${tot} de ${plan||o.quantidade} peças. Os ${(plan||o.quantidade)-tot} faltantes ficam pendentes (registre o motivo abaixo).</div>`;
    else if(tot>(plan||o.quantidade)) av.innerHTML=`<div class="card" style="background:#fde8e4;border-color:#e0a99b;color:#a33;font-size:12px">Cortado (${tot}) maior que o planejado (${plan||o.quantidade}). Ajuste.</div>`;
    else av.innerHTML='';
  }
}
async function saveCorte(id){
  const grade={}; document.querySelectorAll('[id^="ct_"][data-plan]').forEach(el=>{
    const t=el.id.slice(3); const n=Number(el.value)||0; if(n>0) grade[t]=n;
  });
  const total=Object.values(grade).reduce((a,b)=>a+b,0);
  if(total<=0){ toast('Informe a quantidade cortada.','err'); return; }
  try{ const r=await api('/ops/'+id+'/corte',{method:'PATCH',body:{grade, obs:val('ct_obs')||undefined}});
    closeModal(); toast(r.corteParcial?('Corte PARCIAL registrado ('+r.quantidadeCortada+'/'+r.quantidade+').'):'Corte confirmado ('+r.quantidadeCortada+' peças).', r.corteParcial?'err':'ok'); loadRoute();
  }catch(e){ toast(e.message,'err'); }
}

async function saveCompra(){
  const body = { fornecedorId:Number(val('f_forn')), descricao:val('f_desc'), quantidade:Number(val('f_qtd')), unidade:val('f_un')||'un', valor:Number(val('f_val')) };
  const mid=val('f_mat'); if(mid) body.materialId=Number(mid);
  if(!body.fornecedorId||!body.descricao||!body.quantidade||!body.valor){ toast('Preencha fornecedor, descrição, quantidade e valor.','err'); return; }
  // Aviso: se o valor ultrapassar o crédito disponível que o fornecedor concede.
  try{
    const r=await api('/fornecedores/'+body.fornecedorId+'/resumo').catch(()=>null);
    const c=r&&r.credito;
    if(c && c.limite!=null && body.valor>Number(c.disponivel||0)){
      const ok=await uiConfirm({tipo:'warn', titulo:'Ultrapassa o crédito do fornecedor', ok:'Gerar mesmo assim', cancel:'Cancelar',
        msg:'Limite concedido: '+money(c.limite)+'\nEm aberto (a pagar): '+money(c.emAberto)+'\nDisponível: '+money(c.disponivel)+'\n\nEsta OC ('+money(body.valor)+') ultrapassa o crédito disponível. Gerar mesmo assim?'});
      if(!ok) return;
    }
  }catch(_){}
  try{ const o=await api('/ordens-compra',{method:'POST',body}); closeModal(); toast('OC '+o.numero+' criada.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function receberCompra(id, force){
  try{ await api('/ordens-compra/'+id+'/receber'+(force?'?force=true':''),{method:'POST'}); toast('OC recebida — material reposto no estoque.','ok'); loadRoute(); }
  catch(e){
    // Trava anti-duplicidade: material já entrou por NF recente. Confirma antes de somar de novo.
    if(e.data && e.data.code==='NF_DUP'){
      const ok=await uiConfirm({tipo:'warn', titulo:'Material já entrou por NF', ok:'Receber assim mesmo', cancel:'Cancelar',
        msg:'Este material já teve entrada pela NF '+e.data.numero+' ('+e.data.data+') — o estoque já foi lançado.\n\nReceber aqui vai DUPLICAR o estoque. O correto é dar entrada pela NF, que baixa a OC sozinha.\n\nReceber mesmo assim?'});
      if(ok) return receberCompra(id, true);
      return;
    }
    toast(e.message,'err');
  }
}
async function cancelarCompra(id){
  try{ await api('/ordens-compra/'+id+'/cancelar',{method:'POST'}); toast('OC cancelada.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

  }

      window.__NEEDIT=null; closeModal(); toast(msg,'ok'); loadRoute();
    }catch(e){ toast(e.message,'err'); }
    return;
  }
  try{
    const n=await api('/notas-entrada',{method:'POST',body}); window.__NEPRE=null;
    let msg='Entrada registrada (NF '+n.numero+').';
    if(n.contaPagarGerada) msg+=' Conta a pagar gerada.';
    if(n.ocsBaixadas&&n.ocsBaixadas.length) msg+=' Baixa automática: OC '+n.ocsBaixadas.join(', ')+' (necessidade × compra).';
    toast(msg,'ok');
    // Só os itens de MATERIAL geram etiqueta/destino físico; produto de revenda já entrou no estoque do produto.
    const matItens = itens.filter(x=>!x.produtoId);

// Entrada direto da tela: bipa a DANFE (câmera), abre a entrada e já puxa da SEFAZ.
function lerNfEntrada(){
  abrirScanner(async function(code){
    const m=String(code||'').match(/\d{44}/);
    const ch=m?m[0]:String(code||'').replace(/\D/g,'').slice(0,44);
    if(ch.length!==44){ toast('Não achei uma chave de 44 dígitos no código. Tente de novo ou digite.','err'); await formNotaEntrada({}); return; }
    toast('Chave lida ✔ …'+ch.slice(-6)+' — puxando da SEFAZ…','ok');
    await formNotaEntrada({chave:ch});
    puxarSefazChave();
  });
}
// Bipar a chave da DANFE (câmera): extrai os 44 dígitos do QR/código de barras.
function biparChaveEntrada(){
  abrirScanner(function(code){
    const m=String(code||'').match(/\d{44}/);
    const ch=m?m[0]:String(code||'').replace(/\D/g,'').slice(0,44);
    const el=document.getElementById('ne_chave'); if(el) el.value=ch;
    if(ch.length===44){ toast('Chave lida ✔ …'+ch.slice(-6),'ok'); APP.puxarSefazChave(); }
    else toast('Não achei uma chave de 44 dígitos no código.','err');
  });
}
// Puxa a NF da SEFAZ pela chave (Focus nfes_recebidas) e pré-preenche a entrada.
async function puxarSefazChave(){
  const chave=(val('ne_chave')||'').replace(/\D/g,'');
  if(chave.length!==44){ toast('Bipe ou digite a chave de 44 dígitos.','err'); return; }
  toast('Puxando a NF da SEFAZ…','ok');
  let d; try{ d=await api('/notas-entrada/sefaz/'+chave); }catch(e){
    await uiAlert({tipo:'warn', titulo:'Nota ainda não baixada da SEFAZ', ok:'Preencher manual', msg:'A distribuição da SEFAZ ainda não tem esta nota — isso é normal e não é erro do sistema:\n\n• A Focus baixa as notas em CICLOS (pode levar algumas horas depois de habilitar o "Recebimento de NFes").\n• Só captura notas emitidas A PARTIR da data de início configurada na Focus.\n\nPode preencher os itens abaixo manualmente e salvar — o fornecedor é cadastrado sozinho pelo CNPJ.'});
    return;
  }
  const g=(o,ks)=>{ for(const k of ks){ if(o&&o[k]!=null&&o[k]!=='') return o[k]; } return undefined; };
  const itensRaw = d.itens || d.produtos || d.det || [];
  const itens = (Array.isArray(itensRaw)?itensRaw:[]).map(it=>{
    const p = it.produto || it.prod || it;
    return { descricao: g(p,['descricao','descricao_produto','xProd'])||'Item',
      codigo: g(p,['codigo','cProd','codigo_produto'])||'',
      quantidade: Number(g(p,['quantidade_comercial','quantidade','qCom'])||1),
      unidade: g(p,['unidade_comercial','unidade','uCom'])||'un',
      valorUnit: Number(g(p,['valorUnit','valor_unitario_comercial','valor_unitario','vUnCom','valor_unit'])||0) };
  });
  const cnpjE=String(g(d,['cnpj_emitente','documento_emitente','cnpj','cpf_cnpj_emitente'])||'').replace(/\D/g,'');
  const nomeE=g(d,['nome_emitente','razao_social_emitente','xNome','nome'])||'';
  // Vencimento: primeira duplicata/fatura da cobrança da NF.
  let venc='';
  const dups = d.duplicatas || d.faturas || (d.cobranca&&d.cobranca.duplicatas) || (d.fatura&&d.fatura.duplicatas) || [];
  if(Array.isArray(dups)&&dups.length) venc=String(g(dups[0],['data_vencimento','vencimento','dVenc'])||'').slice(0,10);
  if(!venc) venc=String(g(d,['data_vencimento','vencimento'])||'').slice(0,10);
  // Volumes declarados na NF (transporte/vol qVol) — usados como padrão de etiquetas por volume.
  let volTot=Number(g(d,['quantidade_volumes','volumes_quantidade','qVol','quantidade_volume'])||0);
  if(!volTot){ const vs=d.volumes||d.vol||(d.transporte&&d.transporte.volumes)||(d.transp&&d.transp.vol)||[]; if(Array.isArray(vs)) volTot=vs.reduce((s,v)=>s+Number(g(v,['quantidade','qVol','volumes_quantidade'])||0),0); }
  window.__NEVOL = volTot||0;
  window.__NEPRE={ cnpjEmitente:cnpjE, nomeEmitente:nomeE };
  const cnpjDest=String(g(d,['cnpj_destinatario','cnpj_dest','documento_destinatario'])||'').replace(/\D/g,'');
  closeModal();
  await formNotaEntrada({
    numero:String(g(d,['numero','nnf','numero_nf'])||''), serie:String(g(d,['serie'])||''), chave,
    data:String(g(d,['data_emissao','dhEmi','data'])||'').slice(0,10),
    vencimento:venc, cnpjDest,
    nomeEmitente:nomeE, cnpjEmitente:cnpjE,
    itens: itens.length?itens:[{descricao:'Mercadoria conforme NF', quantidade:1, unidade:'un', valorUnit:Number(g(d,['valor_total','valor_liquido','valor'])||0)}]
  });
  if(itens.length) toast('NF puxada da SEFAZ ('+itens.length+' item(ns)) — confira e salve.','ok');
  else await uiAlert({tipo:'info', titulo:'Itens ainda sendo baixados', ok:'Entendi', msg:'Número, fornecedor e vencimento foram puxados ✔\n\nOs ITENS da nota ainda estão sendo baixados pela SEFAZ (isso acontece logo após a ciência da operação). \n\n• Clique em "🔎 Puxar SEFAZ" de novo em alguns minutos para trazer os produtos automaticamente,\n• ou adicione os itens manualmente agora e salve.'});
}

// Resumo do estoque filtrado: conta a QUANTIDADE POR TAMANHO (por item), tanto na
// busca por produto/código quanto ao filtrar uma gôndola (Coluna · Andar · Caixa).
function resumoGondola(arr, opts){
  opts=opts||{};
  const g=new Map(); // desc¦cor¦tam -> {desc,cor,tam,n}
  (arr||[]).forEach(u=>{ const k=[u.descricao||'',u.cor||'',u.tamanho||''].join('¦'); const cur=g.get(k)||{desc:u.descricao||'',cor:u.cor||'',tam:u.tamanho||'—',n:0}; cur.n++; g.set(k,cur); });
  const linhas=[...g.values()].sort((a,b)=> a.desc===b.desc ? String(a.tam).localeCompare(String(b.tam),'pt',{numeric:true}) : a.desc.localeCompare(b.desc))
    .map(x=>`<span style="display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid #efe2b8;border-radius:6px;padding:3px 9px;margin:2px;font-size:12px"><b style="font-size:13px">${esc(x.tam)}</b> <span class="muted">${esc(x.desc)}${x.cor?' · '+esc(x.cor):''}</span> <b class="gold" style="font-size:13px">${x.n}</b></span>`).join('');
  const partes=[opts.col?('Coluna '+opts.col):'', opts.andar?('Andar '+opts.andar):'', opts.cx?('Gôndola '+opts.cx):'', opts.q?('Busca "'+opts.q+'"'):''].filter(Boolean).join(' · ');
  return `<div style="background:#faf8f0;border:1px solid #efe2b8;border-radius:8px;padding:8px 10px;margin-bottom:8px">
    <div style="font-weight:700;font-size:12px;margin-bottom:4px">📊 ${esc(partes||'Resumo')} — <b>${arr.length}</b> unidade(s) · ${g.size} tamanho(s)/item(ns)</div>
    <div style="display:flex;flex-wrap:wrap">${linhas||'<span class="muted">vazio</span>'}</div></div>`;
}

// Deep-link: QR da caixa (?caixa=1000) abre direto o conteúdo após login.
function checkDeepLink(){
  try{
    const p=new URLSearchParams(location.search);
    // DIAGNÓSTICO OAuth: se a URL de retorno tiver marcadores de callback mas SEM code,
    // mostra os parâmetros crus (ajuda a ver o que a Tray realmente devolveu).
    const raw=location.search||'';
    if(S.user && /traycb|api_address|error|store=|adm_user|code=/i.test(raw) && !p.get('mlcb') && !p.get('code')){
      try{ uiAlert({tipo:'info', titulo:'Retorno da Tray (diagnóstico)', ok:'Entendi', msg:'A Tray te devolveu SEM o code de autorização. Parâmetros recebidos:\n\n'+raw+'\n\nManda esse texto pro suporte da integração.'}); }catch(_){}
      history.replaceState(null,'',location.pathname);
      return;
    }
    // Callback do OAuth da Tray. Detecta por traycb OU pela presença de api_address/
    // store/adm_user (a Tray SEMPRE manda esses no callback) — mesmo que o traycb se
    // perca na codificação. Checa ANTES do ML pra não ter o code sequestrado.
    const trayHint = p.get('traycb') || p.get('api_address') || p.get('store') || p.get('adm_user') || !p.get('mlcb');
    if(trayHint && p.get('code') && S.user){
      const code=p.get('code'); const api=p.get('api_address')||p.get('url')||'';
      history.replaceState(null,'',location.pathname);
      window.__trayCb={ code, apiUrl:String(api).replace(/\/+$/,'') }; try{ sessionStorage.setItem('trayCb', JSON.stringify(window.__trayCb)); }catch(_){}
      toast('Tray autorizou! Code capturado — abrindo Integrações → Tray…','ok'); go('tray');
      return;
    }
    // Callback do OAuth do Mercado Livre: EXIGE mlcb=1 (não pode ser qualquer code solto).
    const mlcode=p.get('code');
    if(p.get('mlcb') && S.user){
      history.replaceState(null,'',location.pathname);
      if(mlcode){
        toast('Conectando ao Mercado Livre…','ok');
        api('/mercadolivre/conectar',{method:'POST',body:{code:mlcode}})
          .then(r=>{ toast('Mercado Livre conectado'+(r.nickname?(' · '+r.nickname):'')+'.','ok'); go('mercadolivre'); })
          .catch(e=>{ toast('Falha ao conectar: '+(e.message||e),'err'); go('mercadolivre'); });
      }
      return;
    }
    const cx=p.get('caixa');
    if(cx && S.user){
      history.replaceState(null,'',location.pathname);
      if(canAccess('estoque')) go('estoque');
      setTimeout(()=>verCaixa(cx), 350);
    }
  }catch(e){}
}

const ENDER_ANDAR = { A:['0','1','2','3','4'], B:['A','B','C'] };
// Caixas dependem do andar: coluna B, andar A -> A1..A12; andar B -> B1..B12; etc.
// Coluna B também oferece caixas master próprias (além dos endereços por andar).
const CAIXAS_MASTER_B = ['7.000','8.000','9.000'];
function edCaixas(col, andar){
  if(col==='B'){ const l=andar||'A'; return [...Array.from({length:12},(_,i)=>l+(i+1)), ...CAIXAS_MASTER_B]; }
  return CAIXAS_MASTER;
}

// Canhoto assinado da NF: anexa foto (câmera/arquivo, comprimida) ou visualiza o arquivado.
function canhotoExp(id, tem){
  if(tem) return verCanhoto(id);
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=async()=>{
        const max=1600; let w=img.width,h=img.height;
        if(w>max||h>max){ if(w>=h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        const data=cv.toDataURL('image/jpeg',0.82);
        try{ toast('Enviando canhoto…','ok'); await api('/expedicoes/'+id+'/canhoto',{method:'POST',body:{img:data}}); toast('Canhoto arquivado ✅','ok'); loadRoute(); }
        catch(e){ toast('Falha: '+(e.message||e),'err'); }
      };
      img.onerror=()=>toast('Arquivo não é uma imagem válida.','err');
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

// ===== Plano de embalagem por caixa (packing list + etiqueta de conteúdo) =====
async function formCaixas(expId){
  let e; try{ const list=await api('/expedicoes'); e=(list||[]).find(x=>x.id===expId); }catch(err){ toast(err.message,'err'); return; }
  if(!e){ toast('Expedição não encontrada.','err'); return; }
  let ped=null; if(e.pedidoId){ try{ ped=await api('/pedidos/'+e.pedidoId); }catch(_){} }
  // Só o que foi EXPEDIDO nesta expedição (snapshot exp.itens); fallback = pedido inteiro.
  const corPorItem={}; (ped?ped.itens:[]).forEach(it=>{ corPorItem[it.id]=it.cor||''; });
  const fonte = (e.itens&&e.itens.length)? e.itens : (ped?ped.itens:[]);
  const combos=[];
  fonte.forEach(it=>{
    const cor = it.cor || corPorItem[it.pedidoItemId] || '';
    const g=it.grade&&Object.keys(it.grade).length?it.grade:null;
    if(g) Object.entries(g).forEach(([t,q])=>combos.push({descricao:it.descricao, cor, tamanho:t, disp:Number(q)||0}));
    else combos.push({descricao:it.descricao, cor, tamanho:'', disp:it.quantidade});
  });
  // Caixas existentes → tenta remapear pros combos.
  const idxCombo=(d,c,t)=>combos.findIndex(k=>k.descricao===d&&(k.cor||'')===(c||'')&&(k.tamanho||'')===(t||''));
  const boxes=(e.caixas&&e.caixas.length)? e.caixas.map(cx=>({ peso:cx.peso||'', linhas:(cx.conteudo||[]).map(l=>({ci:idxCombo(l.descricao,l.cor,l.tamanho), qtd:l.qtd})) })) : [{peso:'',linhas:[{ci:-1,qtd:''}]}];
  window.__CX={ expId, numero:e.numero, combos, boxes };
  renderCaixas();
}
function cxLabel(c){ return c ? (c.descricao.split(' · ')[0].slice(0,28)+' · '+(c.cor||'s/ cor')+' · '+(c.tamanho||'ÚNICO')) : '—'; }
function cxAlocado(ci){ const X=window.__CX; let s=0; X.boxes.forEach(b=>b.linhas.forEach(l=>{ if(l.ci===ci) s+=Number(l.qtd)||0; })); return s; }
function renderCaixas(){
  const X=window.__CX; if(!X) return;
  const opts=(sel)=>'<option value="-1">— escolha item · cor · tamanho —</option>'+X.combos.map((c,i)=>{ const rest=c.disp-cxAlocado(i); if(rest<=0 && i!==sel) return ''; /* já incluído noutra caixa → não oferece de novo */ return '<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(cxLabel(c))+' (resta '+rest+')</option>'; }).join('');
  const boxesHtml=X.boxes.map((b,bi)=>{
    const pcs=b.linhas.reduce((s,l)=>s+(Number(l.qtd)||0),0);
    const linhas=b.linhas.map((l,li)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
      <select class="inp" style="flex:1;font-size:12px;padding:5px" onchange="APP.cxSetCombo(${bi},${li},this.value)">${opts(l.ci)}</select>
      <input class="inp" type="number" min="1" value="${l.qtd||''}" placeholder="qtd" style="width:74px;text-align:center;padding:5px" oninput="APP.cxSetQtd(${bi},${li},this.value)">
      <button class="btn-sm" style="color:#c14a34" onclick="APP.cxDelLinha(${bi},${li})">✕</button></div>`).join('');
    return `<div style="border:1px solid #e0d9c4;border-radius:8px;padding:10px;margin-bottom:8px;background:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="color:#3a2f08">📦 Caixa ${bi+1}</b>
        <span style="font-size:12px;color:#6a675e">${pcs} peça(s) <input class="inp" type="number" step="0.01" value="${b.peso||''}" placeholder="peso kg" style="width:86px;margin-left:8px;padding:4px" oninput="APP.cxSetPeso(${bi},this.value)"> ${X.boxes.length>1?'<button class="btn-sm" style="color:#c14a34;margin-left:6px" onclick="APP.cxDelBox('+bi+')">excluir caixa</button>':''}</span>
      </div>${linhas}
      <button class="btn-sm" onclick="APP.cxAddLinha(${bi})">+ item na caixa</button></div>`;
  }).join('');
  const totalPc=X.boxes.reduce((s,b)=>s+b.linhas.reduce((a,l)=>a+(Number(l.qtd)||0),0),0);
  const ref=X.combos.map((c,i)=>{ const r=c.disp-cxAlocado(i); return `<span class="pill" style="background:${r===0?'#e6f4ea':r<0?'#fde8e4':'#f4f0e2'};color:${r<0?'#a33':'#5a5320'};font-size:10px;margin:0 4px 4px 0;display:inline-block">${esc(cxLabel(c))}: ${cxAlocado(i)}/${c.disp}${r<0?' ⚠':''}</span>`; }).join('');
  openModal(`<h3>📦 Montar caixas — Expedição <span class="mono gold">${esc(X.numero)}</span></h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 8px">Monte cada caixa escolhendo item · cor · tamanho e a quantidade. Uma caixa pode ter vários tamanhos/cores.</div>
    <div style="background:#faf8f0;border:1px solid #efe2b8;border-radius:8px;padding:8px;margin-bottom:10px"><div style="font-size:11px;color:#8a7a2e;margin-bottom:4px">Disponível no pedido (alocado / total):</div>${ref||'<span class="muted">Sem itens do pedido.</span>'}</div>
    <div style="max-height:46vh;overflow:auto">${boxesHtml}</div>
    <button class="btn-sm" onclick="APP.cxAddBox()" style="margin-top:4px">+ Adicionar caixa</button>
    <div style="text-align:right;font-size:13px;margin-top:6px">Total nas caixas: <b>${totalPc}</b> peça(s) · ${X.boxes.length} caixa(s)</div>
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-sm" onclick="APP.saveCaixas(false)">Salvar</button>
      <button class="btn-primary" onclick="APP.saveCaixas(true)">Salvar e imprimir etiquetas</button></div>`);
}
function cxSetCombo(bi,li,v){ window.__CX.boxes[bi].linhas[li].ci=Number(v); renderCaixas(); }
function cxSetQtd(bi,li,v){ window.__CX.boxes[bi].linhas[li].qtd=v; }
function cxSetPeso(bi,v){ window.__CX.boxes[bi].peso=v; }
function cxAddLinha(bi){ window.__CX.boxes[bi].linhas.push({ci:-1,qtd:''}); renderCaixas(); }
function cxDelLinha(bi,li){ window.__CX.boxes[bi].linhas.splice(li,1); if(!window.__CX.boxes[bi].linhas.length) window.__CX.boxes[bi].linhas.push({ci:-1,qtd:''}); renderCaixas(); }
function cxAddBox(){ window.__CX.boxes.push({peso:'',linhas:[{ci:-1,qtd:''}]}); renderCaixas(); }
function cxDelBox(bi){ window.__CX.boxes.splice(bi,1); renderCaixas(); }
async function saveCaixas(print){
  const X=window.__CX;
  const caixas=X.boxes.map(b=>({ peso:b.peso!==''?Number(b.peso):undefined, conteudo:b.linhas.filter(l=>l.ci>=0&&Number(l.qtd)>0).map(l=>{ const c=X.combos[l.ci]; return {descricao:c.descricao, cor:c.cor||null, tamanho:c.tamanho||null, qtd:Number(l.qtd)}; }) })).filter(c=>c.conteudo.length);
  if(!caixas.length){ toast('Monte ao menos uma caixa com itens.','err'); return; }
  try{ const r=await api('/expedicoes/'+X.expId+'/caixas',{method:'POST',body:{caixas}});
    toast(r.totalCaixas+' caixa(s) salvas · '+r.totalPecas+' peças.','ok');
    if(print) await imprimirEtiquetasCaixas(X.expId); else { closeModal(); loadRoute(); }
  }catch(e){ toast(e.message,'err'); }
}
async function imprimirEtiquetasCaixas(expId){
  let d; try{ d=await api('/expedicoes/'+expId+'/caixas/etiquetas'); }catch(e){ toast(e.message,'err'); return; }
  const pages=(d.etiquetas||[]).map(et=>{
    const linhas=(et.conteudo||[]).map(l=>`<tr><td>${esc(l.tamanho||'ÚNICO')}</td><td>${esc(l.cor||'—')}</td><td style="text-align:right">${l.qtd}</td></tr>`).join('');
    return `<div class="page"><div class="cxtop"><div><div class="cxnum">CX ${et.caixaNum}/${et.totalCaixas}</div><div class="cxexp">${esc(et.expedicao)}${et.nf?(' · NF '+esc(et.nf)):''}${et.pedido?(' · '+esc(et.pedido)):''}</div></div><img class="cxqr" src="${et.qr}"></div>
      <div class="cxcli">${esc(et.cliente)} — ${esc(et.cidadeUf||'')}</div>
      <table class="cxt"><thead><tr><th>Tam</th><th>Cor</th><th style="text-align:right">Qtd</th></tr></thead><tbody>${linhas}</tbody></table>
      <div class="cxtot">Total da caixa: <b>${et.pecas}</b> peça(s)${et.peso?(' · '+et.peso+' kg'):''}</div>
      <img class="cxbc" src="${et.barcode}"><div class="cxcod">${esc(et.codigo)}</div></div>`;
  }).join('');
  const n=(d.etiquetas||[]).length;
  const w=window.open('','_blank','width=520,height=760'); if(!w){ toast('Libere o pop-up p/ imprimir.','err'); return; }
  w.document.write(`<html><head><meta charset=utf-8><title>Etiquetas de caixa · ${esc(d.etiquetas&&d.etiquetas[0]?d.etiquetas[0].expedicao:'')}</title>
    <style id="psz">@page{size:100mm 150mm;margin:0}</style>
    <style>*{box-sizing:border-box;font-family:Arial}html,body{margin:0}body{color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .page{width:100mm;height:150mm;padding:6mm 12mm 6mm 14mm;display:flex;flex-direction:column;background:#fff}
    .cxtop{display:flex;justify-content:space-between;align-items:flex-start;gap:3mm}
    .cxnum{font-size:24pt;font-weight:900;line-height:1} .cxexp{font-size:8.5pt;color:#333;margin-top:2mm;word-break:break-word}
    .cxqr{width:24mm;height:24mm;flex:0 0 auto} .cxcli{font-size:10.5pt;font-weight:700;margin:3mm 0 2mm;border-top:1px solid #000;padding-top:2mm}
    .cxt{width:100%;border-collapse:collapse;font-size:10.5pt;table-layout:fixed} .cxt th,.cxt td{border:1px solid #999;padding:1.6mm 2mm;text-align:left;overflow:hidden} .cxt th{background:#eee;font-size:8.5pt}
    .cxt th:first-child,.cxt td:first-child{width:16mm} .cxt th:last-child,.cxt td:last-child{width:14mm;text-align:right}
    .cxtot{font-size:10.5pt;margin-top:auto;padding-top:2mm} .cxbc{height:12mm;max-width:74mm;margin-top:1mm} .cxcod{font-family:monospace;font-weight:700;font-size:10pt}
    /* 100×150 (padrão): 1 etiqueta por página */
    body.z150mode{background:#eee} body.z150mode .wrap{display:block}
    body.z150mode .page{page-break-after:always;margin:0 auto 3mm} body.z150mode .page:last-child{page-break-after:auto}
    /* A4 (grade 2 col p/ economizar papel na impressora comum) */
    body.a4mode{background:#eee} body.a4mode .wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm;padding:4mm}
    body.a4mode .page{width:auto;height:auto;min-height:125mm;border:1px solid #000;border-radius:6px;break-inside:avoid;margin:0}
    @media print{body{background:#fff} .bar{display:none!important} body.z150mode .page{margin:0}}
    .bar{position:fixed;top:6px;left:6px;right:6px;display:flex;gap:6px;flex-wrap:wrap;background:#fff;padding:6px;border:1px solid #ccc;border-radius:6px;z-index:9}
    .bar button{padding:6px 10px;cursor:pointer}</style></head>
    <body class="z150mode"><div class="bar"><b style="align-self:center">Imprimir:</b>
      <button onclick="setSizeCX('z150')">🏷 100×150 mm</button>
      <button onclick="setSizeCX('a4')">📄 Folha A4 (grade)</button>
      <span style="align-self:center;color:#666">${n} caixa(s)</span></div>
    <div class="wrap">${pages}</div>
    <script>function setSizeCX(s){var cls={z150:'z150mode',a4:'a4mode'}[s]||'z150mode';document.body.className=cls;var pg={z150:'@page{size:100mm 150mm;margin:0}',a4:'@page{size:A4;margin:8mm}'}[s]||'';document.getElementById('psz').textContent=pg;setTimeout(function(){window.print()},150);}setTimeout(function(){window.print()},250);<\/script></body></html>`);
  w.document.close(); closeModal(); loadRoute();
}
function confPill(s){ const m={pendente:['gray','pendente'],conferindo:['blue','conferindo'],conferida:['gold','conferida'],despachado:['green','despachado']}; const x=m[s]||['gray',s||'pendente']; return `<span class="pill ${x[0]}">${esc(x[1])}</span>`; }
async function formExpedicao(){
  const [clientes, pedidos] = await Promise.all([api('/clientes'), api('/pedidos')]);
  const co = clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const po = ['<option value="">— sem pedido —</option>'].concat(pedidos.map(p=>`<option value="${p.id}">${esc(p.numero)}</option>`)).join('');
  openModal(`<h3>Nova expedição</h3>
    <div class="grid2">
      <div><label class="fl">Cliente *</label><select id="f_cli" class="inp">${co||'<option>—</option>'}</select></div>
      <div><label class="fl">Pedido</label><select id="f_ped" class="inp">${po}</select></div>
    </div>
    <div class="grid3">${field('f_pecas','Peças *','type="number" min="1"')}${field('f_lote','Lote ID (consome estoque)','type="number"')}${field('f_vol','Volumes','type="number" value="1"')}</div>
    <div class="grid2">${field('f_transp','Transportadora','')}${field('f_cid','Cidade/UF','')}</div>
    ${field('f_nf','Nota fiscal','')}
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveExpedicao()">Criar</button></div>`);
}
async function saveExpedicao(){
  const body = { clienteId:Number(val('f_cli')), pecas:Number(val('f_pecas')) };
  const ped=val('f_ped'); if(ped) body.pedidoId=Number(ped);
  const lote=val('f_lote'); if(lote) body.loteId=Number(lote);
  const vol=val('f_vol'); if(vol) body.volumes=Number(vol);
  ['transp:transportadora','cid:cidadeUf','nf:nf'].forEach(m=>{ const [f,k]=m.split(':'); const v=val('f_'+f); if(v) body[k]=v; });
  if(!body.clienteId||!body.pecas){ toast('Informe cliente e peças.','err'); return; }
  try{ const e=await api('/expedicoes',{method:'POST',body}); closeModal(); toast('Expedição '+e.numero+' criada · rastreio '+e.rastreio,'ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

    <div class="grid2">${field('f_nome','Nome *','value="'+esc(u.nome||'')+'"')}${field('f_user','Login *','value="'+esc(u.usuario||'')+'"'+(u.id?' disabled':''))}</div>
    ${field('f_senha','Senha '+(u.id?'(deixe em branco p/ manter)':'*'),'type="password"')}

    <div class="grid2">${field('f_cargo','Cargo','value="'+esc(u.cargo||'')+'"')}${field('f_setor','Setor','value="'+esc(u.setor||'')+'"')}</div>
    <div class="grid2">${field('f_hi','Horário início','type="time" value="'+esc(u.horarioInicio||'')+'"')}${field('f_hf','Horário fim','type="time" value="'+esc(u.horarioFim||'')+'"')}</div>

      <button class="btn-primary" onclick="APP.saveUsuario(${u.id||0})">Salvar</button></div>`);
}
async function saveUsuario(id){
  const body = { nome:val('f_nome'), acesso:val('f_acesso'), cargo:val('f_cargo')||undefined, setor:val('f_setor')||undefined,
    horarioInicio:val('f_hi')||undefined, horarioFim:val('f_hf')||undefined };
  if(!id) body.usuario=val('f_user');
  const s=val('f_senha'); if(s) body.senha=s;
  if(!body.nome||(!id&&!body.usuario)||(!id&&!s)){ toast('Nome, login e senha são obrigatórios.','err'); return; }
  try{ await api(id?('/usuarios/'+id):'/usuarios',{method:id?'PATCH':'POST',body}); closeModal(); toast('Usuário salvo.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function removeUsuario(id){
  try{ await api('/usuarios/'+id,{method:'DELETE'}); toast('Usuário desativado.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function desbloquearUsuario(id){
  if(!(await uiConfirm({tipo:'warn', titulo:'Desbloquear conta?', msg:'O usuário poderá tentar entrar novamente.', ok:'Desbloquear'}))) return;
  try{ await api('/usuarios/'+id+'/desbloquear',{method:'PATCH'}); toast('Conta desbloqueada.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

async function saveMedida(id){
  const body = { colaborador:val('f_colab'), tamanho:val('f_tam') };
  if(!id) body.clienteId = Number(val('f_cli'));
  const opt = { cargo:'f_cargo', obs:'f_obs' };
  Object.entries(opt).forEach(([k,f])=>{ const v=val(f); if(v) body[k]=v; });
  const nums = { torax:'f_torax', cintura:'f_cint', quadril:'f_quad', altura:'f_alt' };
  Object.entries(nums).forEach(([k,f])=>{ const v=val(f); if(v) body[k]=Number(v); });
  if(!body.colaborador||!body.tamanho||(!id&&!body.clienteId)){ toast('Preencha cliente, colaborador e tamanho.','err'); return; }
  try{ await api(id?('/medidas/'+id):'/medidas',{method:id?'PATCH':'POST',body}); closeModal(); toast('Ficha salva.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}
async function removeMedida(id){
  try{ await api('/medidas/'+id,{method:'DELETE'}); toast('Ficha excluída.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

async function loadCusto(){
  const id = val('pr_prod'); const out = $('pr_out');
  if(!id){ out.innerHTML = '<div class="empty">Selecione um produto.</div>'; return; }
  out.innerHTML = '<div class="spin"></div>';
  try{
    const d = await api('/produtos/'+id+'/custo');
    window.__CUSTO = Number(d.custoMaterial);
    out.innerHTML = `
      <div class="sect" style="margin-top:0"><h3>Consumo (BOM) · ${esc(d.produto.codigo)}</h3>` +
      (d.itens.length ? panelTable(['Material','Descrição','Qtd','Custo unit.','Subtotal'],
        d.itens.map(i=>[`<span class="mono gold">${esc(i.material)}</span>`, esc(i.descricao), esc(i.quantidade)+' '+esc(i.unidade), money(i.custoUnit), `<b>${money(i.subtotal)}</b>`]))
        : '<div class="panel"><div class="empty">Este produto ainda não tem receita (BOM) cadastrada.</div></div>') + `</div>
      <div class="sect"><h3>Composição do preço</h3>
        <div class="panel" style="padding:18px">
          <div class="grid3">
            <div><label class="fl">Custo de material (BOM)</label><input class="inp" value="${money(d.custoMaterial)}" disabled></div>
            ${field('pr_mo','Mão de obra + facção (R$)','type="number" step="0.01" value="0" oninput="APP.calcPreco()"')}
            ${field('pr_outros','Outros custos (R$)','type="number" step="0.01" value="0" oninput="APP.calcPreco()"')}
          </div>
          <div class="grid2" style="margin-top:4px">
            ${field('pr_imp','Impostos sobre venda (%)','type="number" step="0.01" value="5.93" oninput="APP.calcPreco()"')}
            ${field('pr_marg','Margem desejada (%)','type="number" step="0.5" value="40" oninput="APP.calcPreco()"')}
          </div>
          <div id="pr_res" style="margin-top:10px"></div>
        </div>
      </div>`;
    calcPreco();
  }catch(e){ out.innerHTML = `<div class="empty" style="color:#c14a34">${esc(e.message)}</div>`; }
}
function calcPreco(){
  const custo = (window.__CUSTO||0) + Number(val('pr_mo')||0) + Number(val('pr_outros')||0);
  const imp = Number(val('pr_imp')||0), marg = Number(val('pr_marg')||0);
  const divisor = 1 - (imp+marg)/100;
  const el = $('pr_res'); if(!el) return;
  if(divisor <= 0){ el.innerHTML = '<div class="err">Impostos + margem não podem somar 100% ou mais.</div>'; return; }
  const preco = custo/divisor, lucro = preco*marg/100;
  el.innerHTML = `<div class="cards">
    ${kpi('Custo total da peça', money(custo), 'material + mão de obra + outros')}
    ${kpi('Preço de venda sugerido', money(preco), 'markup divisor: 1 − (imp% + margem%)')}
    ${kpi('Lucro estimado / peça', money(lucro), marg+'% sobre o preço')}
  </div>`;
}

async function formOS(pedidoId){

  const [ops, prods] = await Promise.all([api('/ops'), api('/produtos').catch(()=>[])]);
  const doPed = (ops||[]).filter(o=>o.pedidoId===pedidoId);
  if(!doPed.length){ toast('Sem OPs para este pedido.','err'); return; }
  const pnome={}; (prods||[]).forEach(p=>pnome[p.id]=p.codigo+' — '+p.descricao);
  const prodMap=new Map(), sizes=new Set();
  doPed.forEach(o=>{ if(o.produtoId!=null&&!prodMap.has(o.produtoId)) prodMap.set(o.produtoId, pnome[o.produtoId]||('Produto '+o.produtoId));

function osMarcar(cls, val){ document.querySelectorAll('.'+cls).forEach(e=>{ e.checked=val; }); }
async function gerarOS(pedidoId){
  const prodEls=[...document.querySelectorAll('.os_prod:checked')].map(e=>Number(e.value));
  const tamEls=[...document.querySelectorAll('.os_tam:checked')].map(e=>e.value);
  const allProd=document.querySelectorAll('.os_prod').length, allTam=document.querySelectorAll('.os_tam').length;
  if(!prodEls.length){ toast('Selecione ao menos um produto.','err'); return; }
  if(!tamEls.length){ toast('Selecione ao menos um tamanho.','err'); return; }
  const body={pedidoId};
  if(prodEls.length<allProd) body.produtoIds=prodEls;
  if(tamEls.length<allTam) body.tamanhos=tamEls;
  try{
    const r=await fetch(API+'/documentos/os/gerar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.access},body:JSON.stringify(body)});
    if(!r.ok){ let m='Falha ao gerar OS ('+r.status+').'; try{const j=await r.json();m=j.message||m;}catch(e){} throw new Error(m); }
    const blob=await r.blob(); closeModal();
    abrirPdfBlob(blob,{titulo:'📋 Ordem de Serviço · '+pedidoId, nome:'OS-'+pedidoId});
  }catch(e){ toast(e.message,'err'); }
}

// ---------- Som de bipe (Web Audio, sem arquivo externo) ----------
let _actx=null;
function _ac(){ try{ if(!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)(); if(_actx.state==='suspended') _actx.resume(); return _actx; }catch(e){ return null; } }
function _tone(freq,dur,type,vol){ const ac=_ac(); if(!ac) return; try{ const o=ac.createOscillator(),g=ac.createGain(); o.type=type||'square'; o.frequency.value=freq; o.connect(g); g.connect(ac.destination); const t=ac.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.min(1,vol||1),t+0.005); g.gain.setValueAtTime(Math.min(1,vol||1),t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }catch(e){} }
// Bipe estilo leitor de caixa de mercado: um "blip" curto que sobe de tom, alto e limpo.
function beepOk(){
  const ac=_ac(); if(!ac) return;
  try{ const o=ac.createOscillator(), g=ac.createGain(); o.type='square';
    const t=ac.currentTime;
    o.frequency.setValueAtTime(1000,t); o.frequency.exponentialRampToValueAtTime(1900,t+0.055);
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(1,t+0.004);
    g.gain.setValueAtTime(1,t+0.075); g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
    o.start(t); o.stop(t+0.13);
  }catch(e){}
}
function beepErro(){ _tone(220,0.2,'sawtooth',1); _tone(330,0.2,'square',0.8); setTimeout(()=>{ _tone(180,0.24,'sawtooth',1); _tone(270,0.24,'square',0.8); },150); } // grave duplo (erro)

// ---------- Scanner por câmera (QR + código de barras) ----------
// Usa BarcodeDetector nativo (Chrome/Edge/Android). No iPhone (Safari não tem
// BarcodeDetector) cai automaticamente para a biblioteca ZXing (self-hosted).
let _scan={stream:null,raf:null,zx:null};
function carregarZxing(){
  return new Promise((res,rej)=>{
    if(window.ZXing) return res(window.ZXing);
    const s=document.createElement('script'); s.src='/vendor/zxing.min.js';
    s.onload=()=>window.ZXing?res(window.ZXing):rej(new Error('ZXing não carregou'));
    s.onerror=()=>rej(new Error('Falha ao carregar o leitor.'));
    document.head.appendChild(s);
  });
}
async function abrirScanner(onCode){
  let ov=document.getElementById('scanov'); if(!ov){ ov=document.createElement('div'); ov.id='scanov'; document.body.appendChild(ov); }
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;font-size:15px">📷 Centralize o código de barras na linha vermelha</div>'
    +'<div style="position:relative;display:inline-block;line-height:0">'
    +'<video id="scanv" playsinline muted autoplay style="max-width:92vw;max-height:68vh;border-radius:10px;background:#000"></video>'
    +'<div style="position:absolute;left:6%;right:6%;top:50%;height:3px;background:#ff2d2d;transform:translateY(-50%);box-shadow:0 0 8px 1px rgba(255,45,45,.9);border-radius:2px;pointer-events:none"></div>'
    +'<div style="position:absolute;left:50%;top:calc(50% - 26px);width:2px;height:52px;background:rgba(255,45,45,.55);transform:translateX(-50%);pointer-events:none"></div>'
    +'</div>'
    +'<div id="scanm" style="color:#ccc;font-size:13px">Procurando código…</div><button id="scanx" style="padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:700">Fechar</button>';
  document.getElementById('scanx').onclick=fecharScanner;
  const v=document.getElementById('scanv');
  const done=(raw)=>{ beepOk(); fecharScanner(); if(onCode) onCode(raw); };
  try{
    if('BarcodeDetector' in window){
      const det=new window.BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','code_39','upc_a','upc_e','itf','codabar']});
      _scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      v.srcObject=_scan.stream; await v.play();
      const loop=async()=>{ if(!_scan.stream) return; try{ const cs=await det.detect(v); if(cs&&cs.length){ done(cs[0].rawValue); return; } }catch(e){} _scan.raf=requestAnimationFrame(loop); };
      loop(); return;
    }
    // iPhone / Safari: ZXing
    const m=document.getElementById('scanm'); if(m) m.textContent='Carregando leitor…';
    const ZX=await carregarZxing();
    if(m) m.textContent='Procurando código…';
    const hints=new Map();
    const fmts=[ZX.BarcodeFormat.QR_CODE,ZX.BarcodeFormat.CODE_128,ZX.BarcodeFormat.CODE_39,ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,ZX.BarcodeFormat.ITF,ZX.BarcodeFormat.CODABAR,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E];
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, fmts);
    _scan.zx=new ZX.BrowserMultiFormatReader(hints, 250);
    _scan.zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}}, v, (result)=>{ if(result){ done(result.getText()); } });
  }catch(e){ const m=document.getElementById('scanm'); if(m) m.textContent='Não foi possível acessar a câmera: '+(e.message||e)+'. Verifique a permissão de câmera do Safari.'; }
}
function fecharScanner(){
  try{ if(_scan.raf)cancelAnimationFrame(_scan.raf); if(_scan.zx){ _scan.zx.reset(); } if(_scan.stream)_scan.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  _scan={stream:null,raf:null,zx:null}; const ov=document.getElementById('scanov'); if(ov) ov.remove();
}

// Grade da conferência: por tamanho, quanto tem que bipar (esperado), quanto já bipou e o que falta.
function confGradeHtml(grade){
  if(!grade||!grade.length) return '';
  const totFalta=grade.reduce((s,g)=>s+(g.falta||0),0);
  const rows=grade.map(g=>{
    const done=g.esperado>0 && g.conferido>=g.esperado;
    const bg=done?'#e6f4ea':(g.conferido>0?'#fff7e6':'#fdecea');
    const bcol=done?'#1e7a44':(g.conferido>0?'#9a5a00':'#c14a34');
    return `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;background:${bg};margin:2px 0">
      <span style="font-size:12px;min-width:0"><b style="font-size:13px">${esc(g.tamanho)}</b> <span class="muted">${esc(g.descricao)}${g.cor?' · '+esc(g.cor):''}</span></span>
      <span style="font-size:13px;font-weight:800;color:${bcol};white-space:nowrap">${g.conferido}/${g.esperado} ${done?'✓':(g.falta>0?'· faltam <span style="font-size:15px">'+g.falta+'</span>':'')}</span>
    </div>`;
  }).join('');
  return `<div style="border:1px solid #efe2b8;border-radius:8px;padding:8px;margin-bottom:8px;max-height:240px;overflow:auto">
    <div style="font-weight:700;font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between"><span>📋 Bipar por tamanho</span>${totFalta>0?`<span style="color:#c14a34">faltam ${totFalta} pç</span>`:'<span style="color:#1e7a44">tudo conferido ✓</span>'}</div>
    ${rows}</div>`;
}

async function sendEmailDoc(tipo, refId){
  const mensagem = val('f_msg');
  // Aceita vários e-mails separados por vírgula/;/espaço.
  const lista=(val('f_para')||'').split(/[,;\s]+/).map(e=>e.trim()).filter(Boolean);
  if(!lista.length){ toast('Informe ao menos um e-mail de destino.','err'); return; }
  const re=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  const invalidos=lista.filter(e=>!re.test(e));
  if(invalidos.length){ toast('E-mail(s) inválido(s): '+invalidos.join(', '),'err'); return; }
  const para=[...new Set(lista)].join(', ');
  try{
    const d = await api('/documentos/'+tipo,{method:'POST',body:{referenciaId:refId}});
    const body = { para }; if(mensagem) body.mensagem = mensagem;
    const r = await api('/documentos/'+d.id+'/enviar-email',{method:'POST',body});
    closeModal();
    const alvo = lista.length>1 ? (lista.length+' destinatários') : para;
    if(r.simulado) toast('E-mail SIMULADO p/ '+alvo+' (configure SMTP_* p/ envio real). Doc '+r.documento+'.','err');
    else toast('E-mail enviado para '+alvo+' com o documento '+r.documento+'.','ok');
  }catch(e){ toast(e.message,'err'); }
}

async function cartaPdfNaJanela(id, w, tentativas){
  try{
    const r=await fetch(API+'/nfe/'+id+'/carta-correcao/pdf',{headers:{Authorization:'Bearer '+S.access}});
    if(r.ok){ const blob=await r.blob(); const url=URL.createObjectURL(blob); w.location=url; setTimeout(()=>{try{w.print()}catch(e){}},800); return; }
    if(tentativas>0){ setTimeout(()=>cartaPdfNaJanela(id,w,tentativas-1), 3000); return; }
    let m='A CC-e ainda está processando na SEFAZ. Feche e clique em "🖨 CC-e" em alguns segundos.'; try{const j=await r.json();m=j.message||m;}catch(e){}
    w.document.body.innerHTML='<div style="font-family:Arial;padding:24px;color:#c14a34">'+esc(m)+'</div>';
  }catch(e){ try{ w.document.body.innerHTML='<div style="font-family:Arial;padding:24px;color:#c14a34">Falha: '+esc(e.message||e)+'</div>'; }catch(_){} }
}

function agenteKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); agenteSend(); }
}
function agenteSug(txt){ const ta=$('agInput'); if(ta){ ta.value=txt; agenteSend(); } }
function agenteClear(){ AG.hist=[]; renderAgMsgs(); const ta=$('agInput'); if(ta) ta.focus(); }
async function agenteSend(){
  if(AG.busy) return;
  const ta = $('agInput'); if(!ta) return;
  const msg = ta.value.trim(); if(!msg) return;
  const prev = AG.hist.slice(-12);
  ta.value=''; ta.style.height='auto';
  AG.busy=true; const btn=$('agSend'); if(btn) btn.disabled=true;
  renderAgMsgs(msg);
  try{
    const r = await api('/agente/chat', { method:'POST', body:{ mensagem: msg, historico: prev.filter(x=>x.role==='user'||x.role==='assistant') } });
    AG.hist.push({role:'user', content: msg});
    AG.hist.push({role:'assistant', content: r.resposta || '—'});
    (r.acoes||[]).forEach(a=> AG.hist.push({role:'acao', tipo:a.tipo, dados:a.dados, descricao:a.descricao, estado:'pendente'}));
  }catch(e){
    AG.hist.push({role:'user', content: msg});
    AG.hist.push({role:'assistant', content: 'Desculpe, não consegui responder agora ('+esc(e.message)+').'});
  }finally{
    AG.busy=false; if(btn) btn.disabled=false;
    renderAgMsgs();
    const t2=$('agInput'); if(t2) t2.focus();
  }
}
async function agenteExec(i){
  const a = AG.hist[i]; if(!a || a.estado!=='pendente' || AG.busy) return;
  AG.busy=true; renderAgMsgs();
  try{
    const r = await api('/agente/executar', { method:'POST', body:{ tipo:a.tipo, dados:a.dados } });
    a.estado = r && r.ok ? 'feito' : 'erro';
    a.resultado = (r && r.resumo) || '';
    if(a.estado==='feito') toast(a.resultado,'ok');
  }catch(e){
    a.estado='erro'; a.resultado = e.message || 'Falha ao executar.';
    toast(a.resultado,'err');
  }finally{ AG.busy=false; renderAgMsgs(); }
}
function agenteCancel(i){
  const a = AG.hist[i]; if(!a || a.estado!=='pendente') return;
  a.estado='cancelado'; renderAgMsgs();
}

function empLogoThumb(){
  const u=window.__EMPLOGO;
  if(u) return `<img src="${u}" style="max-height:60px;max-width:220px;display:block"><a onclick="APP.empLogoDel()" style="cursor:pointer;color:#e08a6a;font-size:11px">remover</a>`;

}
async function empLogoSel(el){
  const f=el.files&&el.files[0]; if(!f) return;
  try{
    const dataUrl=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; const max=400; if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); } const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/png')); }; img.onerror=rej; img.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(f); });
    window.__EMPLOGO=dataUrl; if($('emplogo_pv')) $('emplogo_pv').innerHTML=empLogoThumb();
  }catch(e){ toast('Não foi possível ler a imagem.','err'); }
}
function empLogoDel(){ window.__EMPLOGO=''; if($('emplogo_pv')) $('emplogo_pv').innerHTML=empLogoThumb(); }

async function saveFilial(id){
  const body = { nome:val('fl_nome'), matriz:$('fl_matriz').checked, ativa:$('fl_ativa').checked,
    cnpj:val('fl_cnpj'), inscricaoEstadual:val('fl_ie'), crt:Number(val('fl_crt')), nomeFantasia:val('fl_fant'), telefone:val('fl_tel'),
    logradouro:val('fl_log'), numeroEndereco:val('fl_num'), bairro:val('fl_bairro'), municipio:val('fl_mun'), codMunicipio:val('fl_codmun'),
    uf:(val('fl_uf')||'').toUpperCase(), cep:val('fl_cep'), focusToken:val('fl_token'), focusTokenHomolog:val('fl_tokhom'), focusTokenProd:val('fl_tokprod'), nfeSerie:val('fl_serie')||'1', nfeProximoNumero:Number(val('fl_prox')||1),
    regimeTributario:val('fl_regime')||'lucro_presumido', icmsCstPadrao:val('fl_icmscst')||undefined, pisCofinsCst:val('fl_pccst')||undefined, csosn:val('fl_csosn')||undefined };
  const _n=(id2)=>{ const v=val(id2); return v!==''?Number(v):undefined; };
  body.icmsInterno=_n('fl_icmsint'); body.pisAliquota=_n('fl_pis'); body.cofinsAliquota=_n('fl_cofins');
  body.pesoMedioPeca=_n('fl_peso');
  // Reforma Tributária (IBS/CBS)
  body.reformaAtiva=$('fl_reforma').checked;
  body.cbsAliquota=_n('fl_cbs'); body.ibsUfAliquota=_n('fl_ibsuf'); body.ibsMunAliquota=_n('fl_ibsmun');
  body.ibsCbsCst=val('fl_ibscst')||undefined; body.ibsCbsClassTrib=val('fl_ibsclass')||undefined;
  body.dadosBancarios=(($('fl_banco')&&$('fl_banco').value)||'').trim();
  body.nfeAmbiente=val('fl_amb')||undefined;
  if(!body.nome){ toast('Informe o nome da filial.','err'); return; }
  Object.keys(body).forEach(k=>{ if(body[k]===''||body[k]===undefined) delete body[k]; });
  try{ await api(id?('/filiais/'+id):'/filiais',{method:id?'PATCH':'POST',body}); closeModal(); toast('Filial salva.','ok'); loadRoute(); }
  catch(e){ toast(e.message,'err'); }
}

// Abre o modal de VÍNCULO: cada item do ML → produto do ERP (ou cadastrar rápido).
async function mlImportar(id){
  const o=(window.__MLPED||[]).find(x=>String(x.id)===String(id));
  const itens=(o&&o.itens)||[];
  const prods=await api('/produtos').catch(()=>[]);
  window.__MLPRODS=prods;
  const norm=s=>String(s||'').toLowerCase();
  const opt=(sel)=>`<option value="">— não vincular (texto livre) —</option>`+ (prods||[]).map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.codigo+' · '+p.descricao)}${p.cor?(' · '+esc(p.cor)):''}</option>`).join('');
  const rows=itens.map((it,i)=>{
    // palpite: produto cujo código/descrição aparece no título do anúncio
    const t=norm(it.titulo); const guess=(prods||[]).find(p=>t.includes(norm(p.codigo))||t.includes(norm(p.descricao).slice(0,12)));
    return `<div style="border-top:1px solid #eee;padding:8px 0">
      <div style="font-size:12.5px;font-weight:600">${esc(it.quantidade)}× ${esc(it.titulo)}</div>
      <div style="display:flex;gap:6px;margin-top:4px;align-items:center">
        <select class="inp mlvinc" data-i="${i}" style="flex:1;font-size:12px">${opt(guess?guess.id:'')}</select>
        <button class="btn-sm" title="cadastrar produto rápido" onclick="APP.mlCadProd(${i},'${esc(String(it.titulo)).replace(/'/g,"&#39;")}')">+ novo</button>
      </div></div>`;
  }).join('');
  openModal(`<h3>🔗 Importar pedido ML <span class="mono muted" style="font-size:12px">${esc(id)}</span></h3>
    <div class="muted" style="font-size:12px;margin:-4px 0 8px">Vincule cada item a um produto do ERP (assim o pedido já gera OP, baixa estoque e passa na conferência). Sem vínculo, entra como texto livre.</div>
    ${rows||'<div class="muted">Sem itens.</div>'}
    <div class="row-end" style="margin-top:12px"><button class="btn-ghost" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.mlImportarConfirmar('${esc(String(id))}',${itens.length})">Importar pedido</button></div>`);
}
async function mlImportarConfirmar(id,n){
  const vinc=new Array(n).fill(null);
  document.querySelectorAll('.mlvinc').forEach(s=>{ const i=Number(s.dataset.i); const v=Number(s.value); if(v>0) vinc[i]=v; });
  try{
    const r=await api('/mercadolivre/pedidos/'+id+'/importar',{method:'POST',body:{vinculos:vinc}});
    let msg='Pedido '+esc(r.numero)+' criado · '+esc(r.cliente)+' · '+money(r.total);
    if(r.semVinculo>0) msg+=' · ⚠ '+r.semVinculo+' item(ns) sem produto vinculado';
    toast(msg, r.semVinculo>0?'err':'ok'); closeModal(); mlCarregarPedidos();
  }catch(e){ toast(e.message,'err'); }
}

async function waSimular(){
  const inp=$('wa_msg'); const texto=(inp?inp.value:'').trim(); if(!texto) return;
  const tel=$('wa_simtel')?$('wa_simtel').textContent:'5511900000000';
  __waChat.push({origem:'cliente',texto}); waRenderChat(); if(inp) inp.value='';
  __waChat.push({origem:'bot',texto:'…'}); waRenderChat();
  try{
    const r=await api('/whatsapp/simular',{method:'POST',body:{telefone:tel,texto,nome:'Cliente Simulado'}});
    __waChat.pop();
    if(r.resposta) __waChat.push({origem:'bot',texto:r.resposta});
    if(r.estado==='humano' && r.pedidoNumero) __waChat.push({origem:'sistema',texto:'Pedido '+r.pedidoNumero+' criado. Conversa encaminhada à equipe.'});
    else if(r.estado==='humano') __waChat.push({origem:'sistema',texto:'Conversa encaminhada para atendimento humano.'});
    waRenderChat();
  }catch(e){ __waChat.pop(); __waChat.push({origem:'sistema',texto:'Erro: '+e.message}); waRenderChat(); }

// ---------- Kits de Corte / Rastreabilidade ----------
function kitPill(s){
  const m={aguardando_expedicao:['blue','aguardando exp.'],em_faccao:['red','em facção'],retornado:['green','retornado'],em_conferencia:['gold','conferência'],finalizado:['gray','finalizado'],criado:['gray','criado'],em_corte:['blue','em corte']};
  const x=m[s]||['gray',s]; return `<span class="pill ${x[0]}">${esc(x[1])}</span>`;
}
// Botões de ação por linha (contextuais ao status) — evita ter que bipar o código.
function kitRowAcoes(k){
  const st=k.status||''; const cod=esc(k.codigo); const interna=(k.faccaoNome||'')==='PRODUÇÃO INTERNA';
  let b='';
  if(st==='aguardando_expedicao'||st==='criado'||st==='em_corte'){
    if(interna) b+=`<button class="btn-sm" style="color:#1e7a44" onclick="APP.kitAcao('${cod}','finalizar')">✓ Finalizar</button> `;
    else b+=`<button class="btn-sm" style="color:#b5731a" onclick="APP.kitAcao('${cod}','expedir')">▶ Expedir</button> `;
  } else if(st==='em_faccao'){ b+=`<button class="btn-sm" style="color:#b5731a" onclick="APP.kitAcao('${cod}','retornar')">↩ Retorno</button> `; }
  else if(st==='retornado'){ b+=`<button class="btn-sm" onclick="APP.kitAcao('${cod}','conferir')">🔎 Conferir</button> `; }
  else if(st==='em_conferencia'){ b+=`<button class="btn-sm" style="color:#1e7a44" onclick="APP.kitAcao('${cod}','finalizar')">✓ Finalizar</button> `; }
  b+=`<button class="btn-sm" title="Reimprimir Ordem de Serviço (romaneio + ficha técnica)" onclick="APP.kitFicha('${cod}')">📄 Ordem de Serviço</button> `;
  return b;
}
// Preenche o campo de bip com o código do kit e dispara a ação (mesmo fluxo do leitor).
function kitAcao(codigo, acao){ const i=$('kit_bip'); if(i) i.value=codigo; kitBipar(acao); }
// Romaneio + ficha técnica do kit (p/ a costureira/oficina). Abre a impressão.
async function kitFicha(codigo){
  let f; try{ f=await api('/kits/'+encodeURIComponent(codigo)+'/ficha'); }catch(e){ toast(e.message,'err'); return; }
  imprimirFichaTecnicaKit(f);
}

// NF de remessa p/ industrialização (facção com CNPJ). Facção sem CNPJ → segue por OS.
async function emitirRemessaFaccao(){
  const controle = prompt('Controle / OS da facção (ex.: OS-20260811-0001):',''); if(!controle) return;
  uiSpinnerOpen({nota:'NF de remessa · industrialização'});
  try{
    const n = await api('/nfe/remessa',{method:'POST',body:{controleFaccao:controle.trim()}});
    uiSpinnerClose();
    if(n.status==='rejeitada'){ await uiAlert({tipo:'err', titulo:'NF de remessa rejeitada', msg:'Motivo: '+(n.motivo||'ver detalhe')}); return; }
    if(n.status==='simulada'){
      await uiAlert({tipo:'info', titulo:'NF de remessa '+n.numero+' — SIMULADA', msg:'Emitida em MODO SIMULADO (sem valor fiscal). Confira o DANFE com a contabilidade (CFOP, natureza, ICMS suspenso) antes de emitir de verdade. Configure o token da Focus + dados fiscais da facção p/ valer.', ok:'Entendi'});
    } else {
      toast('NF de remessa '+n.numero+' '+n.status+'.','ok');
    }
    loadRoute();
  }catch(e){ uiSpinnerClose(); toast('Falha: '+(e.message||e),'err'); }
}
async function kitBipar(acao){
  const codigo = val('kit_bip'); if(!codigo){ toast('Bipe ou digite o código do kit.','err'); return; }
  // Se bipar um código de CONTROLE (CTRL-...), aplica a ação a TODOS os kits do controle.
  if(/^(CTRL|OS)-\d/i.test(codigo.trim())) return kitBiparControle(acao, codigo.trim());
  let body={codigo};
  if(acao==='expedir'){
    const f=prompt('Facção destino (deixe em branco p/ usar a do kit):',''); if(f===null) return; if(f) body.faccaoNome=f;
    const nf=prompt('Nº da NF de remessa p/ industrialização (opcional):',''); if(nf) body.remessaNf=nf;
    const t=prompt('Transportador (opcional):',''); if(t) body.transportador=t;
  }
  if(acao==='retornar'){
    // Retorno da facção abre a janela OBRIGATÓRIA de conferência (faltas + reposição).
    return APP.formRetornoFaccao(codigo);
  }
  try{ const r=await api('/kits/'+acao,{method:'POST',body});
    toast((r.ja?'⚠️ ':'✅ ')+r.mensagem, r.ja?'err':'ok');
    // Expedição OBRIGA a impressão do romaneio + ficha técnica p/ a costureira/oficina.
    if(acao==='expedir' && !r.ja) await kitFicha(codigo);
    $('kit_bip').value=''; loadRoute();
  }catch(e){ toast('Falha: '+(e.message||e),'err'); }
}

// Bipar um CONTROLE (CTRL-...): aplica a ação a todos os kits daquele controle de uma vez.
async function kitBiparControle(acao, controle){
  let kits=[]; try{ kits=await api('/kits/controle/'+encodeURIComponent(controle)); }catch(e){ toast(e.message,'err'); return; }
  if(!kits.length){ toast('Nenhum kit encontrado para o controle '+controle+'.','err'); return; }
  if(acao==='retornar'){
    const nf=prompt('Controle '+controle+' ('+kits.length+' kit(s)). NF de retorno da facção (deixe em branco se for produção interna):','');
    if(nf===null) return;
    let ok=0,err=0;
    for(const k of kits){ try{ await api('/kits/retornar',{method:'POST',body:{codigo:k.codigo, retornoNf:nf||('RET-'+controle)}}); ok++; }catch(e){ err++; } }
    toast('Retorno · controle '+controle+' → '+ok+'/'+kits.length+' kit(s)'+(err?' ('+err+' falha)':''), err?'err':'ok');
    $('kit_bip').value=''; loadRoute(); return;
  }
  const label={expedir:'Expedição',conferir:'Conferência',finalizar:'Finalização'}[acao]||acao;
  let ok=0,err=0,lastMsg='';
  for(const k of kits){ try{ const r=await api('/kits/'+acao,{method:'POST',body:{codigo:k.codigo}}); ok++; lastMsg=r.mensagem||''; }catch(e){ err++; } }
  toast('✅ '+label+' · controle '+controle+' → '+ok+'/'+kits.length+' kit(s)'+(err?' ('+err+' falha)':''), err?'err':'ok');
  $('kit_bip').value=''; loadRoute();
}

    <div class="mrow"><label class="fl">As peças voltaram corretas ou com falta/anomalia? *</label>
      <select id="rf_conf" class="inp" onchange="APP.retornoFaltasToggle()">

function retornoFaltasToggle(){
  const tem = val('rf_conf')==='falta';
  $('rf_bloco_faltas').style.display = tem?'block':'none';
}
function retornoReporToggle(){
  const repor = val('rf_repor')==='sim';
  $('rf_bloco_repor').style.display = repor?'block':'none';
  $('rf_bloco_pcp').style.display = repor?'none':'block';
}
// Alterna o rótulo/botão do documento de retorno entre NF-e e OS.
function retornoTipoToggle(){
  const os = val('rf_tipo')==='os';
  const lbl=$('rf_nf_lbl'), btn=$('rf_os_btn'), inp=$('rf_nf');
  if(lbl) lbl.textContent = os ? 'Nº da OS *' : 'Nº da NF de retorno *';
  if(btn) btn.style.display = os ? '' : 'none';
  if(inp) inp.placeholder = os ? 'clique "Gerar nº OS" ou digite' : 'nº da NF da facção';
}
// Gera o próximo número de OS (retorno sem NF) e preenche o campo.
async function gerarOsRetorno(){
  try{ const r=await api('/kits/proximo-os'); const i=$('rf_nf'); if(i){ i.value=r.numero; i.focus(); } }
  catch(e){ toast(e.message,'err'); }
}
async function retornoFaccaoSubmit(codigo){
  const nf = val('rf_nf').trim();
  if(!nf){ toast('Informe a NF de retorno da facção — o kit fica travado até isso.','err'); return; }
  const body = { codigo, retornoNf:nf };
  const q = val('rf_qtd'); if(q!=='') body.qtd = Number(q);
  if(val('rf_conf')==='falta'){
    const qf = Number(val('rf_qfaltas'));
    if(!qf || qf<1){ toast('Informe quantas peças estão faltando/anomalia.','err'); return; }
    body.qtdFaltas = qf;
    if(val('rf_repor')==='sim'){
      body.repor = true;
      const fid = val('rf_forn'); if(fid) body.fornecedorId = Number(fid);
      const vu = val('rf_vunit'); if(vu!=='') body.valorUnit = Number(vu);
    }else{
      body.repor = false;
      const s = val('rf_senha'); if(!s){ toast('Informe a senha do PCP para dispensar a reposição.','err'); return; }
      body.senhaPcp = s;
    }
  }
  try{
    const r = await api('/kits/retornar',{method:'POST',body});
    closeModal();
    toast((r.ja?'⚠️ ':'✅ ')+r.mensagem, r.ja?'err':'ok');
    $('kit_bip').value=''; loadRoute();
  }catch(e){ toast('Falha: '+(e.message||e),'err'); }
}

async function formKitsDaOp(){
  const [ops, lotes] = await Promise.all([api('/ops'), api('/kits/lotes')]);
  const comGrade = (ops||[]).filter(o=>o.gradeTamanhos && Object.keys(o.gradeTamanhos).length);
  // Só OPs EM PRODUÇÃO (em corte / em produção / em facção) — não a_iniciar nem concluído.
  const emProd = comGrade.filter(o=>['em_corte','em_producao','em_faccao'].includes(o.status));
  const lista = emProd.length ? emProd : comGrade;
  if(!lista.length){ toast('Nenhuma OP em produção com grade. Avance a OP para o Corte/Produção primeiro.','err'); return; }
  const oo=lista.map(o=>`<option value="${o.id}">${esc(o.numero)} · ${esc(o.pedido?o.pedido.numero:'')} · [${(o.status||'').replace(/_/g,' ')}] · ${Object.entries(o.gradeTamanhos).map(([t,q])=>t+':'+q).join(' ')}</option>`).join('');
  const lo='<option value="">— sem lote (vincular depois) —</option>'+(lotes||[]).map(l=>`<option value="${l.id}">${esc(l.codigoLote)}${l.nfCompra?' · NF '+esc(l.nfCompra):''}${l.corTecido?' · '+esc(l.corTecido):''}</option>`).join('');
  openModal(`<h3>Gerar kits da OP (um por tamanho)</h3>
    <div class="muted" style="font-size:12px;margin:-6px 0 8px">Puxe uma OP <b>em produção</b>: cada tamanho da grade vira um kit. O lote do tecido é opcional (dá pra vincular depois).</div>
    <div class="mrow"><label class="fl">Ordem de Produção * <span class="muted" style="font-weight:400">(só em produção)</span></label><select id="kg_op" class="inp">${oo}</select></div>
    <div class="mrow"><label class="fl">Lote do tecido (enfesto) <span class="muted" style="font-weight:400">— opcional</span></label><select id="kg_lote" class="inp">${lo}</select></div>
    <div class="grid2">${field('kg_fac','Facção destino','placeholder="ex.: Facção Alfa"')}${field('kg_ppj','Peças por jogo','type="number" min="1" value="1"')}</div>
    <div class="grid3">${field('kg_enf','Enfesto','placeholder="EF-000184"')}${field('kg_oc','Ordem de corte','placeholder="OC-000241"')}${field('kg_mesa','Mesa de corte','')}</div>
    <div class="grid2">${field('kg_op2','Operador do corte','')}${field('kg_cor','Cor (se não vier do pedido)','')}</div>
    ${field('kg_caixa','Caixa de armazenamento','placeholder="ex.: CX-01"')}
    <div class="mactions"><button class="btn-sm" onclick="APP.closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="APP.saveKitsDaOp()">Gerar kits</button></div>`);

async function saveKitsDaOp(){
  const body={ opId:Number(val('kg_op')),
    faccaoNome:val('kg_fac')||undefined, enfesto:val('kg_enf')||undefined, ordemCorte:val('kg_oc')||undefined,
    mesaCorte:val('kg_mesa')||undefined, operadorCorte:val('kg_op2')||undefined, cor:val('kg_cor')||undefined, caixa:val('kg_caixa')||undefined };
  const loteId=Number(val('kg_lote')); if(loteId>0) body.loteTecidoId=loteId;
  const ppj=Number(val('kg_ppj')); if(ppj>0) body.pecasPorJogo=ppj;
  if(!body.opId){ toast('Selecione a OP.','err'); return; }
  try{ const r=await api('/kits/gerar-da-op',{method:'POST',body}); closeModal();
    toast(r.total+' kit(s) gerados da OP '+r.op+' (lote '+r.lote+').','ok');

async function kitEtiqueta(id, silencioso){
  try{
    const r=await api('/kits/'+id+'/etiqueta');
    if(window.BrowserPrint && window.BrowserPrint.getDefaultDevice){
      window.BrowserPrint.getDefaultDevice('printer', dev=>dev.send(r.zpl, ()=>{}, ()=>imprimirEtiquetaKit(r.dados,r.zpl,silencioso)), ()=>imprimirEtiquetaKit(r.dados,r.zpl,silencioso));

}

// mudou (novo deploy), mostramos um banner p/ recarregar com 1 clique.
(function autoUpdate(){
  let baseline=null, avisado=false;
  async function check(){
    try{
      const r=await fetch('/?_v='+Date.now(),{method:'HEAD',cache:'no-store'});
      const tag=r.headers.get('etag')||r.headers.get('last-modified'); if(!tag) return;
      if(baseline===null){ baseline=tag; return; }
      if(tag!==baseline && !avisado){ avisado=true;
        if(document.getElementById('updbanner')) return;
        const b=document.createElement('div'); b.id='updbanner';
        b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:99999;background:#3a2f08;color:#f4e9c1;padding:11px 18px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font-weight:800;cursor:pointer';
        b.innerHTML='🔄 Nova versão disponível — clique para atualizar';
        b.onclick=()=>{ try{location.reload(true);}catch(_){ location.reload(); } };
        document.body.appendChild(b);
      }
    }catch(_){}
  }
  setTimeout(check,4000); setInterval(check,180000); window.addEventListener('focus',check);
})();
boot();
})();
