# Render Blueprint — Cherkesian ERP Backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cherkesian-erp-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev garante @nestjs/cli, typescript e prisma no build
    # (NODE_ENV=production faria o npm pular as devDependencies)
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # migrate deploy aplica as migrations no Neon antes de subir a API
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Segredos e URLs do banco: preencha no painel do Render (sync:false = não versionado)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: TIMEZONE
        value: America/Sao_Paulo
      # Host(s) que devem abrir o Portal do Cliente (portal.html) na raiz.
      # Aponte o subdomínio (CNAME na Wix) + Custom Domain no Render para cá.
      - key: PORTAL_HOSTS
        value: portal.hcqualitycorp.com.br
      # E-mail que recebe o aviso de cada pedido enviado pelo Portal do Cliente.
      - key: PORTAL_AVISO_EMAIL
        value: contato@hcqualitycorp.com.br
      # --- Anexos fora do banco (bucket S3-compatível: Cloudflare R2) ---
      # Sem as quatro, o sistema guarda tudo em base64 no banco, como antes.
      # O endpoint carrega o ID da conta Cloudflare, então também não é versionado.
      - key: ARQUIVOS_ENDPOINT
        sync: false
      - key: ARQUIVOS_CHAVE
        sync: false
      - key: ARQUIVOS_SEGREDO
        sync: false
      - key: ARQUIVOS_BUCKET
        value: cherkesian-anexos
      # Opcional: restrinja o CORS ao domínio do frontend em produção
      # - key: CORS_ORIGIN
      #   value: https://seu-frontend.com
